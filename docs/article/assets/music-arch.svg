<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="640" fill="#0b1220"/>

  <!-- title -->
  <text x="450" y="40" text-anchor="middle" fill="#e2e8f0" font-size="21" font-weight="700">ionic-music：一条命令从页面走到后端再回来</text>
  <text x="450" y="62" text-anchor="middle" fill="#64748b" font-size="12">前端 Ionic Vue（系统 WebView）· 框架 cj-tauri（跨平台共用）· 后端仓颉</text>

  <!-- Layer 1: 前端 -->
  <rect x="40" y="84" width="720" height="120" rx="12" fill="#0f1b2e" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="60" y="110" fill="#60a5fa" font-size="13" font-weight="700">① 前端 —— 系统 WebView 里的 Ionic Vue</text>
  <text x="60" y="128" fill="#94a3b8" font-size="11">@ionic/vue · vue-router · ionicons · 深色主题（ion-palette-dark 挂 &lt;html&gt;）</text>
  <g font-size="12" fill="#e2e8f0" text-anchor="middle">
    <rect x="70" y="142" width="118" height="44" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="129" y="169">轮播 · 歌单</text>
    <rect x="202" y="142" width="118" height="44" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="261" y="169">推荐歌单</text>
    <rect x="334" y="142" width="118" height="44" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="393" y="169">热歌榜</text>
    <rect x="466" y="142" width="118" height="44" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="525" y="169">播放条</text>
    <rect x="598" y="142" width="118" height="44" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="657" y="169">歌词页</text>
  </g>

  <!-- invoke arrow -->
  <line x1="400" y1="204" x2="400" y2="238" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="418" y="212" width="330" height="22" rx="6" fill="#0f2436"/>
  <text x="430" y="228" fill="#7dd3fc" font-size="12" font-family="Consolas,monospace">window.__CJ_TAURI__.invoke('music:hot')</text>

  <!-- Layer 2: 框架 -->
  <rect x="40" y="240" width="720" height="96" rx="12" fill="#111a2e" stroke="#38bdf8" stroke-width="1.4"/>
  <text x="60" y="266" fill="#38bdf8" font-size="13" font-weight="700">② 框架 cj-tauri —— 跨平台共用，平台差异不进这里</text>
  <g font-size="12" fill="#e2e8f0" text-anchor="middle">
    <rect x="70" y="280" width="200" height="42" rx="8" fill="#13233a" stroke="#38bdf8"/>
    <text x="170" y="300">能力校验</text>
    <text x="170" y="315" fill="#94a3b8" font-size="10">capability 白名单</text>
    <rect x="292" y="280" width="200" height="42" rx="8" fill="#13233a" stroke="#38bdf8"/>
    <text x="392" y="300">命令分发</text>
    <text x="392" y="315" fill="#94a3b8" font-size="10">worker 线程 · 不卡 UI</text>
    <rect x="514" y="280" width="200" height="42" rx="8" fill="#13233a" stroke="#38bdf8"/>
    <text x="614" y="300">结果回投</text>
    <text x="614" y="315" fill="#94a3b8" font-size="10">jsSink → 页面 promise</text>
  </g>
  <line x1="270" y1="301" x2="292" y2="301" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="492" y1="301" x2="514" y2="301" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- split arrows -->
  <line x1="230" y1="336" x2="190" y2="372" stroke="#a78bfa" stroke-width="2.2" marker-end="url(#ar2)"/>
  <line x1="560" y1="336" x2="600" y2="372" stroke="#a78bfa" stroke-width="2.2" marker-end="url(#ar2)"/>

  <!-- Layer 3A: 仓颉后端命令 -->
  <rect x="40" y="374" width="330" height="120" rx="12" fill="#1a1430" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="60" y="400" fill="#c4b5fd" font-size="13" font-weight="700">③a 仓颉后端命令</text>
  <text x="60" y="420" fill="#94a3b8" font-size="11" font-family="Consolas,monospace">music:hot / search / menus</text>
  <text x="60" y="438" fill="#94a3b8" font-size="11" font-family="Consolas,monospace">music:lyric / image / share</text>
  <text x="60" y="456" fill="#94a3b8" font-size="11" font-family="Consolas,monospace">fav:get / fav:set / music:quit</text>
  <text x="60" y="480" fill="#7c6fb0" font-size="10.5">命令三处联动：register + capability + invoke</text>

  <!-- Layer 3B: 宿主能力 -->
  <rect x="530" y="374" width="230" height="120" rx="12" fill="#1a1430" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="550" y="400" fill="#c4b5fd" font-size="13" font-weight="700">③b 宿主能力</text>
  <text x="550" y="424" fill="#94a3b8" font-size="11">带正确 Referer</text>
  <text x="550" y="442" fill="#94a3b8" font-size="11">取封面 → data: URL</text>
  <text x="550" y="464" fill="#7c6fb0" font-size="10.5">页面直连防盗链图源必灭</text>
  <text x="550" y="480" fill="#7c6fb0" font-size="10.5">（列表 200px / 播放 500px 懒加载）</text>

  <!-- data source -->
  <line x1="205" y1="494" x2="205" y2="530" stroke="#a78bfa" stroke-width="2.2" marker-end="url(#ar2)"/>
  <rect x="90" y="532" width="230" height="46" rx="10" fill="#0f1b2e" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="205" y="553" text-anchor="middle" fill="#fbbf24" font-size="12.5" font-weight="700">音乐接口（http 网关）</text>
  <text x="205" y="569" text-anchor="middle" fill="#94a3b8" font-size="10.5">+ mongodb · CJ_MUSIC_API 可覆盖</text>

  <!-- 鸿蒙 ribbon -->
  <rect x="360" y="532" width="400" height="46" rx="10" fill="#04221f" stroke="#10b981" stroke-width="1.4"/>
  <text x="380" y="553" fill="#34d399" font-size="12.5" font-weight="700">同一工程上鸿蒙</text>
  <text x="380" y="569" fill="#6ee7b7" font-size="10.5">cj-tauri sync ohos → DevEco；页面进 rawfile · 宿主 host_arkweb（ArkWeb）</text>

  <text x="450" y="620" text-anchor="middle" fill="#475569" font-size="10.5">前端零约束：Ionic 组件在系统 WebView 直接工作，不需要任何桥接适配</text>
</svg>
