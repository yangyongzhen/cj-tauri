[package]
  cjc-version = "1.0.5"
  name = "aiChat"
  description = "ai-chat - AI 对话客户端（cj-tauri 示例：http 插件主机白名单 + SSE 流式首个消费者）"
  version = "0.1.0"
  target-dir = ""
  output-type = "executable"
  compile-option = ""
  override-compile-option = ""
  link-option = ""
  package-configuration = {}

[dependencies]
  # cj-tauri 框架本体（本仓库内相对路径）
  cjTauri = { path = "../.." }

[target.x86_64-unknown-linux-gnu]
  # 末尾的 -lcjTauri.plugins.fs 是**必要的显式补齐**，不是冗余：本应用同时 import std.fs 与
  # cjTauri.plugins.fs（两者短名都是 fs），cjpm 生成的链接命令行会漏掉插件那个库，报
  # `undefined reference to cjTauri.plugins.fs:FsPlugin.ti`（看着像「插件没实现」，其实是没链上）。
  # 实测：与 import 先后顺序无关；其余 5 个插件照常自动进链接行；plugin-fs 示例同样两个 import 却不受影响。
  # 链接行本身带 --start-group/--end-group，所以库的先后顺序无碍。
  link-option = "-L../../native -lcjtbridge -lwebkit2gtk-4.1 -lgtk-3 -lgdk-3 -lglib-2.0 -lgio-2.0 -lsoup-3.0 -ljavascriptcoregtk-4.1 -lgobject-2.0 -lcjTauri.plugins.fs"

[target.x86_64-unknown-linux-gnu.bin-dependencies]
    path-option = ["${CANGJIE_STDX}"]

[target.x86_64-w64-mingw32]
  # GUI 子系统：双击不弹 DOS 黑窗口，stderr 仍走重定向（AGENTS §4）；末尾同款补齐 fs 插件库
  link-option = "-L../../native -lcjtbridge --subsystem=windows -lcjTauri.plugins.fs"

[target.x86_64-w64-mingw32.bin-dependencies]
    path-option = ["${CANGJIE_STDX}"]
