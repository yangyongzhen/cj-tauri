<style>
  /* ---- 主题：默认跟随系统（body.light 切换变量）----
   * 暗色是根变量本体；亮色只覆写颜色族。代码块两主题都保持暗底（github-dark 主题
   * 内联只有一份，聊天 UI 里暗底代码块在亮色页面下也是主流形态） */
  :root {
    --bg:#0f1117; --panel:#161a23; --panel2:#1c2130; --line:#262c3b;
    --fg:#e8eaf0; --dim:#8b93a7; --acc:#6c8cff; --acc2:#8a6cff;
    --user:#243055; --radius:12px;
  }
  body.light {
    --bg:#f6f7fb; --panel:#ffffff; --panel2:#eef0f6; --line:#dfe3ec;
    --fg:#1c2130; --dim:#6b7280; --acc:#4f6ef7; --acc2:#7c5cff;
    --user:#e3e9ff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { color-scheme: dark; }
  body.light { color-scheme: light; }
  body { display:flex; height:100vh; overflow:hidden; background:var(--bg); color:var(--fg);
         font:14px/1.65 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
         transition:background .15s,color .15s; }
  ::-webkit-scrollbar { width:8px; }
  ::-webkit-scrollbar-thumb { background:#2c3345; border-radius:4px; }
  ::-webkit-scrollbar-thumb:hover { background:#3a4258; }
  /* ---- 左栏 ---- */
  #side { width:248px; background:var(--panel); display:flex; flex-direction:column;
          border-right:1px solid var(--line); flex:0 0 auto; }
  #side .brand { padding:18px 16px 10px; font-size:15px; font-weight:700;
                 background:linear-gradient(90deg,var(--acc),var(--acc2));
                 -webkit-background-clip:text; background-clip:text; color:transparent; }
  #side .sub { padding:0 16px 12px; font-size:11px; color:var(--dim); border-bottom:1px solid var(--line); }
  #convList { flex:1 1 auto; overflow-y:auto; padding:10px; }
  .conv { padding:9px 12px; border-radius:9px; cursor:pointer; margin-bottom:3px; font-size:13px;
          color:var(--dim); transition:background .12s,color .12s;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .conv:hover { background:var(--panel2); color:var(--fg); }
  .conv.active { background:linear-gradient(90deg,#2a3560,#2a2c50); color:#fff; font-weight:500; }
  .conv .del { float:right; opacity:0; padding:0 4px; transition:opacity .12s; }
  .conv:hover .del { opacity:.65; }
  .conv .del:hover { opacity:1; color:#ff7b72; }
  #sideBtns { padding:12px; border-top:1px solid var(--line); display:flex; gap:8px; }
  /* ---- 顶栏 ---- */
  #topbar { display:flex; align-items:center; gap:10px; padding:10px 18px;
            border-bottom:1px solid var(--line); background:var(--panel); flex:0 0 auto; }
  #convTitle { flex:1 1 auto; min-width:0; font-size:13px; font-weight:600;
               white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #modelBadge { flex:0 0 auto; font-size:11px; color:var(--dim); border:1px solid var(--line);
                border-radius:10px; padding:2px 10px; max-width:220px; white-space:nowrap;
                overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  #modelBadge:hover { color:var(--fg); border-color:var(--acc); }
  /* 服务商切换下拉：挂在顶栏右上角（徽章正下方） */
  #provMenu { position:absolute; top:44px; right:16px; background:var(--panel);
              border:1px solid var(--line); border-radius:10px; padding:6px; min-width:240px;
              max-height:320px; overflow-y:auto; display:none; z-index:50;
              box-shadow:0 12px 40px rgba(0,0,0,.4); }
  #provMenu.show { display:block; }
  .pm-item { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:7px;
             cursor:pointer; font-size:13px; }
  .pm-item:hover { background:var(--panel2); }
  .pm-item.active { color:var(--acc); font-weight:600; }
  .pm-item .pm-model { font-size:11px; color:var(--dim); margin-left:auto; max-width:150px;
                       white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tb-btn { padding:6px 12px; border-radius:8px; font-size:12.5px; }
  /* ---- 主栏 ---- */
  #main { flex:1 1 auto; min-width:0; display:flex; flex-direction:column;
          background:var(--bg); }
  body:not(.light) #main { background:radial-gradient(1200px 500px at 70% -10%, #1a2033 0%, var(--bg) 60%); }
  #msgs { flex:1 1 auto; overflow-y:auto; padding:24px 3.5vw; }
  /* 宽度跟随窗口：min(1080px, 94%)——最大化不再留大片空白，窄窗下留边距不贴边 */
  .msg { margin-bottom:18px; max-width:min(1080px, 94%); }
  .msg .who { font-size:11px; letter-spacing:.08em; color:var(--dim); margin-bottom:5px;
              text-transform:uppercase; }
  .msg.assistant .who { color:var(--acc); }
  .msg .body { white-space:pre-wrap; word-break:break-word; }
  .msg.user .body { background:var(--user); display:inline-block; padding:10px 14px;
                    border-radius:var(--radius); border-bottom-right-radius:4px;
                    box-shadow:0 1px 4px rgba(0,0,0,.3); }
  .msg.assistant .body { background:var(--panel); padding:12px 16px; border-radius:var(--radius);
                         border-bottom-left-radius:4px; border:1px solid var(--line); }
  .msg.assistant .body .cursor { display:inline-block; width:8px; height:15px;
        background:var(--acc); vertical-align:-2px; animation:blink .8s step-end infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .msg .body p { margin:6px 0; }
  .msg .body pre { background:#0c0e14; padding:12px 14px; border-radius:8px; overflow-x:auto;
                   margin:10px 0; border:1px solid var(--line); position:relative; }
  .code-copy { position:absolute; top:6px; right:8px; padding:2px 8px; border-radius:5px;
               font-size:11px; background:#262c3b; color:var(--dim); border:1px solid var(--line);
               cursor:pointer; opacity:0; transition:opacity .12s; }
  pre:hover .code-copy { opacity:1; }
  .code-copy:hover { color:var(--fg); }
  .code-copy.copied { color:#7ee2a8; opacity:1; }
  .msg-copy { padding:2px 8px; border-radius:5px; font-size:11px; background:transparent;
              color:var(--dim); border:1px solid var(--line); cursor:pointer;
              opacity:0; transition:opacity .12s; }
  .msg:hover .msg-copy { opacity:1; }
  .msg-copy:hover { color:var(--fg); }
  .msg-copy.copied { color:#7ee2a8; opacity:1; }
  .msg .body pre code { color:#d6dbe6; }
  /* 语法高亮四色：关键字紫 / 字符串橙 / 注释绿灰 / 数字青 */

  .msg .body pre .s { color:#f4a259; }
  .msg .body pre .c { color:#7a8478; font-style:italic; }

  .msg .body p code, .msg .body li code { background:#0c0e14; padding:1px 6px; border-radius:4px;
                                          border:1px solid var(--line); }
  .msg .body a { color:var(--acc); text-decoration:none; }
  .msg .body a:hover { text-decoration:underline; }
  .msg .body strong { color:#fff; }
  #typing { color:var(--dim); font-size:12px; padding:4px 26px 8px; display:none; }
  /* ---- 输入区 ---- */
  #inputBar { border-top:1px solid var(--line); padding:14px 18px; display:flex; gap:10px;
              align-items:flex-end; flex:0 0 auto; background:var(--panel); }
  #input { flex:1 1 auto; min-width:0; background:var(--panel2); border:1px solid var(--line);
           color:var(--fg); border-radius:10px; padding:11px 14px; font:inherit; resize:none;
           height:66px; transition:border-color .15s; }
  #input:focus { outline:none; border-color:var(--acc);
                 box-shadow:0 0 0 3px rgba(108,140,255,.15); }
  button { background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff; border:0;
           border-radius:10px; padding:10px 20px; font:inherit; font-weight:500; cursor:pointer;
           flex:0 0 auto; transition:filter .12s,transform .05s; }
  button:hover { filter:brightness(1.12); }
  button:active { transform:scale(.97); }
  button:disabled { opacity:.4; cursor:default; filter:none; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--dim); }
  button.ghost:hover { color:var(--fg); border-color:var(--dim); }
  /* ---- 设置弹层 ---- */
  #mask { position:fixed; inset:0; background:rgba(5,7,12,.6); backdrop-filter:blur(3px);
          display:none; align-items:center; justify-content:center; }
  #mask.show { display:flex; }
  #cfg { background:var(--panel); border:1px solid var(--line); border-radius:14px;

  #cfg h2 { font-size:16px; margin-bottom:6px; }
  .row { margin-bottom:12px; }
  .row label { display:block; font-size:12px; color:var(--dim); margin-bottom:5px; }

  .row input:focus { outline:none; border-color:var(--acc); }
  .hint { font-size:12px; color:var(--dim); margin:10px 0; }
  /* ---- 服务商管理 ---- */
  .prov { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:9px;
          border:1px solid var(--line); margin-bottom:6px; cursor:pointer; transition:border-color .12s; }
  .prov:hover { border-color:var(--dim); }
  .prov.active { border-color:var(--acc); background:rgba(108,140,255,.08); }
  .prov-main { flex:1 1 auto; min-width:0; font-size:13px; }
  .prov-sub { font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden;

  .badge { display:inline-block; margin-left:8px; padding:0 6px; border-radius:4px;

  .prov-acts { flex:0 0 auto; display:flex; gap:6px; }

<script>
'use strict';
/* ============================================================
 * ai-chat 前端：零新命令——出网走 http:postStream（SSE），持久化走 store:*。
 * 流程：invoke('http:postStream') 立即返回前，宿主已在按块读响应体并推
 * http:chunk 事件（emitLatest）；命令的 resolve 值是最终统计（received 等）。
 * ============================================================ */

function waitForBridge() {
  return new Promise(function (resolve) {
    if (window.__CJ_TAURI__ && window.__CJ_TAURI__.invoke) { resolve(); return; }
    var t = setInterval(function () {
      if (window.__CJ_TAURI__ && window.__CJ_TAURI__.invoke) { clearInterval(t); resolve(); }
    }, 50);
  });
}

/* ---- 复制：系统剪贴板（clipboard:write），成功后按钮短暂变「已复制」----
 * 代码块每个都带复制钮（类名上标 data-ci 指向 blocks 数组下标，渲染后统一绑事件）；
 * 消息级复制走 hover 浮出的「复制」小钮（存原文，复制的是 Markdown 源而不是渲染后 HTML） */
var copySeq = 0;
function copyText(text, btn) {
  var done = function (ok) {
    if (!btn) { return; }
    var old = btn.textContent;
    btn.textContent = ok ? '已复制' : '复制失败';
    btn.classList.add('copied');
    var seq = ++copySeq;
    setTimeout(function () {
      if (seq === copySeq) { btn.textContent = old; btn.classList.remove('copied'); }
    }, 1200);
  };
  try {
    window.__CJ_TAURI__.invoke('clipboard:write', { text: text }).then(function () { done(true); },
      function () { done(false); });
  } catch (e) { done(false); }
}

function bindCopyButtons(root) {
  var btns = root.querySelectorAll('.code-copy');
  for (var i = 0; i < btns.length; i++) {
    btns[i].onclick = function () {
      var ci = +this.getAttribute('data-ci');
      var txt = this.getAttribute('data-raw') || '';
      copyText(txt, this);
    };
  }
}

/* ---- 极简 Markdown 渲染：先转义 HTML，再放行受控标记 ----
 * 模型输出是**不可信内容**，绝不能 innerHTML 直插（XSS）。
 * 顺序：整段转义 → 代码块/行内代码/粗体/斜体/标题/链接（链接 href 只许 http(s)）。
 */
function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ---- 代码块语法高亮：单遍 tokenizer（注释/字符串/数字/关键字）----
 * 为什么不引 highlight.js：那要 vendor 一百多 KB 且本页面走内联（run(html)），零外部资源
 * 是前提；模型输出的代码块用「注释绿、字符串橙、数字青、关键字紫」四色分清就足够可读。
 * 单遍扫描、状态机互斥（字符串/注释里的关键字不当关键字），先转义后加 span 时
 * 只对**词法片段**包 span，不产生未转义的尖括号。
 */
/* ---- 代码块语法高亮：highlight.js（vendor 内联，markdown-notes 同款）----
 * 与手写 tokenizer 的取舍（2026-10-16 用户裁定）：web 前端生态正是这套技术的优势，
 * 该用就用——自动语言检测、覆盖 190+ 语言、词法完备度都远好于四色手写版；
 * 「内联」仍是前提（run(html) 无真实来源，相对 src 取不到文件），但内联的是
 * **成熟的库**，不是自己维护的 tokenizer。
 */
function renderMd(src) {
  var blocks = [];
  // 先摘代码块（hljs 高亮后占位，避免里面的标记被二次加工）
  var text = src.replace(/```(\w*)\n?([\s\S]*?)```/g, function (m, lang, code) {
    var body = code.replace(/\n$/, '');
    var html = '';
    try {
      // 带语言标注就按语言，否则自动检测
      html = lang ? hljs.highlight(body, { language: lang, ignoreIllegals: true }).value
                  : hljs.highlightAuto(body).value;
    } catch (e) {
      html = escHtml(body);   // 未知语言/库缺失：退化为纯转义，不能整条失败
    }
    var idx = blocks.length;
    blocks.push('<pre><code class="hljs">' + html + '</code>' +
      // 复制按钮的原文进 data-raw（转义引号防属性逃逸）——复制的是源码，不是高亮 HTML
      '<button class="code-copy" data-ci="' + idx + '" data-raw="' +
      body.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;') + '">复制</button></pre>');
    return '\u0000B' + idx + '\u0000';
  });
  text = escHtml(text);
  text = text.replace(/`([^`\n]+)`/g, function (m, c) { return '<code>' + c + '</code>'; });
  text = text.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/(^|\n)#{1,4}\s+([^\n]+)/g, '$1<strong>$2</strong>');
  // 链接：href 白名单 http/https，其余只留文字
  text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, label, href) {
    if (/^https?:\/\//.test(href)) {
      return '<a href="' + href + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
    }
    return label;
  });
  // 按双换行切段；段内单换行保留（white-space:pre-wrap 兜着）
  text = text.split(/\n{2,}/).map(function (p) {
    if (/^\u0000B\d+\u0000$/.test(p.trim())) { return p; }
    return '<p>' + p + '</p>';
  }).join('');
  return text.replace(/\u0000B(\d+)\u0000/g, function (m, i) { return blocks[+i]; });
}

/* ---- 主题：auto（跟随系统）/ light / dark 三态轮换，存档持久化 ----
 * auto 用 matchMedia 监听系统变化实时切；亮色只是 body.light 覆写变量，
 * 代码块两态都保持暗底（github-dark 一份主题） */
var themeMode = 'auto';
var sysDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

function applyTheme() {
  var light = themeMode === 'light' || (themeMode === 'auto' && sysDark && !sysDark.matches);
  document.body.className = light ? 'light' : '';
  var label = themeMode === 'auto' ? '主题: 系统' : (themeMode === 'light' ? '主题: 亮' : '主题: 暗');
  $('btnTheme').textContent = label;
}
function cycleTheme() {
  themeMode = themeMode === 'auto' ? 'light' : (themeMode === 'light' ? 'dark' : 'auto');
  applyTheme();
  saveState();
}
if (sysDark && sysDark.addEventListener) {
  sysDark.addEventListener('change', function () { if (themeMode === 'auto') { applyTheme(); } });
}

/* ---- 服务商管理（AQBot 式）：主流预设 + 自定义，多服务商并存、一键切换 ----
 * 预设只填 base/model，Key 仍由用户填（预设 ≠ 放行：出网白名单在 capabilities 的
 * scopes.http 里，新增服务商如果白名单没覆盖，发消息会明确报 scope 拒绝）。
 * 旧存档是单份 cfg——读档时迁移成 providers[0]，不丢数据。 */
var PROVIDER_PRESETS = [
  { name: 'DeepSeek',  baseUrl: 'https://api.deepseek.com/chat/completions',       model: 'deepseek-chat' },
  { name: 'OpenAI',    baseUrl: 'https://api.openai.com/v1/chat/completions',      model: 'gpt-4o-mini' },
  { name: 'GLM 智谱',  baseUrl: 'https://open.bigmodel.cn/api/paas/v4/chat/completions', model: 'glm-4-flash' },
  { name: '通义千问',   baseUrl: 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', model: 'qwen-plus' },
  { name: 'Kimi 月之暗面', baseUrl: 'https://api.moonshot.cn/v1/chat/completions',  model: 'moonshot-v1-8k' },
  { name: '自定义',     baseUrl: '',                                               model: '' }
];

var providers = [];          // [{name, baseUrl, apiKey, model}]
var activeIdx = 0;
// 兼容层：其余代码仍读 cfg.base/cfg.key/cfg.model（getter 指到当前服务商）
var cfg = {
  get base() { return (providers[activeIdx] || {}).baseUrl || ''; },
  get key() { return (providers[activeIdx] || {}).apiKey || ''; },

function loadState() {

    try {

      if (Array.isArray(s.providers) && s.providers.length > 0) {

      } else if (s.cfg && (s.cfg.base || s.cfg.key)) {

function appendMsgEl(role, content, streamingNow) {

      var idx = -1;

      }

/* 重新生成：去掉最后一条助手回复，把同一轮用户消息再发一遍（零新命令，纯前端流程） */
function regenerate(btn) {
  var c = cur();
  if (!c || streaming) { return; }
  var last = c.messages[c.messages.length - 1];
  if (!last || last.role !== 'assistant') { return; }
  var userText = '';
  for (var i = c.messages.length - 2; i >= 0; i--) {
    if (c.messages[i].role === 'user') { userText = c.messages[i].content; break; }
  }
  if (!userText) { return; }
  c.messages.pop();          // 丢掉旧回复
  renderMsgs();
  send(userText, true);      // 走同一发送管道；用户消息已在历史，不重复入库
}
function setBody(el, content, isStreaming) {
  if (isStreaming) {
    // 流式期间：渲染已到文本 + 光标；渲染层每帧整体重画（增量由 emitLatest 聚合）
    el.innerHTML = renderMd(content) + '<span class="cursor"></span>';
  } else {
    el.innerHTML = renderMd(content);
  }
}

/* ---- 发送与流式接收 ---- */
function buildMessages(userText) {
  var ms = [];
  if (sysPrompt) { ms.push({ role: 'system', content: sysPrompt }); }
  var c = cur();
  c.messages.forEach(function (m) { ms.push({ role: m.role, content: m.content }); });
  ms.push({ role: 'user', content: userText });
  return ms;
}

/* send(text?)：text 缺省取输入框；skipPush（重新生成）时用户消息已在历史里，不再入库 */
function send(text, skipPush) {
  var input = $('input');
  if (text === undefined) { text = input.value.trim(); }
  if (!text || streaming) { return; }
  if (!cfg.key) { openCfg(); return; }
  var c = cur();
  if (!c) { newConv(); c = cur(); }
  if (c.messages.length === 0) { c.title = text.slice(0, 18); renderConvs(); }
  if (!skipPush) {
    c.messages.push({ role: 'user', content: text });
  }
  appendMsgEl('user', text);
  input.value = '';
  var body = appendMsgEl('assistant', '');
  var acc = '';
  streaming = true; abortFlag = false;
  setStreamingUi(true);
  // 诊断：每一步都留痕（AGENTS §4「看不见的失败最贵」——没反应时日志必须能说清断在哪）
  var trace = function (m) { try { window.__CJ_TAURI__.log.write('[aichat] ' + m); } catch (e) {} };
  var nChunk = 0;

  // 事件监听先于 invoke 挂上（命令发出后块可能立刻到达）
  var off = window.__CJ_TAURI__.listen('http:chunk', function (p) {
    if (p.done) { return; }            // 收尾用命令 resolve 对账，避免事件与 resolve 竞争
    nChunk++;
    acc += p.delta || '';
    // **画解析后的文本，不画原始字节流**：acc 是 SSE 原文（data: {...} 行），
    // 直接渲染会把原始报文闪现在气泡里（实测踩过）；sseToText 全量重解，几十 KB 无感
    setBody(body, sseToText(acc), true);
  });
  trace('send: invoke postStream, listen on http:chunk');

  var payload = JSON.stringify({ model: cfg.model, messages: buildMessages(text), stream: true });
  window.__CJ_TAURI__.invoke('http:postStream', {
    url: cfg.base,
    body: payload,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key }
  }).then(function (stat) {
    off();
    // SSE 帧 → 纯文本（宿主只回投字节，帧解析在前端：data: 行取 JSON，拼 delta，[DONE] 收）
    var full = sseToText(acc);
    // **错误必须可见**：一条 data: 行都没有 ≠ 空回复——多半是 Base URL 不对（打到非
    // chat/completions 端点，HTTP 404/HTML 都算），或服务端回了非流式错误体。
    // 静默空白是最贵的失败形状（实测踩过：根路径 404，界面一点反应都没有）。
    if (full === '') {
      var hint = '没有收到任何流式内容（HTTP ' + (stat && stat.status ? stat.status : '?') +
        '，共 ' + (stat && stat.received ? stat.received : 0) + ' 字节）。' +
        '最常见原因：Base URL 不是完整的 chat/completions 端点' +
        '（DeepSeek 应为 https://api.deepseek.com/chat/completions，不带 /v1）。';
      if (acc && acc.indexOf('<') === 0) { hint += ' 服务端返回的是 HTML 页面而非 SSE 流。'; }
      full = '**[错误]** ' + hint;
    }
    c.messages.push({ role: 'assistant', content: full });
    setBody(body, full, false);
    if (stat && stat.truncated) { appendNote('（回复过长被截断）'); }
    streaming = false; setStreamingUi(false);
    saveState();
  }).catch(function (e) {
    off();
    if (abortFlag) {
      // 主动停止：留已收到的部分，不算错误
      if (acc) { c.messages.push({ role: 'assistant', content: sseToText(acc) + '\n\n（已停止）' }); }
      setBody(body, sseToText(acc) + (acc ? '\n\n（已停止）' : '（已停止）'), false);
    } else {
      var msg = '请求失败：' + (e && e.message ? e.message : String(e));
      c.messages.push({ role: 'assistant', content: msg });
      setBody(body, msg, false);
      appendNote('若提示 scope/白名单，请到 设置 里确认 Base URL 在白名单内');
    }
    streaming = false; setStreamingUi(false);
    saveState();
  });
}

/* ---- SSE 帧解析（前端侧）：OpenAI 兼容格式 ----
 * 宿主的 http:chunk 只给字节增量；这里维护跨事件的不完整行。
 */
var sseLineBuf = '';
function sseToText(acc) {
  // acc 是**累计字节流**的文本（emitLatest 只保最新，所以每次全量重解，
  // 简单且无状态——几十 KB 的重解成本远低于流式等待本身）
  var out = '';
  var lines = acc.split('\n');
  lines.forEach(function (line) {
    var t = line.trim();
    if (t.indexOf('data:') !== 0) { return; }
    var d = t.slice(5).trim();
    if (!d || d === '[DONE]') { return; }
    try {
      var j = JSON.parse(d);
      var ch = j.choices && j.choices[0];
      var delta = ch && ch.delta && ch.delta.content;
      if (typeof delta === 'string') { out += delta; }
      // 兼容非流式错误返回
      if (j.error && j.error.message) { out += '\n\n[服务端错误] ' + j.error.message; }
    } catch (e) { /* 半截 JSON（块边界）等下一轮 */ }
  });
  return out;
}

function appendNote(text) {
  var n = document.createElement('div');
  n.className = 'hint';
  n.textContent = text;
  msgsEl.appendChild(n);
}

/* ---- 自检探针（CJ_AICHAT_SELFCHECK=1 时无人值守跑一轮） ---- */

  var probe = document.createElement('div');

  ok('layout-fluid', mw.indexOf('820') === -1 && mw.indexOf('min(') !== -1);
  msgsEl.removeChild(probe);
  // 主题三态：applyTheme 后 body 类名与按钮文案必须一致（亮/暗/跟随系统）
  themeMode = 'light'; applyTheme();
  ok('theme-light', document.body.className === 'light' && $('btnTheme').textContent.indexOf('亮') !== -1);
  themeMode = 'dark'; applyTheme();

  themeMode = 'auto'; applyTheme();
  ok('md-escape', renderMd('<img src=x onerror=alert(1)>').indexOf('<img') === -1);
  // 代码块里的 HTML 必须被转义（hljs 也会包 span，但尖括号本体必须是实体——XSS 防线）

  // 流式期间画的是解析后文本：原始 SSE 帧（data: {...}）不许出现在气泡里（实测踩过）
  ok('stream-no-raw', sseToText('data: {"choices":[{"delta":{"content":"hello world"}}]}\n\ndata: [DONE]\n').indexOf('data:') === -1);
  ok('sse-delta', sseToText('data: {"choices":[{"delta":{"content":"A"}}]}\n\ndata: [DONE]\n') === 'A');
  ok('sse-half', sseToText('data: {"choices":[{"delta":{"cont') === '');
  ok('link-safe', renderMd('[x](javascript:alert(1))').indexOf('javascript') === -1);
  // 端到端只有真网可用时才有意义：无 Key 时直发白名单内的默认端点，
  // 服务端会回 401/400（HTTP 层成功返回、或业务报错都算「链路通」）——
  // 只有 scope/白名单拒绝才算链路断（那说明命令没走到网络层）。
  // （实测：deepseek 对无鉴权请求回 400 的 JSON，invoke 正常 resolve——
  //   最初把「resolve 了」判 FAIL 是断言写反了，恰好证明白名单放行 + 网络可达。）
  var p = window.__CJ_TAURI__.invoke('http:post', { url: cfg.base, body: '{}' }).then(function (s) {
    ok('http-reach-server', !!s && s.status >= 400);
    return r;
  }).catch(function (e) {
    ok('http-reach-server', String(e && e.message).indexOf('scope') === -1);
    return r;
  });
  p.then(function () {
    // 有 Key 时再补一条**真流式**探针：postStream 实发一条小消息，数 chunk 到达数
    // （链路真正的端到端验证——上面那条只证明非流式 POST 可达）
    var done4 = function (extra) {
      r = r.concat(extra);
      // 分母只数断言（PASS/FAIL）；INFO 是诊断行，不是断言——算进去永远差 1/10（实测踩过）
      var asserts = r.filter(function (x) { return x.indexOf('INFO') !== 0; });
      var pass = asserts.filter(function (x) { return x.indexOf('PASS') === 0; }).length;
      window.__CJ_TAURI__.invoke('log:write', { line: '[aichat] SELFCHECK ' + pass + '/' + asserts.length }).catch(function () {});
      r.forEach(function (x) { window.__CJ_TAURI__.invoke('log:write', { line: '[aichat] ' + x }).catch(function () {}); });
      document.title = 'SELFCHECK ' + pass + '/' + asserts.length;
    };
    if (!cfg.key) { done4([]); return; }
    var chunks = 0;
    var off2 = window.__CJ_TAURI__.listen('http:chunk', function (p) { if (!p.done) { chunks++; } });
    window.__CJ_TAURI__.invoke('http:postStream', {
      url: cfg.base,
      body: JSON.stringify({ model: cfg.model, messages: [{ role: 'user', content: 'reply with exactly: OK' }], stream: true, max_tokens: 8 }),
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key }
    }).then(function (stat) {
      off2();
      ok('postStream-chunks', chunks > 0);
      r.push('INFO postStream received=' + (stat && stat.received) + ' chunks=' + chunks);
      done4([]);
    }).catch(function (e) {
      off2();
      ok('postStream-chunks', false);
      r.push('FAIL postStream: ' + (e && e.message));
      done4([]);
    });
  });
}

/* ---- 启动 ---- */
waitForBridge().then(function () {
  $('btnNew').onclick = function () { if (!streaming) { newConv(); } };
  $('btnCfg').onclick = openCfg;
  $('btnTheme').onclick = cycleTheme;
  // 顶栏徽章 → 服务商切换下拉；点别处收起
  $('modelBadge').onclick = toggleProvMenu;
  document.addEventListener('click', function (ev) {
    var m = $('provMenu');
    if (m.classList.contains('show') && !m.contains(ev.target)) { hideProvMenu(); }
  });
  applyTheme();   // 桥就绪、存档读入后再定主题（auto 需 matchMedia）
  $('btnProvAdd').onclick = function () { openProvForm(-1); };
  $('btnProvDel').onclick = function () {
    if (editIdx >= 0 && editIdx < providers.length && providers.length > 1) {
      providers.splice(editIdx, 1);
      if (activeIdx >= providers.length) { activeIdx = providers.length - 1; }
      closeCfg(); renderProvList(); saveState();
    }
  };
  $('btnCfgCancel').onclick = closeCfg;
  $('btnCfgSave').onclick = saveProv;
  $('btnSend').onclick = send;
  $('btnStop').onclick = stopStream;
  $('input').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); send(); }
  });
  loadState().then(function () {
    if (convs.length === 0) { newConv(); } else { renderConvs(); renderMsgs(); }
    if (window.location.search.indexOf('selfcheck') !== -1 || window.__CJ_TAURI_SELF_CHECK__) {
      setTimeout(selfcheck, 300);
    }
  });
});
</script>
