[package]
  cjc-version = "1.0.5"
  name = "cjnote"
  description = "cjnote — AI 原生 Markdown 笔记（cj-tauri 底座；M1 骨架：三栏 + 笔记列表）"
  version = "0.1.0"
  target-dir = ""
  output-type = "executable"
  compile-option = ""
  override-compile-option = ""
  link-option = ""
  package-configuration = {}

[dependencies]
  # cj-tauri 框架本体：本示例在框架仓库内的 examples/ 下，框架根就是上两级
  cjTauri = { path = "../.." }

[target.x86_64-unknown-linux-gnu]
  # 本应用只 import std.fs（笔记存取在自研的 NoteStore 里），**不引 cjTauri.plugins.fs**，
  # 所以这里不需要那条 -lcjTauri.plugins.fs（ai-chat 需要它是因为它真引了 fs 插件）。
  # 哪天给本应用加 fs 插件命令，记得把插件库补回链接行，否则报
  # undefined reference to cjTauri.plugins.fs:FsPlugin.ti（AGENTS §4 有这条坑）
  link-option = "-L../../native -lcjtbridge -lwebkit2gtk-4.1 -lgtk-3 -lgdk-3 -lglib-2.0 -lgio-2.0 -lsoup-3.0 -ljavascriptcoregtk-4.1 -lgobject-2.0"

[target.x86_64-unknown-linux-gnu.bin-dependencies]
    path-option = ["${CANGJIE_STDX}"]

[target.x86_64-w64-mingw32]
  # GUI 子系统：双击不弹 DOS 黑窗口，stderr 仍走重定向（AGENTS §4）；同样不需要 fs 插件库
  link-option = "-L../../native -lcjtbridge --subsystem=windows"

[target.x86_64-w64-mingw32.bin-dependencies]
    path-option = ["${CANGJIE_STDX}"]
