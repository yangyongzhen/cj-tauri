<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>hello-world</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #16161d; color: #e6e6e6; margin: 0;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #1f2029; border: 1px solid #2e3140; border-radius: 14px;
          padding: 28px 32px; width: min(460px, 86vw); }
  h1 { margin: 0 0 16px; font-size: 22px; color: #7ce7ff; }
  .row { display: flex; gap: 8px; margin: 14px 0; }
  input, button { font-size: 15px; padding: 9px 12px; border-radius: 9px; border: 1px solid transparent; }
  input { flex: 1; background: #141821; color: #e6e6e6; border-color: #2e3140; }
  button { background: #e94560; color: #fff; cursor: pointer; font-weight: 600; }
  .result { min-height: 24px; font-size: 15px; color: #50fa7b; word-break: break-all; }
</style>
</head>
<body>
  <div class="card">
    <h1>hello-world</h1>
    <div class="row">
      <input id="name" value="world">
      <button id="greet">greet</button>
    </div>
    <div class="row">
      <button id="version">system:version</button>
    </div>
    <div id="result" class="result">等待 invoke…</div>
  </div>

  <script>
    // 桥由框架在 document-start 注入：invoke 调仓颉命令，返回 Promise
    function withBridge(cb) {
      if (window.__CJ_TAURI__) { cb(window.__CJ_TAURI__); return; }
      setTimeout(function () { withBridge(cb); }, 50);
    }

    withBridge(function (t) {
      var el = document.getElementById('result');
      function greet(name) {
        t.invoke('greet', { name: name })
          .then(function (d) { el.textContent = d; })
          .catch(function (e) { el.textContent = 'FAIL: ' + e.message; });
      }
      // 打开页面就自动发一次：窗口一亮就能看到 JS → 仓颉 → JS 的完整往返
      greet('world');
      document.getElementById('greet').onclick = function () {
        greet(document.getElementById('name').value || 'world');
      };
      document.getElementById('version').onclick = function () {
        t.invoke('system:version')
          .then(function (d) { el.textContent = JSON.stringify(d); })
          .catch(function (e) { el.textContent = 'FAIL: ' + e.message; });
      };
    });
  </script>
</body>
</html>
