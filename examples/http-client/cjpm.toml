[package]
  cjc-version = "1.0.5"
  name = "http_client"
  description = "cj-tauri 示例：HTTP API 客户端（仓颉侧发请求 + 主机白名单 + 大响应体截断，零 Node）"
  version = "0.1.0"
  target-dir = ""
  output-type = "executable"
  compile-option = ""
  override-compile-option = ""
  link-option = ""
  package-configuration = {}

[dependencies]
  cjTauri = { path = "../.." }

[target.x86_64-unknown-linux-gnu]
  link-option = "-L../../native -lcjtbridge -lwebkit2gtk-4.1 -lgtk-3 -lgdk-3 -lglib-2.0 -lgio-2.0 -lsoup-3.0 -ljavascriptcoregtk-4.1 -lgobject-2.0"

[target.x86_64-unknown-linux-gnu.bin-dependencies]
    path-option = ["${CANGJIE_STDX}"]

# Windows 侧尚未实机验证（AGENTS §4 记着两件事：单文件静态打包要显式 -lcrypt32，
# 便携包要自带 libssl-3-x64.dll / libcrypto-3-x64.dll——这个示例还没进打包器）
[target.x86_64-w64-mingw32]
  link-option = "-L../../native -lcjtbridge --subsystem=windows"

[target.x86_64-w64-mingw32.bin-dependencies]
    path-option = ["${CANGJIE_STDX}"]
