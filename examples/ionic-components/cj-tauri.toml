# cj-tauri 应用清单——整个工程的单一真相（RFC-002 §7）。
# cj-tauri sync 从这里派生 targets/ 骨架（desktop/ohos）；cj-tauri check 校验它并检测骨架漂移。
[app]
  name = "ionic-components"
  version = "0.1.0"
  # 应用标识：桌面是安装 ID，鸿蒙直接是 bundleName（每段须字母开头、只含字母数字下划线）
  id = "com.example.ionic_components"
  # 业务包名（cjpm 约束①：toml 模块名必须等于源包名）
  package = "ionic_components"

[[windows]]
  label = "main"
  title = "Ionic Gallery · cj-tauri"
  # 桌面宽窗：组件 gallery 需要横向空间（与 ionic-music 的移动端窄窗相反）
  width = 1000
  height = 720

[assets]
  # 骨架 launcher 加载的页面（相对资产根 assets/）——Vite 构建产物（vite-plugin-singlefile 单文件）
  page = "ui/dist/index.html"

[capabilities]
  dir = "assets/capabilities"
