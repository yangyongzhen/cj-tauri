<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>仓颉力扣 · cj-tauri</title>
<style>/*__VENDOR_CSS__*/</style>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, sans-serif;
    background: #1e1e2e; color: #cdd6f4;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* 顶栏：标题 + 工具按钮 */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px; background: #181825;
    border-bottom: 1px solid #313244; flex: 0 0 auto;
  }
  header h1 { font-size: 15px; color: #89b4fa; white-space: nowrap; }
  header .spacer { flex: 1; }
  header button {
    background: #89b4fa; color: #1e1e2e; border: none; border-radius: 6px;
    padding: 6px 16px; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  header button.ghost { background: #45475a; color: #cdd6f4; }
  header button:hover { opacity: .85; }
  #status { font-size: 12px; color: #a6adc8; white-space: nowrap; }
  #progressChip {
    font-size: 11.5px; color: #a6e3a1; background: rgba(166, 227, 161, .12);
    padding: 2px 10px; border-radius: 99px; white-space: nowrap;
  }
  /* 已解决的题：标题后带绿色对勾 */
  .prob.solved .ptitle::after { content: " ✓"; color: #a6e3a1; font-weight: 700; }

  /* 主区：左题库 + 中编辑器/下终端 */
  main { flex: 1 1 auto; display: flex; min-height: 0; }

  /* 左：题库 */
  #sidebar {
    width: 260px; flex: 0 0 auto; background: #181825;
    border-right: 1px solid #313244; overflow-y: auto; padding: 8px;
  }
  #sidebar h2 { font-size: 12px; color: #a6adc8; padding: 6px 8px; text-transform: uppercase; letter-spacing: .05em; }
  .group-title {
    font-size: 11px; color: #89b4fa; padding: 10px 8px 4px;
    letter-spacing: .06em; opacity: .85;
  }
  /* 筛选条：难度一行、状态一行；选中的 chip 高亮 */
  .fbar { display: flex; gap: 4px; padding: 2px 8px 4px; flex-wrap: wrap; }
  .fchip {
    font-size: 11px; padding: 2px 9px; border-radius: 99px;
    background: #313244; color: #a6adc8; cursor: pointer; user-select: none;
  }
  .fchip.on { background: #89b4fa; color: #1e1e2e; font-weight: 600; }
  .prob {
    padding: 9px 10px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; margin-bottom: 2px;
  }
  .prob:hover { background: #313244; }
  .prob.active { background: #45475a; }
  .prob .pid { color: #a6adc8; font-size: 12px; width: 22px; text-align: right; }
  .prob .ptitle { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 99px; flex: 0 0 auto; }
  .badge.easy   { background: #a6e3a1; color: #1e1e2e; }
  .badge.medium { background: #f9e2af; color: #1e1e2e; }
  .badge.hard   { background: #f38ba8; color: #1e1e2e; }

  /* 中：题目 + 编辑器 + 终端（纵向） */
  #center { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  #descPane {
    flex: 0 0 auto; max-height: 32%; overflow-y: auto;
    padding: 12px 16px; background: #1e1e2e; border-bottom: 1px solid #313244;
  }
  #descTitle { font-size: 15px; color: #cdd6f4; margin-bottom: 6px; }
  #descTitle .badge { margin-left: 8px; vertical-align: 2px; }
  #descBody { font-size: 13px; line-height: 1.7; color: #bac2de; white-space: pre-wrap; }
  /* 编辑器容器：CodeMirror 实例挂在这里（主题 cjdark 的结构样式来自内联的 vendor CSS） */
  #editorHost {
    flex: 1 1 55%; min-height: 120px; display: flex; flex-direction: column;
  }
  #editorHost .CodeMirror { flex: 1; height: auto; }
  .cm-s-cjdark.CodeMirror {
    background: #11111b; color: #cdd6f4;
    font-family: "Cascadia Code", Consolas, "JetBrains Mono", monospace;
    font-size: 13.5px; line-height: 1.6;
  }
  .cm-s-cjdark .CodeMirror-gutters { background: #11111b; border-right: 1px solid #313244; }
  .cm-s-cjdark .CodeMirror-linenumber { color: #585b70; }
  .cm-s-cjdark .CodeMirror-cursor { border-left: 1px solid #cdd6f4; }
  .cm-s-cjdark .CodeMirror-selected { background: #45475a; }
  .cm-s-cjdark .cm-keyword { color: #cba6f7; }
  .cm-s-cjdark .cm-type, .cm-s-cjdark .cm-variable-3 { color: #89b4fa; }
  .cm-s-cjdark .cm-def { color: #89dceb; }
  .cm-s-cjdark .cm-number { color: #fab387; }
  .cm-s-cjdark .cm-string { color: #a6e3a1; }
  .cm-s-cjdark .cm-comment { color: #6c7086; font-style: italic; }
  .cm-s-cjdark .cm-atom { color: #f38ba8; }
  /* vendor 缺失时的降级 textarea（与 CodeMirror 同区同字号） */
  #editorFallback {
    flex: 1; background: #11111b; color: #cdd6f4; border: none; outline: none; resize: none;
    font-family: "Cascadia Code", Consolas, "JetBrains Mono", monospace;
    font-size: 13.5px; line-height: 1.6; padding: 12px 16px;
  }
  #terminalPane {
    flex: 1 1 45%; min-height: 100px; display: flex; flex-direction: column;
    border-top: 1px solid #313244; background: #11111b;
  }
  #termHeader {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 14px; background: #181825; font-size: 12px; color: #a6adc8; flex: 0 0 auto;
  }
  #termHeader .dot { width: 9px; height: 9px; border-radius: 50%; background: #585b70; }
  #termHeader .dot.ok { background: #a6e3a1; }
  #termHeader .dot.err { background: #f38ba8; }
  #termHeader .dot.run { background: #f9e2af; }
  #terminal {
    flex: 1; overflow-y: auto; padding: 10px 14px;
    font-family: "Cascadia Code", Consolas, monospace; font-size: 12.5px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-all;
  }
  .t-dim { color: #6c7086; }
  .t-ok { color: #a6e3a1; }
  .t-err { color: #f38ba8; }
  .t-warn { color: #f9e2af; }
  .t-info { color: #89b4fa; }
</style>
<script>/*__VENDOR_CORE__*/</script>
</head>
<body>
  <header>
    <h1>仓颉力扣</h1>
    <span id="status" class="t-dim">正在连接桥…</span>
    <span id="progressChip" hidden></span>
    <span class="spacer"></span>
    <button id="btnSolution" class="ghost">参考答案</button>
    <button id="btnStats" class="ghost">统计</button>
    <button id="btnRun">▶ 运行 (Ctrl+R)</button>
    <button id="btnReset" class="ghost">重置</button>
  </header>

  <main>
    <nav id="sidebar">
      <h2>题库</h2>
      <div class="fbar" id="diffBar">
        <span class="fchip on" data-d="">全部</span>
        <span class="fchip" data-d="简单">简单</span>
        <span class="fchip" data-d="中等">中等</span>
        <span class="fchip" data-d="困难">困难</span>
      </div>
      <div class="fbar" id="statusBar">
        <span class="fchip on" data-s="">全部</span>
        <span class="fchip" data-s="todo">未做</span>
        <span class="fchip" data-s="solved">已过</span>
      </div>
      <div id="probList"><div class="t-dim" style="padding:8px">加载中…</div></div>
      <div style="padding:8px 4px">
        <button id="btnMore" class="ghost" style="width:100%;background:#45475a;color:#cdd6f4;border:none;border-radius:8px;padding:7px 0;font-size:12.5px;cursor:pointer">⬇ 加载更多题包</button>
      </div>
    </nav>

    <section id="center">
      <div id="descPane">
        <div id="descTitle">选择一道题开始</div>
        <div id="descBody" class="t-dim">左侧点击任意题目，阅读题意后在下方编辑器用仓颉实现算法，点击「运行」判题。</div>
      </div>
      <div id="editorHost"></div>
      <div id="terminalPane">
        <div id="termHeader">
          <span class="dot" id="termDot"></span>
          <span>判题终端</span>
        </div>
        <div id="terminal"><span class="t-dim">等待运行…</span></div>
      </div>
    </section>
  </main>

<script>
'use strict';
/* 仓颉力扣 · 前端
   页面是磁盘真文件（app.runUrl 读 ui/index.html），JS 反斜杠不受仓颉三引号转义影响。
   与桥交互只走 window.__CJ_TAURI__ 的 invoke / listen（AGENTS §3）。 */

var bridge = null;
var problems = [];
var currentId = 0;
var currentProblem = null;
var dirty = false;
var solvedSet = {};   // 题号 -> true（来自 leetcode:stats 的 solvedIds）
var diffFilter = '';     // 难度筛选：''=全部 / 简单 / 中等 / 困难
var statusFilter = '';   // 状态筛选：''=全部 / todo=未做 / solved=已过

function $(id) { return document.getElementById(id); }

function waitForBridge(cb) {
  if (window.__CJ_TAURI__ && window.__CJ_TAURI__.invoke) { cb(); return; }
  setTimeout(function () { waitForBridge(cb); }, 50);
}

/* ---------- 终端输出 ---------- */
function term(html) {
  var el = $('terminal');
  el.insertAdjacentHTML('beforeend', html + '\n');
  el.scrollTop = el.scrollHeight;
}
function termLine(cls, text) {
  var safe = String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  term('<span class="' + cls + '">' + safe + '</span>');
}
function termDot(cls) { $('termDot').className = 'dot ' + cls; }

/* cjc 的报错带 ANSI 颜色码（ESC[36m 之类），终端区自配配色，先剥掉再展示 */
function stripAnsi(s) {
  return String(s).replace(/\[[0-9;]*m/g, '').replace(/\[[0-9]*[A-Za-z]/g, '');
}

/* ---------- 状态条 ---------- */
function status(text) { $('status').textContent = text; }

/* ---------- 题库 ---------- */
function renderList() {
  var box = $('probList');
  box.textContent = '';
  // 先过筛选（难度 + 状态），再按 category 分组（保持题库给出的顺序）
  var visible = problems.filter(function (p) {
    if (diffFilter && p.difficulty !== diffFilter) { return false; }
    if (statusFilter === 'solved' && !solvedSet[p.id]) { return false; }
    if (statusFilter === 'todo' && solvedSet[p.id]) { return false; }
    return true;
  });
  if (visible.length === 0) {
    var empty = document.createElement('div');
    empty.className = 't-dim';
    empty.style.padding = '8px';
    empty.textContent = '没有符合筛选的题目';
    box.appendChild(empty);
    return;
  }
  var groups = [];
  var byName = {};
  visible.forEach(function (p) {
    var cat = p.category || '其他';
    if (!byName[cat]) { byName[cat] = []; groups.push(cat); }
    byName[cat].push(p);
  });
  groups.forEach(function (cat) {
    var h = document.createElement('div');
    h.className = 'group-title';
    h.textContent = cat;
    box.appendChild(h);
    byName[cat].forEach(function (p) {
      var row = document.createElement('div');
      row.className = 'prob' + (p.id === currentId ? ' active' : '') + (solvedSet[p.id] ? ' solved' : '');
      var badgeCls = p.difficulty === '简单' ? 'easy' : (p.difficulty === '中等' ? 'medium' : 'hard');
      row.innerHTML = '<span class="pid">' + p.id + '</span>'
        + '<span class="ptitle"></span>'
        + '<span class="badge ' + badgeCls + '">' + p.difficulty + '</span>';
      row.querySelector('.ptitle').textContent = p.title;
      row.onclick = function () { selectProblem(p.id); };
      box.appendChild(row);
    });
  });
}

function selectProblem(id) {
  currentId = id;
  bridge.invoke('leetcode:get', { id: id }).then(function (p) {
    currentProblem = p;
    renderList();
    $('descTitle').innerHTML = p.id + '. <span></span><span class="badge ' + badgeOf(p) + '"></span>';
    $('descTitle').querySelector('span').textContent = p.title;
    $('descTitle').querySelector('.badge').textContent = p.difficulty;
    $('descBody').textContent = p.description;
    // 草稿优先：没存过草稿才落模板
    return bridge.invoke('leetcode:loadDraft', { id: id }).then(function (d) {
      edSet(d.code || p.template);
      dirty = false;
      status('题目 ' + p.id + ' · ' + p.title);
      termLine('t-dim', '── 已打开题目 ' + p.id + '. ' + p.title + '（' + p.tests.length + ' 个测试用例）');
    });
  }).catch(function (e) { termLine('t-err', '取题目失败: ' + e.message); });
}

function badgeOf(p) {
  return p.difficulty === '简单' ? 'easy' : (p.difficulty === '中等' ? 'medium' : 'hard');
}
</script>
<script>
/* ---------- 运行判题 ---------- */
var running = false;

function runCode() {
  if (running) { termLine('t-warn', '已有一次判题在跑，请等它结束'); return; }
  if (!currentProblem) { termLine('t-warn', '请先在左侧选择一道题'); return; }
  running = true;
  termDot('run');
  status('判题中…（cjc 编译 + 运行）');
  termLine('t-info', '▶ 运行题目 ' + currentProblem.id + '. ' + currentProblem.title);
  var t0 = Date.now();
  bridge.invoke('leetcode:run', { id: currentProblem.id, code: edGet() })
    .then(function (r) {
      running = false;
      var wall = Date.now() - t0;
      if (!r.ok) {
        if (r.phase === 'timeout') {
          // 运行超时（死循环等）：与编译失败分开呈现，别拿 undefined 当 cjc 输出
          termDot('err');
          termLine('t-err', '⏱ ' + (r.message || '运行超时'));
          status('运行超时');
          return;
        }
        // 编译失败：把 cjc 的报错原样给到终端
        termDot('err');
        termLine('t-err', '✗ 编译失败（' + wall + 'ms）');
        termLine('t-dim', '──── cjc 输出 ────');
        termLine('t-err', stripAnsi(r.compileError) || '(无输出)');
        status('编译失败');
        return;
      }
      termDot(r.passed === r.total && r.total > 0 ? 'ok' : 'err');
      termLine('t-dim', '── 判定结果（编译+运行 ' + wall + 'ms）──');
      if (r.total > 0) {
        r.results.forEach(function (res, i) {
          var tc = currentProblem.tests[i];
          if (res.pass) {
            termLine('t-ok', '  ✓ 用例 ' + (i + 1) + ' 通过    ' + tc.call + ' == ' + tc.expect);
          } else {
            termLine('t-err', '  ✗ 用例 ' + (i + 1) + ' 未通过  ' + tc.call);
            termLine('t-err', '      期望 ' + tc.expect + '，' + (res.detail || '实际值见上方 got='));
          }
        });
        termLine(r.passed === r.total ? 't-ok' : 't-warn',
          '通过 ' + r.passed + '/' + r.total + ' 个用例'
          + (r.passed === r.total ? ' 🎉 全部通过！' : '—— 还有用例没过，再想想'));
        if (r.passed === r.total && r.total > 0) {
          // 全过：后端已落统计（recordJudgeResult 在判题返回前执行），
          // 这里刷新徽标与列表对勾，并在终端给一条进度反馈
          refreshStats(true);
        }
      } else {
        // 没解析到 RESULT 行：程序自己的 println 原样展示
        termLine('t-dim', '(程序输出，无判定行)');
        termLine('t-dim', r.stdout || '(空)');
      }
      status('通过 ' + r.passed + '/' + r.total + ' · ' + wall + 'ms');
      saveDraft();
    })
    .catch(function (e) {
      running = false;
      termDot('err');
      termLine('t-err', '✗ 运行失败: ' + e.message);
      status('运行失败');
    });
}

/* ---------- 草稿 ---------- */
function saveDraft() {
  if (!currentProblem) { return; }
  bridge.invoke('leetcode:saveDraft', { id: currentProblem.id, code: edGet() })
    .then(function () { status('已保存草稿 · 题目 ' + currentProblem.id); })
    .catch(function () { /* 草稿写盘失败不弹窗，终端有一行 stderr */ });
}

function resetCode() {
  if (!currentProblem) { return; }
  edSet(currentProblem.template);
  saveDraft();
  termLine('t-warn', '⟲ 代码已重置为模板');
}

/* ---------- 菜单（原生菜单 → menu:click 事件 → 这里） ---------- */
function wireMenu() {
  // 桥的 listen 返回「取消订阅函数」而不是 Promise（native/core/bridge_js.h），
  // 不能链 .catch——菜单事件没到也不影响按钮操作，静默挂上即可
  bridge.listen('menu:click', function (payload) {
    var id = payload && payload.id;
    termLine('t-dim', '[菜单] ' + id);
    if (id === 'run.submit') { runCode(); }
    else if (id === 'run.reset') { resetCode(); }
    else if (id === 'help.about') {
      termLine('t-info', '仓颉力扣 · cj-tauri 示例——仓颉后端 + 系统 WebView，判题由 cjc 编译用户代码完成');
    }
  });
}

/* ---------- 编辑器：CodeMirror（vendor 缺失时降级 textarea） ---------- */
var cm = null;          // CodeMirror 实例（vendor 内联成功时）
var fallbackEd = null;  // 降级 textarea

/* 读写抽象：判题/草稿/答案/重置都走这里，不关心底下是 CM 还是 textarea */
function edGet() { return cm ? cm.getValue() : fallbackEd.value; }
function edSet(v) { if (cm) { cm.setValue(v); } else { fallbackEd.value = v; } }

function wireEditor() {
  var host = $('editorHost');
  var saveTimer = null;
  function touchDirty() {
    dirty = true;
    // 停止输入 800ms 后自动存草稿（不抢先在每次按键时写盘）
    if (saveTimer) { clearTimeout(saveTimer); }
    saveTimer = setTimeout(saveDraft, 800);
  }

  if (window.CodeMirror) {
    // 自定义仓颉轻量 mode：clike 模式对仓颉关键字覆盖不全，自写可控（行号在 lineNumbers）
    CodeMirror.defineMode('cangjie', function () {
      var KEYWORDS = /^(func|let|var|if|else|while|for|in|return|match|case|break|continue|true|false|null|package|import|class|interface|extend|enum|prop|init|this|super|public|private|internal|protected|static|open|abstract|override|const|type|where|try|catch|finally|throw|main|Unit|Bool|Int8|Int16|Int32|Int64|UInt8|UInt16|UInt32|UInt64|Float16|Float32|Float64|Array|ArrayList|HashMap|HashSet|Option|String|Rune|Range|StringBuilder|ByteBuffer)$/;
      return {
        startState: function () { return { inBlock: false }; },
        token: function (stream, state) {
          if (state.inBlock) {
            // 块注释可能嵌套（仓颉特性），这里按「遇到第一个 */ 结束」近似处理
            if (stream.match(/^.*?\*\//)) { state.inBlock = false; }
            else { stream.skipToEnd(); }
            return 'comment';
          }
          if (stream.match('/*')) { state.inBlock = true; return 'comment'; }
          if (stream.match('//')) { stream.skipToEnd(); return 'comment'; }
          if (stream.match(/"(?:[^"\\]|\\.)*"?/)) { return 'string'; }
          if (stream.match(/\d+(\.\d+)?/)) { return 'number'; }
          if (stream.match(/^[A-Za-z_][\w]*/)) {
            var w = stream.current();
            if (KEYWORDS.test(w)) { return 'keyword'; }
            if (/^[A-Z]/.test(w)) { return 'type'; }
            return 'variable';
          }
          stream.next();
          return null;
        }
      };
    });
    cm = CodeMirror(host, {
      value: '// 请先选择题目',
      mode: 'cangjie',
      theme: 'cjdark',
      lineNumbers: true,
      indentUnit: 4,
      smartIndent: true,
      tabSize: 4,
      indentWithTabs: false
    });
    cm.on('change', touchDirty);
  } else {
    // 降级 textarea：vendor 缺失（如单文件打包漏带）时编辑功能不丢
    fallbackEd = document.createElement('textarea');
    fallbackEd.id = 'editorFallback';
    fallbackEd.spellcheck = false;
    fallbackEd.value = '// 请先选择题目';
    host.appendChild(fallbackEd);
    fallbackEd.addEventListener('input', touchDirty);
    // Tab 缩进：textarea 里插 4 个空格，别把焦点丢出去（CM 由 indentUnit 接管）
    fallbackEd.addEventListener('keydown', function (ev) {
      if (ev.key === 'Tab') {
        ev.preventDefault();
        var s = fallbackEd.selectionStart, e = fallbackEd.selectionEnd;
        fallbackEd.value = fallbackEd.value.slice(0, s) + '    ' + fallbackEd.value.slice(e);
        fallbackEd.selectionStart = fallbackEd.selectionEnd = s + 4;
        dirty = true;
      }
    });
  }
  // 快捷键：Ctrl+R 运行（与菜单一致；CM 不拦截未绑定的组合键）
  document.addEventListener('keydown', function (ev) {
    if (ev.ctrlKey && !ev.shiftKey && ev.key === 'r') { ev.preventDefault(); runCode(); }
    if (ev.ctrlKey && ev.shiftKey && ev.key === 'R') { ev.preventDefault(); resetCode(); }
  });
}

/* ---------- 加载更多（远程题包） ---------- */
var fetching = false;

function fetchMore() {
  if (fetching) { termLine('t-warn', '已在拉取题包，请稍候'); return; }
  fetching = true;
  var btn = $('btnMore');
  btn.disabled = true;
  btn.textContent = '⬇ 拉取中…';
  termDot('run');
  termLine('t-info', '⬇ 正在拉取远程题包…');
  bridge.invoke('leetcode:packs', {}).then(function (r) {
    return bridge.invoke('leetcode:fetchMore', { pack: (r.packs || [])[0] });
  }).then(function (r) {
    fetching = false;
    btn.disabled = false;
    btn.textContent = '⬇ 加载更多题包';
    termDot('ok');
    termLine('t-ok', '✓ 题包 ' + r.pack + ' 合并完成：新增 ' + r.added + ' 题'
      + (r.replaced > 0 ? '、更新 ' + r.replaced + ' 题' : '')
      + '，题库现有 ' + r.total + ' 题');
    // 缓存已落盘（后端写 problems-remote.local.json），重启后这些题仍在
    return bridge.invoke('leetcode:list', {}).then(function (lr) {
      problems = lr.problems || [];
      renderList();
      termLine('t-dim', '题库列表已刷新（含远程题，按分类分组）');
    });
  }).catch(function (e) {
    fetching = false;
    btn.disabled = false;
    btn.textContent = '⬇ 加载更多题包';
    termDot('err');
    termLine('t-err', '✗ 加载更多失败: ' + e.message);
    termLine('t-dim', '（内置题库不受影响；联网失败时请检查网络后重试）');
  });
}

/* ---------- 进度统计与参考答案 ---------- */
function refreshStats(celebrate) {
  return bridge.invoke('leetcode:stats', {}).then(function (s) {
    solvedSet = {};
    (s.solvedIds || []).forEach(function (id) { solvedSet[id] = true; });
    renderList();
    var chip = $('progressChip');
    if (s.total > 0) {
      chip.hidden = false;
      chip.textContent = '已解决 ' + s.solved + '/' + s.total + ' 题';
    }
    if (celebrate) {
      var pct = s.total > 0 ? Math.round(s.solved * 100 / s.total) : 0;
      termLine('t-ok', '📊 进度：已解决 ' + s.solved + '/' + s.total + '（' + pct + '%）'
        + (s.solved === s.total ? ' 🏆 全部题目已解决！' : '，继续加油'));
    }
    return s;
  });
}

function showStats() {
  refreshStats(false).then(function (s) {
    var pct = s.total > 0 ? Math.round(s.solved * 100 / s.total) : 0;
    termLine('t-info', '═══ 做题进度 ═══');
    termLine('t-ok', '已解决 ' + s.solved + ' / ' + s.total + ' 题（尝试过 ' + s.attempted + ' 题，完成率 ' + pct + '%）');
    (s.categories || []).forEach(function (c) {
      var bar = '';
      for (var i = 0; i < c.total; i++) { bar += (i < c.solved ? '█' : '░'); }
      termLine(c.solved > 0 ? 't-ok' : 't-dim', '  ' + c.category + '  ' + bar + '  ' + c.solved + '/' + c.total);
    });
  }).catch(function (e) { termLine('t-err', '取统计失败: ' + e.message); });
}

function loadSolution() {
  if (!currentProblem) { termLine('t-warn', '请先选择一道题'); return; }
  bridge.invoke('leetcode:solution', { id: currentProblem.id }).then(function (r) {
    edSet(r.code);
    saveDraft();
    termLine('t-warn', '📖 已载入题 ' + currentProblem.id + ' 的参考答案——点「运行」可验证，建议先读懂再自己写一遍');
    status('已载入参考答案 · 题目 ' + currentProblem.id);
  }).catch(function (e) { termLine('t-err', e.message); });
}

/* 筛选条：同组互斥单选；点了就重渲染列表 */
function wireFilters() {
  function wireBar(barId, apply) {
    var bar = $(barId);
    bar.addEventListener('click', function (ev) {
      var chip = ev.target.closest('.fchip');
      if (!chip) { return; }
      var chips = bar.querySelectorAll('.fchip');
      for (var i = 0; i < chips.length; i++) { chips[i].classList.remove('on'); }
      chip.classList.add('on');
      apply(chip);
      renderList();
    });
  }
  wireBar('diffBar', function (chip) { diffFilter = chip.getAttribute('data-d'); });
  wireBar('statusBar', function (chip) { statusFilter = chip.getAttribute('data-s'); });
}

/* ---------- 启动 ---------- */
waitForBridge(function () {
  bridge = window.__CJ_TAURI__;
  status('桥已连接');
  wireMenu();
  wireEditor();
  $('btnRun').onclick = runCode;
  $('btnReset').onclick = resetCode;
  $('btnMore').onclick = fetchMore;
  $('btnSolution').onclick = loadSolution;
  $('btnStats').onclick = showStats;
  wireFilters();
  refreshStats(false);   // 启动即取一次进度：徽标 + 列表对勾
  bridge.invoke('leetcode:list', {}).then(function (r) {
    problems = r.problems || [];
    termLine('t-dim', '题库加载完成：' + problems.length + ' 题');
    if (problems.length > 0) {
      selectProblem(problems[0].id);
    }
  }).catch(function (e) {
    termLine('t-err', '题库加载失败: ' + e.message);
    status('题库加载失败');
  });
});
</script>
