<!DOCTYPE html>
<html lang="zh-CN" class="apptheme-system">
<head>
<meta charset="utf-8">
<title>cj-tauri Markdown 笔记</title>
<style>
  /* 深色主题：WebKitGTK 下 <select> 会被原生浅色 combo 盖掉（AGENTS §4），
     所以整个界面不用 select，全部按钮化。 */
  :root {
    --bg: #12151f; --panel: #1a1f2e; --panel2: #161b28; --line: #262d40;
    --fg: #e7ecf5; --dim: #8b93b0; --accent: #4fd1c5; --accent2: #e94560;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); overflow: hidden;
    font: 14px/1.6 system-ui, "Segoe UI", "Noto Sans SC", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  /* 标题不参与收缩：三栏布局里让标题被压成两行过（AGENTS §4 的排版坑），
     收缩交给内容区，标题一律 flex: 0 0 auto + nowrap。 */
  header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--panel2);
  }
  header h1 { font-size: 15px; margin: 0; white-space: nowrap; flex: 0 0 auto; color: var(--accent); }
  header .sub { font-size: 12px; color: var(--dim); white-space: nowrap; flex: 1 1 auto; min-width: 0;
                overflow: hidden; text-overflow: ellipsis; }
  button {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 11px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); color: #0d1226; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { opacity: .86; color: #0d1226; }
  button.danger:hover { border-color: var(--accent2); color: var(--accent2); }
  /* 自绘 <select>（AGENTS §4）：WebKitGTK 会用原生浅色 combo 的底色/文字盖掉页面配色，
     -webkit-appearance:none 关掉它，箭头用两段 linear-gradient 画三角；option 也要另写底色 */
  select.sel {
    -webkit-appearance: none; appearance: none;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--dim) 50%),
      linear-gradient(135deg, var(--dim) 50%, transparent 50%);
    background-position: right 12px center, right 7px center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    background-color: var(--panel2);
    color: var(--fg); border: 1px solid var(--line); border-radius: 7px;
    padding: 3px 24px 3px 9px; font-size: 12px; cursor: pointer; max-width: 104px;
  }
  select.sel:hover { border-color: var(--accent); }
  select.sel option { background: var(--panel); color: var(--fg); }
  select.sel:focus { outline: none; border-color: var(--accent); }
  main { flex: 1 1 auto; display: flex; min-height: 0; }
  .side {
    flex: 0 0 236px; min-width: 150px; background: var(--panel);
    border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;
  }
  .side-head, .pane-head {
    flex: 0 0 auto; padding: 7px 12px; font-size: 12px; letter-spacing: .04em;
    color: var(--dim); border-bottom: 1px solid var(--line); display: flex;
    align-items: center; gap: 8px; white-space: nowrap;
  }
  .side-head span, .pane-head span { flex: 0 0 auto; }
  .side-head .grow, .pane-head .grow { flex: 1 1 auto; min-width: 0; }
  /* 侧栏页签（文件 / 大纲）：紧凑下划线式，选中态走强调色 */
  .tab {
    background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0;
    padding: 2px 2px 4px; font-size: 12px; color: var(--dim); cursor: pointer;
  }
  .tab:hover { color: var(--fg); border-bottom-color: transparent; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  /* 视图模式分段切换（编辑 / 分屏 / 预览）：连体按钮组，选中段用强调色描边 */
  .seg { display: inline-flex; flex: 0 0 auto; }
  .segbtn {
    border-radius: 0; border-right-width: 0; padding: 4px 10px; font-size: 12px;
  }
  .segbtn:first-child { border-radius: 7px 0 0 7px; }
  .segbtn:last-child { border-radius: 0 7px 7px 0; border-right-width: 1px; }
  .segbtn.active { color: var(--accent); border-color: var(--accent); background: var(--panel2); font-weight: 600; }
  .segbtn.active:hover { color: var(--accent); }
  /* 大纲条目：按层级缩进，点击跳转到对应标题 */
  .out { padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 13px;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
  .out:hover { background: var(--panel2); }
  .out.lv2 { padding-left: 20px; font-size: 12.5px; color: var(--txt-2, var(--fg)); }
  .out.lv3 { padding-left: 32px; font-size: 12px; color: var(--dim); }
  .files { flex: 1 1 auto; overflow: auto; padding: 6px; }
  .file {
    padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg);
  }
  .file:hover { background: var(--panel2); }
  .file.active { background: var(--active); color: var(--accent); }
  .file .size { color: var(--dim); font-size: 11px; margin-left: 6px; }
  .file.dir { color: var(--dim); cursor: default; }
  .pane { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .pane + .pane { border-left: 1px solid var(--line); }
  #editor {
    flex: 1 1 auto; width: 100%; border: 0; outline: none; resize: none; padding: 14px;
    background: var(--panel2); color: var(--fg); tab-size: 2;
    font: 13px/1.75 ui-monospace, Menlo, Consolas, "Noto Sans Mono CJK SC", monospace;
  }
  /* 预览排版（Typora 式）：内容居中收成约 58em 的阅读栏，两侧留白呼吸；标题紧凑、段落行距放宽 */
  #preview { flex: 1 1 auto; overflow: auto; padding: 24px 40px 56px; }
  #preview > * { max-width: 58em; margin-left: auto; margin-right: auto; }
  #preview h1, #preview h2, #preview h3 { line-height: 1.3; margin: 1.1em 0 .45em; }
  #preview h1:first-child, #preview h2:first-child, #preview p:first-child { margin-top: .2em; }
  #preview p, #preview li { line-height: 1.85; }
  #preview code { background: var(--panel2); border-radius: 4px; padding: 1px 5px; font-size: .92em; }
  #preview blockquote { margin: .8em 0; padding: 2px 14px; border-left: 3px solid var(--line); color: var(--dim); }
  #preview hr { border: 0; border-top: 1px solid var(--line); margin: 1.4em auto; }
  #preview table { border-collapse: collapse; margin: .8em auto; }
  #preview th, #preview td { border: 1px solid var(--line); padding: 4px 12px; }
  footer {
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 5px 14px;
    border-top: 1px solid var(--line); background: var(--panel2); font-size: 12px; color: var(--dim);
  }
  footer .grow { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  footer .ok { color: var(--accent); }
  footer .bad { color: var(--accent2); }
  /* 预览区排版（自己渲染的 Markdown 子集，样式也自己给） */
  #preview h1, #preview h2, #preview h3, #preview h4 {
    color: var(--accent); margin: 1.1em 0 .5em; line-height: 1.3; white-space: normal;
  }
  #preview h1 { font-size: 21px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  #preview h2 { font-size: 17px; }
  #preview h3 { font-size: 15px; }
  #preview p, #preview li { white-space: normal; overflow-wrap: anywhere; }
  #preview p { margin: .6em 0; }
  #preview ul, #preview ol { padding-left: 22px; margin: .5em 0; }
  #preview blockquote {
    margin: .7em 0; padding: 2px 12px; border-left: 3px solid var(--accent);
    background: #1c2334; color: #cfd7e8; border-radius: 0 6px 6px 0;
  }
  #preview pre {
    background: #0d1226; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; overflow: auto;
  }
  #preview code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
  #preview p code, #preview li code {
    background: #232b40; border-radius: 4px; padding: 1px 5px; color: #ffd479;
  }
  #preview pre code { color: #c8e1ff; background: none; padding: 0; }
  #preview hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }
  #preview a { color: var(--accent); }
  #preview img.missing { display: none; }
  #preview .missing-note { color: var(--dim); font-size: 12px; }
  #toast {
    position: fixed; right: 18px; bottom: 44px; max-width: 460px; padding: 9px 14px;
    background: #2a1b24; border: 1px solid var(--accent2); color: #ffd5dd;
    border-radius: 8px; font-size: 12.5px; white-space: pre-wrap; display: none;
  }
  .empty { color: var(--dim); font-size: 13px; padding: 10px; white-space: normal; }
  /* 应用主题（视图菜单「界面主题」单选组）：html 根类切换 CSS 变量整体换肤。
     :root 默认值 = 深色（跟随系统在系统深色时落到它）；各浅色系另写变量。
     --active 是侧栏选中项底色（原先硬编码 #24304a，浅色系下糊成一片，一并变量化）。 */
  html { --active: #24304a; }
  html.apptheme-dark { --active: #24304a; }
  html.apptheme-light {
    --bg: #f5f6fa; --panel: #ffffff; --panel2: #eef0f6; --line: #d9dde8;
    --fg: #23283a; --dim: #6b7288; --accent: #0e9488; --accent2: #d23c55; --active: #cfe7ec;
  }
  html.apptheme-green {
    --bg: #c9e6cc; --panel: #d6eed9; --panel2: #c2e3c6; --line: #a5cfae;
    --fg: #213426; --dim: #587a61; --accent: #2f7d4f; --accent2: #b5563c; --active: #b2debb;
  }
  html.apptheme-black {
    --bg: #000000; --panel: #0d0d11; --panel2: #121218; --line: #26262e;
    --fg: #d8dae0; --dim: #7c7f8a; --accent: #4fd1c5; --accent2: #e94560; --active: #1e2a3a;
  }
  /* 跟随系统：系统报浅色时换浅色变量（系统深色时用 :root 默认，无需另写） */
  @media (prefers-color-scheme: light) {
    html.apptheme-system {
      --bg: #f5f6fa; --panel: #ffffff; --panel2: #eef0f6; --line: #d9dde8;
      --fg: #23283a; --dim: #6b7288; --accent: #0e9488; --accent2: #d23c55; --active: #cfe7ec;
    }
  }
</style>
<style id="hljs-theme-dimmed">/*__THEME_DIMMED__*/</style>
<style id="hljs-theme-dark" media="not all">/*__THEME_DARK__*/</style>
<style id="hljs-theme-one" media="not all">/*__THEME_ONE__*/</style>
</head>
<body>
  <header>
    <h1>Markdown 笔记</h1>
    <!-- 视图模式分段切换（编辑 / 分屏 / 预览）：不用每次进菜单（用户反馈 2026-10-14）；
         与视图菜单、Ctrl+1/2/3 走同一个 setViewMode，勾选态由后端成组回写 -->
    <span class="seg" id="modeSeg">
      <button id="modeEdit" class="segbtn">编辑</button><button id="modePreview" class="segbtn">预览</button><button id="modeSplit" class="segbtn active">分屏</button>
    </span>
    <span class="sub" id="wsHint">工作区 notes/（由 run.sh 播种）· 路径出白名单一律被拒 · 文件操作在「文件」菜单</span>
  </header>
  <main>
    <div class="side">
      <div class="side-head">
        <button id="tabFiles" class="tab active">文件</button>
        <button id="tabOutline" class="tab">大纲</button>
        <span class="grow"></span><span id="fileCount">0</span>
        <select id="sortBy" class="sel" title="文件列表排序方式">
          <option value="name">按名称</option>
          <option value="size">按大小</option>
          <option value="mtime">按修改时间</option>
        </select>
      </div>
      <div class="files" id="files"><div class="empty">等待桥…</div></div>
      <div class="files" id="outline" style="display:none"><div class="empty">未打开笔记</div></div>
    </div>
    <div class="pane edit">
      <div class="pane-head"><span id="editingName">未打开文件</span><span class="grow"></span><span id="dirtyMark"></span></div>
      <textarea id="editor" spellcheck="false" placeholder="从左边选一份笔记，或者点「新建」…"></textarea>
    </div>
    <div class="pane preview">
      <div class="pane-head"><span>预览</span><span class="grow"></span><span id="mdStat">—</span></div>
      <div id="preview"></div>
    </div>
  </main>
  <footer>
    <span class="grow" id="status">等待桥…</span>
    <span id="version">—</span>
  </footer>
  <div id="toast"></div>

<script>/*__VENDOR_JS__*/</script>
<script>
(function () {
  'use strict';

  // ------------------------------------------------------------------ 基座
  // 工作区固定为 notes/：前端只写相对路径（"notes/x.md"），能不能碰由**清单里的 scope**说了算——
  // 页面自己绝不拼绝对路径，也不做任何「路径检查」（那属于共享层 src/scope.cj 的职责）。
  var WS = 'notes';
  var LAST_KEY = 'last-open';        // store 里记最近打开的笔记，重启还在
  var THEME_KEY = 'apptheme';        // 界面主题记忆（跟随系统/浅色/深色/护眼/墨黑）
  var state = { files: [], current: null, saved: '', sortBy: 'name', theme: 'system' };

  function $(id) { return document.getElementById(id); }

  /** 页面日志回投仓颉侧 → stderr 留证：失败只在页面上可见是最难排查的形状（AGENTS §4） */
  function report(line) {
    try {
      var b = window.__CJ_TAURI__;
      if (b && b.invoke) { b.invoke('report', { line: String(line) }); }
    } catch (e) { /* 回投失败不能反过来扰动界面 */ }
  }

  function toast(msg) {
    var el = $('toast');
    el.textContent = String(msg);
    el.style.display = 'block';
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.style.display = 'none'; }, 7000);
  }

  function status(text, cls) {
    var el = $('status');
    el.textContent = text;
    el.className = 'grow' + (cls ? ' ' + cls : '');
  }

  // 桥是宿主在 document-start 注入的，但应用前端**不要在模块作用域直接读它**（AGENTS §4）：
  // 这里统一等它出现再开工。
  function waitForBridge(cb) {
    if (window.__CJ_TAURI__ && window.__CJ_TAURI__.invoke) { cb(); return; }
    setTimeout(function () { waitForBridge(cb); }, 50);
  }

  function invoke(cmd, args) { return window.__CJ_TAURI__.invoke(cmd, args); }

  /** 统一取错误文案：桥回的是业务错误原文，别把它吞成 "undefined" */
  function errText(e) { return (e && e.message) ? e.message : String(e); }

  // ------------------------------------------------- Markdown 渲染（marked + highlight.js）
  // 库由 main.cj 装配期从 ui/vendor/ 读盘内联进占位符——run(html) 的页面
  // 没有真实来源，<script src> 相对路径取不到文件，只能内联。
  // 注意：本注释里不能出现「脚本结束标记」的字面量——那会把这个 script 块提前终止，
  // 整个主脚本不执行（实测：页面停在「等待桥」，注释文本漏成正文）。
  // 安全：marked v12 已移除 sanitizer 选项，这里渲染后经 <template> 解析（不执行脚本）、
  // 按白名单剥掉危险标签与事件属性再挂树——笔记正文不可能是注入点。
  function renderMarkdown(src) {
    var html = marked.parse(String(src), { breaks: true, mangle: false, headerIds: false });
    var tpl = document.createElement('template');
    tpl.innerHTML = html;   // template 内容不执行脚本，解析安全
    var forbidden = { SCRIPT:1, IFRAME:1, OBJECT:1, EMBED:1, FORM:1, STYLE:1, LINK:1, META:1, BASE:1 };
    var walk = tpl.content.querySelectorAll('*');
    for (var i = 0; i < walk.length; i++) {
      var el = walk[i];
      if (forbidden[el.tagName]) { el.remove(); continue; }
      var attrs = [].slice.call(el.attributes);
      for (var j = 0; j < attrs.length; j++) {
        var n = attrs[j].name.toLowerCase();
        var v = attrs[j].value;
        if (n.indexOf('on') === 0 || ((n === 'href' || n === 'src') && /^\s*javascript:/i.test(v))) {
          el.removeAttribute(attrs[j].name);
        }
      }
      if (el.tagName === 'A' && el.getAttribute('href')) {
        el.setAttribute('target', '_blank');
        el.setAttribute('rel', 'noopener noreferrer');
      }
      // 图片保持占位说明（run(html) 页面取不到相对路径的图）
      if (el.tagName === 'IMG') {
        var div = document.createElement('div');
        div.className = 'missing-note';
        div.textContent = '［图片未渲染：' + (el.getAttribute('alt') || el.getAttribute('src') || '图片') +
          ' —— run(html) 的页面没有真实来源，取不到相对路径的图］';
        el.replaceWith(div);
      }
    }
    var frag = document.createDocumentFragment();
    while (tpl.content.firstChild) { frag.appendChild(tpl.content.firstChild); }
    return frag;
  }


  // ------------------------------------------------------------ 文件树 / 状态
  function fmtSize(n) {
    if (typeof n !== 'number' || isNaN(n) || n < 0) { return ''; }
    if (n < 1024) { return n + ' B'; }
    return (n / 1024).toFixed(1) + ' KB';
  }

  function noteCount() {
    var n = 0;
    for (var i = 0; i < state.files.length; i++) { if (!state.files[i].dir) { n++; } }
    return n;
  }

  function renderFileList() {
    var box = $('files');
    while (box.firstChild) { box.removeChild(box.firstChild); }
    $('fileCount').textContent = String(state.files.length);

    if (!state.files.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'notes/ 里没东西。点「新建」写第一篇（目录由应用启动时自动创建）。';
      box.appendChild(empty);
      return;
    }

    for (var i = 0; i < state.files.length; i++) {
      var f = state.files[i];
      var row = document.createElement('div');
      // 工作区条目 name 是相对名（不含 '/'），「打开…」进来的外路径条目 name 本身就是完整路径——
      // 以含不含 '/' 区分，active 高亮与点击都用同一条 full 口径。
      // 展示只取文件名（用户反馈：长路径不好看），完整路径放 title 悬停可见。
      var isExt = f.name.indexOf('/') >= 0;
      var full = (f.dir || !isExt) ? (f.dir ? f.name : WS + '/' + f.name) : f.name;
      var shown = isExt ? f.name.slice(f.name.lastIndexOf('/') + 1) : f.name;
      row.className = 'file' + (f.dir ? ' dir' : '') + (state.current === full ? ' active' : '');
      row.title = full;
      var nameSpan = document.createElement('span');
      nameSpan.textContent = f.dir ? shown + '/' : shown;
      row.appendChild(nameSpan);
      if (f.dir) {
        row.title = '子目录（本示例的工作区是平铺的，不展开）';
      } else {
        var sizeSpan = document.createElement('span');
        sizeSpan.className = 'size';
        sizeSpan.textContent = fmtSize(Number(f.size));
        row.appendChild(sizeSpan);
        (function (n) { row.onclick = function () { openNote(n); }; })(f.name);
      }
      box.appendChild(row);
    }
  }

  /** 列目录：失败也把**原文**显示出来——「工作区不存在」和「路径越界」是两种不同的失败，别吞成一句「加载失败」 */
  function refreshList() {
    return invoke('fs:list', { path: WS }).then(function (items) {
      var arr = (items && items.length !== undefined) ? items : [];
      // 目录始终在前；文件按侧栏选择框定的顺序排（名称 / 大小 / 修改时间）
      var by = state.sortBy || 'name';
      state.files = arr.slice().sort(function (a, b) {
        if (!!a.dir !== !!b.dir) { return a.dir ? -1 : 1; }   // 目录在前
        if (by === 'size') { return Number(b.size) - Number(a.size); }
        if (by === 'mtime') { return Number(b.mtime || 0) - Number(a.mtime || 0); }
        return String(a.name) < String(b.name) ? -1 : 1;      // 仓颉侧不保证顺序，这里定序
      });
      renderFileList();
      status('notes/ 共 ' + state.files.length + ' 项（' + noteCount() + ' 篇笔记）', '');
      return state.files;
    }).catch(function (e) {
      state.files = [];
      renderFileList();
      status('列目录失败：' + errText(e), 'bad');
      toast('列目录失败：' + errText(e));
      return [];
    });
  }

  function setPreview(text) {
    var box = $('preview');
    while (box.firstChild) { box.removeChild(box.firstChild); }
    box.appendChild(renderMarkdown(text));
    // 代码高亮：marked 只出结构，着色交给 highlight.js（vendor 内联，无 CDN）
    if (window.hljs) {
      var codes = box.querySelectorAll('pre code');
      for (var i = 0; i < codes.length; i++) { hljs.highlightElement(codes[i]); }
    }
    $('mdStat').textContent = text.length + ' 字符';
  }

  function markDirty() {
    $('dirtyMark').textContent = ($('editor').value === state.saved) ? '' : '未保存';
  }

  /** 记住「上次打开」：失效不影响正事，但失败要留一行（别让 store 挂了没人知道） */
  function rememberLast(name) {
    return invoke('store:set', { key: LAST_KEY, value: name }).catch(function (e) {
      report('STORE-WARN 记不住 last-open：' + errText(e));
    });
  }

  function openNote(path) {
    // 路径泛化：工作区内传 name（旧调用点），「打开…」传完整路径——readText 都按路径读。
    // 绝对路径判定不能只认 '/'：Windows 对话框返回盘符路径（C:\...），反斜杠里没有 '/',
    // 会被误判成相对路径拼进工作区（实测 notes/C:/Users/...）。盘符 / 正反斜杠开头都算绝对，
    // 反斜杠顺手归一成 '/'（scope 规范化与 store 记录都按 '/' 走）。
    var isAbs = /^(\/|\\|[A-Za-z]:[\\/])/.test(path);
    var p = isAbs ? path.replace(/\\/g, '/') : WS + '/' + path;
    return invoke('fs:readText', { path: p }).then(function (text) {
      state.current = p;
      state.saved = text;
      // 「打开…」选中的**绝对路径**文件也进左侧列表，否则打开后侧栏看不到它。
      // 只认真绝对路径（盘符/正斜杠开头）：工作区文件的 p 是相对路径（notes/x.md），
      // 列表里已有裸名条目，再补一条就出现重复行——点重复行会拼出 notes/notes/x.md
      // （2026-10-14 实测，截图里同一文件两行就是它）。
      if (/^(\/|[A-Za-z]:[\\/])/.test(p)) {
        var found = false;
        for (var k = 0; k < state.files.length; k++) { if (state.files[k].name === p) { found = true; break; } }
        if (!found) { state.files.unshift({ name: p, size: text.length, mtime: 0 }); renderFileList(); }
      }
      // 头部提示跟随当前文件（用户反馈：原来那句「路径出白名单一律被拒」是静态的，信息量低）
      $('wsHint').textContent = '当前：' + p;
      $('editor').value = text;
      $('editingName').textContent = p;
      setPreview(text);
      markDirty();
      renderFileList();
      rememberLast(p);
      return text;
    }).catch(function (e) {
      status('打开 ' + p + ' 失败：' + errText(e), 'bad');
      toast('打开失败：' + errText(e));
      return null;
    });
  }

  /** 「文件 → 打开…」：原生文件选择框选路径，读回内容进编辑器。
      选中文件可以落在工作区外——scope 已放宽到 $HOME（deny 兜 .ssh/.git/*.secret.md）。 */
  function openViaDialog() {
    invoke('dialog:open', {
      title: '打开 Markdown 文件',
      filter: 'Markdown|*.md|所有文件|*.*'
    }).then(function (picked) {
      if (!picked || typeof picked !== 'string') { status('未选择文件', ''); return null; }
      return openNote(picked);
    }).catch(function (e) {
      toast('打开失败：' + errText(e));
    });
  }

  // ------------------------------------------------------------------ 动作
  // 全程**不用 window.prompt / confirm**：WebKitGTK 的脚本对话框要靠宿主的 script-dialog 信号
  // 才弹得出来，没接就是「点了没反应」——这类宿主依赖换成页内实现（行内输入框 + 按钮二次确认）。
  function nextFreeName(base) {
    var taken = {};
    for (var i = 0; i < state.files.length; i++) { taken[state.files[i].name] = true; }
    if (!taken[base + '.md']) { return base + '.md'; }
    for (var n = 2; n < 999; n++) {
      if (!taken[base + '-' + n + '.md']) { return base + '-' + n + '.md'; }
    }
    return base + '-' + Date.now() + '.md';
  }

  var NEW_TEMPLATE = [
    '# 新笔记',
    '',
    '写点什么：**粗体**、*斜体*、`行内码`、~~删除线~~、[链接](https://atomgit.com)。',
    '',
    '- 列表第一项',
    '- 列表第二项',
    '',
    '> 引用一句。',
    '',
    '```js',
    'var hello = "world";',
    '```',
    ''
  ].join('\n');

  function newNote() {
    var name = nextFreeName('新笔记');
    return invoke('fs:writeText', { path: WS + '/' + name, contents: NEW_TEMPLATE }).then(function () {
      return refreshList();
    }).then(function () {
      return openNote(name);
    }).then(function () {
      status('已新建 ' + WS + '/' + name, 'ok');
    }).catch(function (e) {
      status('新建失败：' + errText(e), 'bad');
      toast('新建失败：' + errText(e));
    });
  }

  function saveNote() {
    if (!state.current) {
      toast('还没打开任何笔记：先「新建」或「打开」一份');
      return Promise.resolve(false);
    }
    var text = $('editor').value;
    var saving = state.current;   // 完整路径（工作区内或「打开…」选来的都行），writeText 按路径写
    return invoke('fs:writeText', { path: saving, contents: text }).then(function () {
      state.saved = text;
      markDirty();
      status('已保存 ' + saving + '（' + text.length + ' 字符）', 'ok');
      return refreshList().then(function () { return true; });
    }).catch(function (e) {
      status('保存失败：' + errText(e), 'bad');
      toast('保存失败：' + errText(e));
      return false;
    });
  }

  function startRename() {
    if (!state.current) {
      toast('先打开一份笔记再重命名');
      return;
    }
    if ($('renameInput')) { return; }
    var old = state.current;
    var host = $('editingName');
    var input = document.createElement('input');
    input.id = 'renameInput';
    input.value = old;
    input.style.cssText = 'background:#0d1226;color:#e7ecf5;border:1px solid #4fd1c5;' +
      'border-radius:6px;padding:2px 6px;font-size:13px;width:240px;';
    host.textContent = '';
    host.appendChild(document.createTextNode('重命名 → '));
    host.appendChild(input);
    input.focus();
    input.select();
    input.onkeydown = function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); commitRename(old, input.value); }
      else if (ev.key === 'Escape') { ev.preventDefault(); cancelRename(old); }
    };
  }

  function cancelRename(old) { $('editingName').textContent = WS + '/' + old; }

  /** 重命名 = 写新 + 删旧两步（文件系统没有 rename 命令可用，插件的面就这么薄） */
  function commitRename(old, raw) {
    var next = String(raw === null || raw === undefined ? '' : raw).trim();
    if (!next) { toast('名字不能为空'); return; }
    // 页面**不做路径判定**（那是共享层 scope 的事），但「想跳目录」这种明显的越界意图
    // 根本别发出去——发出去也只会被拒，白白多一条误导性日志。
    if (next.indexOf('/') >= 0 || next.indexOf('\\') >= 0 || next.indexOf('..') >= 0) {
      toast('文件名里不能带路径分隔符');
      return;
    }
    if (!/\.md$/i.test(next)) { next += '.md'; }
    if (next === old) { cancelRename(old); return; }
    var text = $('editor').value;
    invoke('fs:writeText', { path: WS + '/' + next, contents: text }).then(function () {
      return invoke('fs:remove', { path: WS + '/' + old });
    }).then(function () {
      state.current = next;
      state.saved = text;
      $('editingName').textContent = WS + '/' + next;
      markDirty();
      rememberLast(next);
      return refreshList();
    }).then(function () {
      status('已重命名 ' + old + ' → ' + next, 'ok');
    }).catch(function (e) {
      cancelRename(old);
      status('重命名失败：' + errText(e), 'bad');
      toast('重命名失败：' + errText(e));
    });
  }

  var pendingDelete = null;

  /** 删除用**二次确认**（不用 confirm：同 prompt 的宿主依赖问题），4 秒没按就自动收回。
      确认态显示在状态栏（工具栏按钮已撤，动作都收进「文件」菜单，见文件头注释）。 */
  function requestDelete() {
    if (!state.current) {
      toast('先打开一份笔记再删除');
      return;
    }
    if (pendingDelete === state.current) {
      pendingDelete = null;
      clearTimeout(requestDelete._t);
      doDelete(state.current);
      return;
    }
    pendingDelete = state.current;
    status('再点一次「删除」确认（4 秒内）', 'bad');
    clearTimeout(requestDelete._t);
    requestDelete._t = setTimeout(function () {
      pendingDelete = null;
      status('已收回删除确认', '');
    }, 4000);
  }

  function doDelete(name) {
    invoke('fs:remove', { path: WS + '/' + name }).then(function () {
      state.current = null;
      state.saved = '';
      $('editor').value = '';
      $('editingName').textContent = '未打开文件';
      setPreview('');
      markDirty();
      rememberLast('');
      return refreshList();
    }).then(function () {
      status('已删除 ' + WS + '/' + name, 'ok');
    }).catch(function (e) {
      status('删除失败：' + errText(e), 'bad');
      toast('删除失败：' + errText(e));
    });
  }

  /** 视图三态：edit=仅编辑 / split=分屏 / preview=仅预览（Typora 式全程只盯预览）。
   *  菜单勾选态由后端成组回写，这里只负责改布局 + 同步页内分段按钮的选中态；
   *  菜单、页内按钮、Ctrl+1/2/3 三条入口走同一个函数，行为天然一致 */
  function setViewMode(mode) {
    var ed = document.querySelector('.pane.edit');
    var pv = document.querySelector('.pane.preview');
    if (ed) { ed.style.display = (mode === 'preview') ? 'none' : ''; }
    if (pv) { pv.style.display = (mode === 'edit') ? 'none' : ''; }
    var btns = { edit: 'modeEdit', split: 'modeSplit', preview: 'modePreview' };
    for (var m in btns) {
      var b = $(btns[m]);
      if (b) { b.className = 'segbtn' + (m === mode ? ' active' : ''); }
    }
    report('UI view ' + mode);
  }

  /** 代码主题切换：改对应 <style id="hljs-theme-*"> 的 media——主题是独立样式表，互不叠加 */
  function applyTheme(name) {
    var sheets = document.querySelectorAll('style[id^="hljs-theme-"]');
    var hit = false;
    for (var i = 0; i < sheets.length; i++) {
      var on = sheets[i].id === 'hljs-theme-' + name;
      sheets[i].media = on ? 'all' : 'not all';
      if (on) { hit = true; }
    }
    if (!hit) { status('主题不可用：' + name, 'bad'); return; }
    status('代码主题：' + name, 'ok');
    report('UI theme ' + name);
  }

  /** 界面主题切换（视图菜单单选组）：换 html 根类，CSS 变量整体换肤。
      system = 跟随系统（媒体查询），light/dark/green/black 各一套变量。
      记忆走 store，重启恢复；记不住不影响当次（跟 rememberLast 同款失败口径）。 */
  function applyAppTheme(name, remember) {
    var known = { system: 1, light: 1, dark: 1, green: 1, black: 1 };
    if (!known[name]) { status('界面主题不可用：' + name, 'bad'); return; }
    state.theme = name;
    document.documentElement.className = 'apptheme-' + name;
    if (remember !== false) {
      invoke('store:set', { key: THEME_KEY, value: name }).catch(function (e) {
        report('STORE-WARN 记不住界面主题：' + errText(e));
      });
    }
    status('界面主题：' + name, 'ok');
    report('UI apptheme ' + name);
  }

  /** 大纲：从编辑器原文抽标题（#/##/###，跳过代码围栏内的 #），点击滚动到对应行 */
  function renderOutline() {
    var box = $('outline');
    while (box.firstChild) { box.removeChild(box.firstChild); }
    if (!state.current) {
      var e0 = document.createElement('div');
      e0.className = 'empty';
      e0.textContent = '未打开笔记';
      box.appendChild(e0);
      return;
    }
    var lines = $('editor').value.split(/\r?\n/);
    var inFence = false, found = 0;
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      if (/^\s*```/.test(ln) || /^\s*~~~/.test(ln)) { inFence = !inFence; continue; }
      if (inFence) { continue; }
      var m = /^(#{1,3})\s+(.+?)\s*$/.exec(ln);
      if (!m) { continue; }
      found++;
      var row = document.createElement('div');
      row.className = 'out' + (m[1].length >= 3 ? ' lv3' : (m[1].length === 2 ? ' lv2' : ''));
      row.textContent = m[2];
      row.title = '第 ' + (i + 1) + ' 行';
      // 序号锁定：大纲与预览的标题一一对应（渲染器把围栏内的 # 当代码，两边都不算标题），
      // 点击时按第 k 个标题同步定位——2026-10-14 实测：只滚 textarea 的话，预览/分屏模式下
      // 用户盯着预览看不到任何动静（隐藏面板的 scrollTop 设了也白设）。
      (function (line, idx) {
        row.onclick = function () {
          var ta = $('editor');
          var pos = ta.value.split(/\r?\n/).slice(0, line).join('\n').length + (line ? 1 : 0);
          ta.focus();
          ta.setSelectionRange(pos, pos);
          ta.scrollTop = Math.max(0, (line - 3) * 24);   // 约 24px/行，滚到目标行前 3 行处
          var hs = $('preview').querySelectorAll('h1, h2, h3');
          if (idx < hs.length) { hs[idx].scrollIntoView({ block: 'start', behavior: 'smooth' }); }
        };
      })(i, found - 1);
      box.appendChild(row);
    }
    if (!found) {
      var e1 = document.createElement('div');
      e1.className = 'empty';
      e1.textContent = '这篇笔记还没有标题（用 # / ## / ### 写）';
      box.appendChild(e1);
    }
  }

  /** 侧栏页签：文件列表 / 大纲二选一；切到大纲时按当前编辑器内容现算 */
  function switchSideTab(which) {
    var files = which === 'files';
    $('tabFiles').className = 'tab' + (files ? ' active' : '');
    $('tabOutline').className = 'tab' + (files ? '' : ' active');
    $('files').style.display = files ? '' : 'none';
    $('outline').style.display = files ? 'none' : '';
    $('sortBy').style.visibility = files ? '' : 'hidden';
    if (!files) { renderOutline(); }
    report('UI side ' + which);
  }

  /** 关于：走原生模态对话框（dialog:message），不是页面内 toast——菜单语义上它是个「对话框」 */
  function showAbout() {
    invoke('dialog:message', {
      kind: 'info',
      title: '关于',
      message: 'cj-tauri Markdown 笔记\n\n仓颉后端 + 系统 WebView 的示例应用。\n文件树、编辑、实时预览全部走 IPC；路径出白名单一律被拒。'
    }).catch(function (e) {
      toast('对话框失败：' + errText(e));
    });
  }

  function bindUi() {
    // 原生菜单点击 → 框架自动投 `menu:click`（信封即事件载荷，见 src/shell_event.cj）：
    // 菜单与工具栏按钮收敛到同一批动作函数，两条入口的行为天然一致
    window.__CJ_TAURI__.listen('menu:click', function (ev) {
      var id = ev && ev.id ? String(ev.id) : '';
      report('UI menu:click ' + id);
      if (id === 'file.open') { openViaDialog(); }
      else if (id === 'file.new') { newNote(); }
      else if (id === 'file.save') { saveNote(); }
      else if (id === 'file.rename') { startRename(); }
      else if (id === 'file.delete') { requestDelete(); }
      else if (id === 'file.reload') { reloadAll(); }
      else if (id === 'help.about') { showAbout(); }
      else if (id === 'view.mode.edit') { setViewMode('edit'); }
      else if (id === 'view.mode.split') { setViewMode('split'); }
      else if (id === 'view.mode.preview') { setViewMode('preview'); }
      else if (id === 'theme.dimmed') { applyTheme('dimmed'); }
      else if (id === 'theme.dark') { applyTheme('dark'); }
      else if (id === 'theme.one') { applyTheme('one'); }
      else if (id.indexOf('apptheme.') === 0) { applyAppTheme(id.slice('apptheme.'.length)); }
    });
    // 刷新：有未保存改动就别刷（刷掉的是用户刚敲的字）；不用弹窗问，直接拒绝并说清怎么办
    function reloadAll() {
      if ($('editor').value !== state.saved) {
        toast('有未保存的改动：先 Ctrl+S 保存，或手动改回原样再刷新');
        return;
      }
      refreshList().then(function () {
        if (state.current) { return openNote(state.current); }
        status('已刷新', 'ok');
        return null;
      });
    }
    // 侧栏页签：文件列表 / 大纲
    $('tabFiles').onclick = function () { switchSideTab('files'); };
    $('tabOutline').onclick = function () { switchSideTab('outline'); };
    // 视图模式分段按钮：与菜单、Ctrl+1/2/3 走同一个 setViewMode
    $('modeEdit').onclick = function () { setViewMode('edit'); };
    $('modeSplit').onclick = function () { setViewMode('split'); };
    $('modePreview').onclick = function () { setViewMode('preview'); };
    // 侧栏排序选择框（自绘样式，见 .sel）：换排序后重排现有列表即可，不必重新列目录
    $('sortBy').onchange = function () {
      state.sortBy = this.value;
      if (state.files.length) {
        state.files.sort(function (a, b) {
          if (!!a.dir !== !!b.dir) { return a.dir ? -1 : 1; }
          if (state.sortBy === 'size') { return Number(b.size) - Number(a.size); }
          if (state.sortBy === 'mtime') { return Number(b.mtime || 0) - Number(a.mtime || 0); }
          return String(a.name) < String(b.name) ? -1 : 1;
        });
        renderFileList();
      }
      report('UI sortBy=' + state.sortBy);
    };
    // 输入路径的卡顿修复：此前每个按键都同步跑一次全量 Markdown 重渲（110 行渲染器）
    // + 全文字符串比较。现在拆成两条——脏标记防抖 300ms（比较便宜，但要避开连续击键的峰）、
    // 预览渲染节流 150ms（打字停顿才渲，连续输入期间最多一帧一次，且跳过中间态）。
    var previewTimer = 0, dirtyTimer = 0;
    $('editor').addEventListener('input', function () {
      if (!dirtyTimer) {
        dirtyTimer = setTimeout(function () {
          dirtyTimer = 0;
          $('dirtyMark').textContent = ($('editor').value === state.saved) ? '' : '未保存';
        }, 300);
      }
      if (previewTimer) { return; }   // 已有一帧排队：不再叠加，落定后渲染最新值
      previewTimer = setTimeout(function () {
        previewTimer = 0;
        setPreview($('editor').value);
      }, 150);
    });
    document.addEventListener('keydown', function (ev) {
      var k = String(ev.key).toLowerCase();
      if ((ev.ctrlKey || ev.metaKey) && k === 's') {
        ev.preventDefault();
        saveNote();
      }
      if ((ev.ctrlKey || ev.metaKey) && k === 'o') {
        ev.preventDefault();
        openViaDialog();
      }
      if ((ev.ctrlKey || ev.metaKey) && k === '1') {
        ev.preventDefault();
        setViewMode('edit');
      }
      if ((ev.ctrlKey || ev.metaKey) && k === '2') {
        ev.preventDefault();
        setViewMode('split');
      }
      if ((ev.ctrlKey || ev.metaKey) && k === '3') {
        ev.preventDefault();
        setViewMode('preview');
      }
    });
  }

  // ------------------------------------------------------------------ 启动
  function boot() {
    bindUi();
    status('桥已就绪，正在列目录…', '');

    // 恢复界面主题记忆（store 里记的；没有就用默认跟随系统）
    invoke('store:get', { key: THEME_KEY, default: '' }).then(function (t) {
      if (t && typeof t === 'string') { applyAppTheme(t, false); }
      return null;
    }).catch(function () { /* 记不住就用默认，不打扰初始化 */ });

    invoke('system:version').then(function (v) {
      var text = (typeof v === 'string') ? v
        : (v && v.version ? v.version : JSON.stringify(v));
      $('version').textContent = 'cj-tauri ' + text;
    }).catch(function () { $('version').textContent = 'cj-tauri ?'; });

    refreshList().then(function () {
      report('UI-READY notes 列表已取回：' + state.files.length + ' 项');
      return invoke('store:get', { key: LAST_KEY, default: '' });
    }).then(function (last) {
      if (last && typeof last === 'string') {
        for (var i = 0; i < state.files.length; i++) {
          if (state.files[i].name === last && !state.files[i].dir) {
            return openNote(last).then(function () { status('已恢复上次打开：' + last, 'ok'); });
          }
        }
      }
      for (var j = 0; j < state.files.length; j++) {
        if (!state.files[j].dir) { return openNote(state.files[j].name); }
      }
      status('notes/ 还是空的 —— 点「新建」写第一篇', '');
      return null;
    }).then(function () {
      return invoke('notes:env', {}).then(function (env) {
        if (env && env.selfcheck) { runSelfCheck(); }
        return null;
      });
    }).catch(function (e) {
      status('初始化失败：' + errText(e), 'bad');
      toast('初始化失败：' + errText(e));
    });
  }

  waitForBridge(boot);

  // ---------------------------------------------------------------- 页内自检
  // 只在 CJ_MARKDOWN_SELFCHECK=1 时跑（开关经 notes:env 拿到，页面读不到进程环境）。
  // 每条断言都回投 stderr（report）——页面自检绿不绿，**日志里必须留痕**：
  // 「日志里没有失败行」和「自检根本没跑」在端到端里长得一样，所以最后那条 DONE 带计数。
  function scAssert(results, name, cond, extra) {
    var ok = !!cond;
    results.total++;
    if (ok) { results.passed++; } else { results.failed++; results.names.push(name); }
    report('SELFCHECK ' + (ok ? 'PASS' : 'FAIL') + ' ' + name + (extra ? ' :: ' + extra : ''));
    return ok;
  }

  /** 期望被拒的调用：**成功了才算失败**（越界没被拦住，比拒绝更严重） */
  function expectReject(results, name, p, needle) {
    return p.then(function (v) {
      scAssert(results, name, false, '竟然成功了：' + JSON.stringify(v));
      return null;
    }, function (e) {
      var msg = errText(e);
      scAssert(results, name, !needle || msg.indexOf(needle) >= 0, '已拒：' + msg);
      return null;
    });
  }

  function runSelfCheck() {
    var results = { total: 0, passed: 0, failed: 0, names: [] };
    var probe = WS + '/.selfcheck-probe.md';
    var probe2 = WS + '/.selfcheck-probe2.md';
    var probeText = '# 探针\n\n写入后原样读回：**粗体** `code`。\n';

    report('SELFCHECK BEGIN（自检开关来自 notes:env）');

    // ---- 1) 桥与插件 shim：必须早于页面脚本（晚于页面脚本就读到 undefined，AGENTS §4）
    var b = window.__CJ_TAURI__ || {};
    scAssert(results, 'shim-fs-serial', !!(b.fs && b.store),
      'fs=' + (typeof b.fs) + ' store=' + (typeof b.store));

    // ---- 2) 布局：三栏都得有宽度。三栏 flex 里被压扁/折行过一次（AGENTS §4 排版坑），
    //         所以这里按**几何**断言，而不是「元素存在就算过」。
    var sideBox = document.querySelector('.side').getBoundingClientRect();
    var panes = document.querySelectorAll('.pane');
    var edBox = panes[0].getBoundingClientRect();
    var pvBox = panes[1].getBoundingClientRect();
    scAssert(results, 'layout-three-columns',
      sideBox.width > 100 && edBox.width > 200 && pvBox.width > 200,
      'side=' + Math.round(sideBox.width) + ' editor=' + Math.round(edBox.width) +
      ' preview=' + Math.round(pvBox.width) + ' viewport=' + window.innerWidth);

    // ---- 3) Markdown 子集：拿固定素材渲染进**离屏**容器（不动用户正在看的预览），再按 DOM 结构断言
    var holder = document.createElement('div');
    holder.id = 'selfcheck-holder';
    holder.style.cssText = 'position:fixed;left:-9999px;top:0;width:640px;';
    document.body.appendChild(holder);

    var fixture = [
      '# 标题一', '',
      '段落里有 **粗体**、*斜体*、`code`、~~删除~~ 和 [链接](https://atomgit.com)。', '',
      '## 标题二', '',
      '- 甲', '- 乙', '- 丙', '',
      '1. 一', '2. 二', '',
      '> 引用行', '',
      '---', '',
      '```js', 'var x = 1;', '```', '',
      '![图](local.png)', ''
    ].join('\n');
    holder.appendChild(renderMarkdown(fixture));

    var h1n = holder.querySelectorAll('h1').length;
    var h2n = holder.querySelectorAll('h2').length;
    var uln = holder.querySelectorAll('ul li').length;
    var oln = holder.querySelectorAll('ol li').length;
    var bqn = holder.querySelectorAll('blockquote').length;
    var hrn = holder.querySelectorAll('hr').length;
    scAssert(results, 'md-blocks', h1n === 1 && h2n === 1 && uln === 3 && oln === 2 && bqn === 1 && hrn === 1,
      'h1=' + h1n + ' h2=' + h2n + ' ul.li=' + uln + ' ol.li=' + oln + ' bq=' + bqn + ' hr=' + hrn);

    var strongN = holder.querySelectorAll('strong').length;
    var emN = holder.querySelectorAll('em').length;
    var delN = holder.querySelectorAll('del').length;
    var inlineCodeN = holder.querySelectorAll('p code').length;
    var link = holder.querySelector('a');
    scAssert(results, 'md-inline',
      strongN === 1 && emN === 1 && delN === 1 && inlineCodeN === 1 &&
      !!link && link.getAttribute('href') === 'https://atomgit.com' && link.textContent === '链接',
      'strong=' + strongN + ' em=' + emN + ' del=' + delN + ' p.code=' + inlineCodeN +
      ' href=' + (link ? link.getAttribute('href') : 'null'));

    var pre = holder.querySelector('pre code');
    scAssert(results, 'md-fence', !!pre && pre.textContent.indexOf('var x = 1;') >= 0,
      'pre.code=' + (pre ? JSON.stringify(pre.textContent) : 'null'));

    scAssert(results, 'md-image-degraded', holder.querySelectorAll('.missing-note').length === 1,
      '整行图片降级成一行说明，不留白框');

    // ---- 4) 正文不可能成为注入点：marked 渲染后经白名单清洗——脚本/事件属性剥掉，
    //         无害标签（如 <b>）保留结构；onerror 事件属性必须消失
    var evil = document.createElement('div');
    evil.appendChild(renderMarkdown('<img src=x onerror=alert(1)>\n\n**<b>hi</b>**\n<script>alert(2)<\/script>'));
    var evilImg = evil.querySelector('img');
    scAssert(results, 'md-no-html-injection',
      evil.querySelectorAll('script').length === 0 &&
      (!evilImg || (!evilImg.getAttribute('onerror') && evilImg.getAttribute('src') === 'x')),
      'script 剥净=' + (evil.querySelectorAll('script').length === 0) +
      ' img.onerror 剥净=' + (!evilImg || !evilImg.getAttribute('onerror')));

    // ---- 5) fs 正例：写 → 读回逐字相同 → 列表里看得见（`list` 是这一轮给 fs 补的命令）
    invoke('fs:writeText', { path: probe, contents: probeText }).then(function () {
      scAssert(results, 'fs-writeText', true, probe);
      return invoke('fs:readText', { path: probe });
    }).then(function (back) {
      scAssert(results, 'fs-readText-roundtrip', back === probeText,
        '读回 ' + (back ? back.length : -1) + ' 字符 / 期望 ' + probeText.length + ' 字符');
      return invoke('fs:list', { path: WS });
    }).then(function (items) {
      var arr = (items && items.length !== undefined) ? items : [];
      var names = arr.map(function (x) { return String(x.name); });
      var shapeOk = arr.length > 0;
      for (var i = 0; i < arr.length; i++) {
        if (typeof arr[i].name !== 'string' || typeof arr[i].dir !== 'boolean' || typeof arr[i].size !== 'number') {
          shapeOk = false;
        }
      }
      scAssert(results, 'fs-list-shape', shapeOk, '项=' + arr.length + ' :: ' + names.join(','));
      scAssert(results, 'fs-list-sees-probe', names.indexOf('.selfcheck-probe.md') >= 0, names.join(','));
      return null;
    }).then(function () {
      // ---- 6) 重命名 = 写新 + 删旧（插件的面里没有 rename，就这两步），顺便验 remove 真删得掉
      return invoke('fs:writeText', { path: probe2, contents: '# 改名后的探针\n' });
    }).then(function () {
      return invoke('fs:remove', { path: probe });
    }).then(function () {
      return invoke('fs:list', { path: WS });
    }).then(function (items) {
      var arr = (items && items.length !== undefined) ? items : [];
      var names = arr.map(function (x) { return String(x.name); });
      scAssert(results, 'fs-remove-rename-plan', names.indexOf('.selfcheck-probe.md') < 0 &&
        names.indexOf('.selfcheck-probe2.md') >= 0, names.join(','));
      return invoke('fs:remove', { path: probe2 });   // 收尾：工作区恢复原样
    }).then(function () {
      // ---- 7) 反面用例：删不存在的文件必须报错（静默回 true 等于把失败伪装成成功）
      return expectReject(results, 'fs-remove-missing-rejected',
        invoke('fs:remove', { path: WS + '/.no-such-file.md' }), 'no such file');
    }).then(function () {
      // ---- 8) 反面用例：remove 不接受目录（std.fs 的 remove 连空目录一起删，插件显式挡在前面）
      return expectReject(results, 'fs-remove-dir-refused',
        invoke('fs:remove', { path: WS }), 'is a directory');
    }).then(function () {
      // ---- 9) scope：命令放行 ≠ 路径放行。allow = 工作区 + $HOME（「打开…」要读外部文件），
      //         所以反面素材取 $HOME 之外：/etc 与 $HOME 之外的相对攀升都该拒，
      //         而且这条拒在桥 stderr 里留 `scope denied (fs)`（E2E 侧按整行前缀断言）。
      return expectReject(results, 'scope-deny-readText',
        invoke('fs:readText', { path: '/etc/hostname' }), 'outside the authorized scope');
    }).then(function () {
      return expectReject(results, 'scope-deny-list',
        invoke('fs:list', { path: '/etc' }), 'outside the authorized scope');
    }).then(function () {
      // ---- 10) 越界绕一下也不行：`..` 规范化之后照样按绝对路径判。素材写成**超量攀升**——
      //         词法规范化在根处截断（爬过 / 就停在 /），层级数与 $HOME 深度无关，
      //         任何机器上这条都落在 /etc/hostname，必拒。
      return expectReject(results, 'scope-deny-dotdot',
        invoke('fs:readText', { path: WS + '/../../../../../../../../../../etc/hostname' }), 'outside the authorized scope');
    }).then(function () {
      return null;
    }).catch(function (e) {
      // fs 这批断了也要留一条：链子静默断掉 = 后面几条断言根本没跑（日志里却看不出少了几条）
      scAssert(results, 'fs-chain-unhandled', false, errText(e));
    }).then(function () {
      // ---- 11) store 接着跑：**串行**，不另起一条并行链。
      //         并行时的形状很坑：收尾的 DONE 会先于后发的断言落盘，计数看着是绿的却少算几条，
      //         失败也可能落在 DONE 之后——「聚合行比明细先出现」本身就是取证陷阱
      //         （日志里没有失败行 ≠ 没失败，AGENTS §4）。实测第一轮就这么绿过一次。
      return invoke('store:set', { key: 'selfcheck', value: 'v1' });
    }).then(function () {
      return invoke('store:get', { key: 'selfcheck' });
    }).then(function (v) {
      scAssert(results, 'store-set-get', v === 'v1', 'v=' + JSON.stringify(v));
      return invoke('store:delete', { key: 'selfcheck' }).then(function () { return null; },
        function (e) { report('STORE-WARN delete：' + errText(e)); return null; });
    }).then(function () {
      // 读已删的键：报错或回空都算「没拿到旧值」——两种实现都不该让这条断言假红
      return invoke('store:get', { key: 'selfcheck' }).then(function (v) { return v; },
        function () { return null; });
    }).then(function (v) {
      scAssert(results, 'store-delete', v !== 'v1', '删后 v=' + JSON.stringify(v));
      return null;
    }).catch(function (e) {
      scAssert(results, 'store-chain-unhandled', false, errText(e));
    }).then(function () {
      // ---- 12) 界面自身：先刷新一次文件树，再按**结构**断言。
      //         自检前半段的探针文件都直接走 invoke、没经过界面，所以这里必须先 refreshList，
      //         否则断言的只是「开机那一刻恰好有几行」——那种断言在改动之后会假绿。
      return refreshList().then(function () { return null; });
    }).then(function () {
      var rows = document.querySelectorAll('#files .file').length;
      var entries = state.files.length;
      var nodes = $('preview').childNodes.length;
      scAssert(results, 'ui-tree-rows-match-list', rows === entries, '行=' + rows + ' 列表=' + entries);
      scAssert(results, 'ui-preview-nodes', nodes > 0, 'nodes=' + nodes);

      // ---- 13) 本轮新增的三件：应用主题换肤、视图分段按钮、模式与按钮态同步。
      //         断言收尾时把界面恢复到初始态（split + system），不污染后续人工测试
      applyAppTheme('green', false);
      scAssert(results, 'ui-apptheme-class', document.documentElement.className === 'apptheme-green',
        'root=' + document.documentElement.className);
      applyAppTheme('system', false);
      scAssert(results, 'ui-apptheme-restore', document.documentElement.className === 'apptheme-system',
        'root=' + document.documentElement.className);
      setViewMode('preview');
      scAssert(results, 'ui-mode-button-sync',
        $('modePreview').className.indexOf('active') >= 0 &&
        document.querySelector('.pane.edit').style.display === 'none',
        'previewBtn=' + $('modePreview').className + ' edit=' + document.querySelector('.pane.edit').style.display);
      setViewMode('split');
      scAssert(results, 'ui-mode-restore-split',
        $('modeSplit').className.indexOf('active') >= 0 &&
        document.querySelector('.pane.edit').style.display === '',
        'splitBtn=' + $('modeSplit').className);

      if (holder.parentNode) { holder.parentNode.removeChild(holder); }
      report('SELFCHECK DONE passed=' + results.passed + ' failed=' + results.failed +
        (results.failed ? ' :: ' + results.names.join(',') : ''));
      status('页内自检：' + results.passed + ' 通过 / ' + results.failed + ' 失败',
        results.failed ? 'bad' : 'ok');
      return null;
    });
  }
})();
</script>
</body>
</html>
