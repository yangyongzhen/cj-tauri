<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MQTT 调试台 · cj-tauri</title>
<!--
  MQTT 3.1.1 调试台页面（examples/mqtt-client）

  三个面板各管一件事，边界按「调试时人问的问题」切：
    左：我要连/订/发什么（输入）
    中：刚才到底发生了什么（报文流，两个方向放在一条时间线上）
    右：现在是什么状态、数字对不对得上（统计与订阅表）

  两条数据通道都用上（框架的 mqtt 插件给的，见 docs/设计决策记录.md D-015）：
    - 事件 `mqtt:message` / `mqtt:state`：实时性靠它；
    - 命令 `mqtt:recent`：「拉取缓冲」按钮，页面重载或事件漏掉后补齐，也方便对账。
  同一条报文可能两条路都到（事件一次、recent 一次），所以按报文里的 `seq` 去重——见 seenSeq。

  页面里不放任何不可信字符串到 innerHTML：主题与载荷都是外部输入，一律 textContent。
-->
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #14181d; color: #d7dee6;
    font: 13px/1.5 -apple-system, "Segoe UI", "Noto Sans CJK SC", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: #1b2027; border-bottom: 1px solid #2a323c;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  .spacer { flex: 1 1 auto; }
  .badge {
    padding: 2px 9px; border-radius: 10px; font-size: 12px; border: 1px solid #39424e;
    background: #232a33; color: #9aa7b4;
  }
  .badge.connected { background: #14351f; border-color: #2b6b3d; color: #7fdca0; }
  .badge.connecting, .badge.pending { background: #37301a; border-color: #6d5c22; color: #e6cf7a; }
  .badge.error, .badge.closed { background: #3a1d1f; border-color: #7a3236; color: #f0a0a4; }
  .muted { color: #7b8794; }

  main { flex: 1 1 auto; display: flex; min-height: 0; }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .left  { flex: 0 0 300px; border-right: 1px solid #2a323c; overflow-y: auto; }
  .mid   { flex: 1 1 auto; min-width: 0; }
  .right { flex: 0 0 260px; border-left: 1px solid #2a323c; overflow-y: auto; }

  .panel { border-bottom: 1px solid #232a33; padding: 10px 12px; }
  .panel h2 { font-size: 12px; margin: 0 0 8px; color: #8fa1b3; font-weight: 600;
              text-transform: uppercase; letter-spacing: .6px; }
  label { display: block; font-size: 12px; color: #93a1af; margin: 6px 0 2px; }
  input[type=text], input[type=number] {
    width: 100%; padding: 5px 7px; background: #10141a; color: #dbe3ec;
    border: 1px solid #303a45; border-radius: 4px; font: inherit;
  }
  input:focus { outline: none; border-color: #3d6ea5; }
  .row { display: flex; gap: 6px; }
  .row > * { flex: 1 1 auto; min-width: 0; }
  .check { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: #93a1af; }
  .check input { flex: 0 0 auto; }
  button {
    padding: 5px 10px; background: #26313d; color: #d7dee6; border: 1px solid #38434f;
    border-radius: 4px; font: inherit; cursor: pointer;
  }
  button:hover { background: #2f3b48; }
  button.primary { background: #1f4b7a; border-color: #2d6ba4; }
  button.primary:hover { background: #245a91; }
  button.danger { background: #5a2729; border-color: #7d3538; }
  button:disabled { opacity: .45; cursor: default; }
  .btns { display: flex; gap: 6px; margin-top: 10px; }
  .btns button { flex: 1 1 auto; }

  /* WebKitGTK 的原生 combo 会盖掉页面配色（AGENTS §4）：自绘外观与箭头 */
  select {
    width: 100%; padding: 5px 22px 5px 7px; background: #10141a; color: #dbe3ec;
    border: 1px solid #303a45; border-radius: 4px; font: inherit;
    -webkit-appearance: none; appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, #7b8794 50%),
                      linear-gradient(135deg, #7b8794 50%, transparent 50%);
    background-position: calc(100% - 13px) 12px, calc(100% - 8px) 12px;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  select option { background: #10141a; color: #dbe3ec; }

  .toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 12px;
             border-bottom: 1px solid #2a323c; background: #1b2027; }
  .toolbar input[type=text] { flex: 0 0 180px; }
  .toolbar .count { font-size: 12px; color: #7b8794; }

  #msgs { flex: 1 1 auto; overflow-y: auto; font-family: ui-monospace, Menlo, Consolas, monospace;
          font-size: 12px; }
  .msg { display: grid; grid-template-columns: 62px 78px 1fr; gap: 8px; padding: 4px 12px;
         border-bottom: 1px solid #1d232b; }
  .msg.tx { color: #9fd0f5; }
  .msg.rx { color: #b6e3c0; }
  .msg .t { color: #6f7c89; }
  .msg .ty { color: #a9b6c3; }
  .msg .body { min-width: 0; word-break: break-all; }
  .msg .body b { color: #e4ebf3; font-weight: 600; }
  .msg .body i { color: #8593a1; font-style: normal; }
  .msg.err { color: #f0a0a4; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td { padding: 3px 0; vertical-align: top; }
  td.k { color: #8593a1; white-space: nowrap; padding-right: 8px; }
  td.v { font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-all; }
  footer { padding: 6px 12px; border-top: 1px solid #2a323c; background: #1b2027;
           color: #7b8794; font-size: 12px; }
  code { background: #10141a; padding: 1px 4px; border-radius: 3px; color: #c8d3de; }
</style>
</head>
<body>
<header>
  <h1>MQTT 调试台</h1>
  <span id="stateBadge" class="badge idle">未连接</span>
  <span id="connInfo" class="muted">—</span>
  <span class="spacer"></span>
  <button id="btnStatus">刷新状态</button>
  <button id="btnRecent">拉取缓冲</button>
</header>

<main>
  <section class="col left">
    <div class="panel">
      <h2>连接</h2>
      <div class="row">
        <div>
          <label for="host">主机</label>
          <input id="host" type="text" value="127.0.0.1" spellcheck="false">
        </div>
        <div style="flex:0 0 82px">
          <label for="port">端口</label>
          <input id="port" type="text" value="1883" spellcheck="false">
        </div>
      </div>
      <label for="clientId">客户端标识符（留空自动生成）</label>
      <input id="clientId" type="text" placeholder="cj-tauri-debug-xxxx" spellcheck="false">
      <div class="row">
        <div>
          <label for="keepalive">保活（秒，0=关）</label>
          <input id="keepalive" type="text" value="60" spellcheck="false">
        </div>
        <div>
          <label for="username">用户名（可空）</label>
          <input id="username" type="text" spellcheck="false">
        </div>
      </div>
      <label for="password">密码（可空）</label>
      <input id="password" type="text" spellcheck="false">
      <div class="check">
        <input id="clean" type="checkbox" checked>
        <label for="clean" style="margin:0">cleanSession（每次都是新会话）</label>
      </div>
      <div class="btns">
        <button id="btnConnect" class="primary">连接</button>
        <button id="btnDisconnect" class="danger">断开</button>
      </div>
    </div>

    <div class="panel">
      <h2>订阅</h2>
      <label for="filter">主题过滤器</label>
      <input id="filter" type="text" value="demo/#" spellcheck="false">
      <label for="subQos">请求 QoS</label>
      <select id="subQos">
        <option value="0">0 · 至多一次</option>
        <option value="1" selected>1 · 至少一次</option>
        <option value="2">2 · 恰好一次</option>
      </select>
      <div class="btns">
        <button id="btnSub">订阅</button>
        <button id="btnUnsub">退订</button>
      </div>
    </div>

    <div class="panel">
      <h2>发布</h2>
      <label for="topic">主题（不含通配符）</label>
      <input id="topic" type="text" value="demo/tx" spellcheck="false">
      <label for="payload">载荷（文本）</label>
      <input id="payload" type="text" value="hello from cj-tauri" spellcheck="false">
      <label for="payloadHex">载荷（十六进制，填了就按二进制发）</label>
      <input id="payloadHex" type="text" placeholder="例如 00 01 ff（可带空格）" spellcheck="false">
      <div class="row">
        <div>
          <label for="pubQos">QoS</label>
          <select id="pubQos">
            <option value="0" selected>0 · 至多一次</option>
            <option value="1">1 · 至少一次</option>
            <option value="2">2 · 恰好一次</option>
          </select>
        </div>
        <div style="flex:0 0 96px">
          <label for="retain">retain</label>
          <div class="check" style="margin-top:6px">
            <input id="retain" type="checkbox">
            <label for="retain" style="margin:0">保留消息</label>
          </div>
        </div>
      </div>
      <div class="btns">
        <button id="btnPub" class="primary">发布</button>
      </div>
    </div>
  </section>

  <section class="col mid">
    <div class="toolbar">
      <input id="msgFilter" type="text" placeholder="按主题/载荷过滤" spellcheck="false">
      <button id="btnClear">清空</button>
      <button id="btnPause">暂停滚动</button>
      <span class="spacer"></span>
      <span class="count muted" id="msgCount">0 条</span>
    </div>
    <div id="msgs"></div>
  </section>

  <section class="col right">
    <div class="panel">
      <h2>状态</h2>
      <table id="stats"></table>
    </div>
    <div class="panel">
      <h2>订阅表</h2>
      <table id="subs"></table>
      <div class="muted" style="margin-top:6px">qos：0..2 已授予 / -1 已退订 / -2 已发出、回执未到</div>
    </div>
  </section>
</main>

<footer>
  <span id="hint">未连接。断开后重连会先收掉上一条连接（旧读线程收尾后才建新的）。</span>
  <span id="errBox" style="color:#f0a0a4"></span>
</footer>
<script>
"use strict";

/* ---------------------------------------------------------------- 与后端的连接 */

var bridge = null;

/* 页面脚本一律等桥出现：桥在 document-start 注入，但别在模块作用域直接读它（AGENTS §4） */
function waitForBridge(cb) {
  var tries = 0;
  var timer = setInterval(function () {
    tries += 1;
    if (window.__CJ_TAURI__ && window.__CJ_TAURI__.invoke) {
      clearInterval(timer);
      bridge = window.__CJ_TAURI__;
      cb();
    } else if (tries > 200) {           /* 10s 还没出现就如实说，不静默 */
      clearInterval(timer);
      setErr("桥未出现：window.__CJ_TAURI__ 一直没到，页面无法与后端通信");
    }
  }, 50);
}

function invoke(cmd, args) {
  return bridge.invoke(cmd, args || {});
}

/* 前端每一行回投 stderr：无人值守跑的时候证据在应用日志里，不在浏览器控制台 */
function report(line) {
  return invoke("report", { line: "MQTT " + line }).catch(function () {});
}

function $(id) { return document.getElementById(id); }
function setErr(text) { $("errBox").textContent = text ? " ⚠ " + text : ""; }
function setHint(text) { $("hint").textContent = text; }

/* 命令的 reject 一律显示出来——「日志里没有」不能被读成「成功了」（AGENTS §4 的教训） */
function errText(e) {
  if (!e) { return "未知错误"; }
  if (typeof e === "string") { return e; }
  if (e.message) { return e.message; }
  if (e.error) { return e.error; }
  try { return JSON.stringify(e); } catch (_) { return String(e); }
}
function backendErr(e) {
  var text = errText(e);
  setErr(text);
  return text;
}

function fmtTime(ts) {
  if (!ts) { return ""; }
  var at = ts.indexOf("T");
  var body = at >= 0 ? ts.slice(at + 1) : ts;
  return body.length > 12 ? body.slice(0, 12) : body;
}

function intOf(id, fallback) {
  var n = parseInt($(id).value, 10);
  return isNaN(n) ? fallback : n;
}

/* ---------------------------------------------------------------- 状态与统计渲染 */

var STATE_TEXT = {
  idle: "未连接", connecting: "连接中", connected: "已连接",
  closed: "已断开", error: "错误"
};

function renderState(s) {
  var badge = $("stateBadge");
  badge.textContent = STATE_TEXT[s.state] || s.state || "未知";
  badge.className = "badge " + (s.state || "idle");
  if (s.state === "connected") {
    $("connInfo").textContent = s.host + ":" + s.port + " · " + s.clientId +
      " · keepalive " + s.keepaliveSec + "s";
  } else if (s.state === "error") {
    $("connInfo").textContent = s.error || "连接失败";
  } else if (s.state === "closed" || s.state === "idle") {
    $("connInfo").textContent = "—";
  }
  renderStats(s);
}

function renderStats(s) {
  var rows = [
    ["状态", STATE_TEXT[s.state] || s.state || ""],
    ["地址", (s.host || "") + ":" + (s.port || "")],
    ["clientId", s.clientId || ""],
    ["保活", (s.keepaliveSec || 0) + "s"],
    ["cleanSession", s.cleanSession === undefined ? "" : String(!!s.cleanSession)],
    ["读线程", s.readerAlive === undefined ? "" : (s.readerAlive ? "在跑" : "已停")],
    ["收 / 发", (s.rx || 0) + " / " + (s.tx || 0)],
    ["缓冲 / 丢弃", (s.buffered || 0) + " / " + (s.dropped || 0)],
    ["待回执", (s.pendingAcks === undefined ? "" : String(s.pendingAcks))],
    ["最近错误", s.lastError || "—"]
  ];
  var tbl = $("stats");
  tbl.textContent = "";
  rows.forEach(function (pair) {
    var tr = document.createElement("tr");
    var k = document.createElement("td");
    k.className = "k";
    k.textContent = pair[0];
    var v = document.createElement("td");
    v.className = "v";
    v.textContent = pair[1] === undefined || pair[1] === null ? "" : String(pair[1]);
    tr.appendChild(k);
    tr.appendChild(v);
    tbl.appendChild(tr);
  });
}

function renderSubs(subs) {
  var tbl = $("subs");
  tbl.textContent = "";
  var keys = Object.keys(subs || {});
  if (keys.length === 0) {
    var tr = document.createElement("tr");
    var td = document.createElement("td");
    td.className = "v";
    td.textContent = "（还没有订阅）";
    tr.appendChild(td);
    tbl.appendChild(tr);
    return;
  }
  keys.forEach(function (name) {
    var row = document.createElement("tr");
    var k = document.createElement("td");
    k.className = "k";
    k.textContent = name;
    var v = document.createElement("td");
    v.className = "v";
    v.textContent = String(subs[name]);
    row.appendChild(k);
    row.appendChild(v);
    tbl.appendChild(row);
  });
}

function refreshStatus() {
  return invoke("mqtt:status").then(function (s) {
    renderState(s);
    renderSubs(s.subscriptions);
    setHint("状态已刷新：收 " + s.rx + " / 发 " + s.tx + " / 丢弃 " + s.dropped +
      "（订阅表 " + Object.keys(s.subscriptions || {}).length + " 条）");
    return s;
  }).catch(function (e) { backendErr(e); return null; });
}

function pullRecent() {
  return invoke("mqtt:recent", { limit: 500 }).then(function (r) {
    (r.messages || []).forEach(ingest);
    setHint("拉取到 " + r.count + " 条（取走即清；累计丢弃 " + r.droppedTotal + "）");
    return r;
  }).catch(function (e) { backendErr(e); return null; });
}

/* ---------------------------------------------------------------- 各操作 */

function doConnect() {
  var host = $("host").value.trim();
  if (!host) {
    setErr("主机不能为空");
    return Promise.resolve(null);
  }
  var args = {
    host: host,
    port: intOf("port", 1883),
    clientId: $("clientId").value.trim(),
    keepaliveSec: intOf("keepalive", 60),
    cleanSession: $("clean").checked,
    username: $("username").value,
    password: $("password").value
  };
  setErr("");
  setHint("正在连接 " + args.host + ":" + args.port + " …");
  report("connect start host=" + args.host + " port=" + args.port +
    " keepalive=" + args.keepaliveSec);
  return invoke("mqtt:connect", args).then(function (r) {
    report("connect ok state=" + r.state + " clientId=" + r.clientId +
      " sessionPresent=" + r.sessionPresent);
    setHint("已连上 " + r.host + ":" + r.port + "（sessionPresent=" + r.sessionPresent + "）");
    return refreshStatus();
  }).catch(function (e) {
    var text = backendErr(e);
    report("connect failed: " + text);
    renderState({ state: "error", error: text });
    return null;
  });
}

function doDisconnect() {
  report("disconnect start");
  return invoke("mqtt:disconnect").then(function (r) {
    report("disconnect ok sent=" + r.sentDisconnect + " rx=" + r.rx + " tx=" + r.tx +
      " dropped=" + r.dropped);
    setHint("已断开（DISCONNECT " + (r.sentDisconnect ? "已发出" : "未发出") +
      "；本轮收 " + r.rx + " 发 " + r.tx + "）");
    return refreshStatus();
  }).catch(function (e) { return backendErr(e); });
}

function doSubscribe() {
  var filter = $("filter").value.trim();
  var args = { filter: filter, qos: intOf("subQos", 0), waitMs: 3000 };
  setErr("");
  report("subscribe start filter=" + filter + " qos=" + args.qos);
  return invoke("mqtt:subscribe", args).then(function (r) {
    report("subscribe result state=" + r.state + " granted=" + (r.grantedText || r.state) +
      " pid=" + r.packetId);
    setHint("订阅 " + filter + "：" + (r.note || r.state));
    return refreshStatus();
  }).catch(function (e) {
    var text = backendErr(e);
    report("subscribe failed: " + text);
    return null;
  });
}

function doUnsubscribe() {
  var filter = $("filter").value.trim();
  report("unsubscribe start filter=" + filter);
  return invoke("mqtt:unsubscribe", { filter: filter }).then(function (r) {
    report("unsubscribe ok filter=" + r.filter + " pid=" + r.packetId);
    setHint("已退订 " + filter);
    return refreshStatus();
  }).catch(function (e) { return backendErr(e); });
}

function doPublish() {
  var args = {
    topic: $("topic").value.trim(),
    qos: intOf("pubQos", 0),
    retain: $("retain").checked
  };
  /* 载荷两种给法：给了 hex 就按二进制发，否则按文本发（插件侧禁止两个同时给） */
  var hexRaw = $("payloadHex").value.trim();
  if (hexRaw) {
    args.hex = hexRaw.replace(/\s+/g, "");
  } else {
    args.text = $("payload").value;
  }
  setErr("");
  report("publish start topic=" + args.topic + " qos=" + args.qos +
    " bytes=" + (args.hex ? args.hex.length / 2 : args.text.length));
  return invoke("mqtt:publish", args).then(function (r) {
    report("publish ok topic=" + r.topic + " qos=" + r.qos + " bytes=" + r.bytes +
      " pid=" + r.packetId);
    setHint("已发布到 " + r.topic + "（QoS " + r.qos + "，报文字节 " + r.bytes + "）");
    return refreshStatus();
  }).catch(function (e) {
    var text = backendErr(e);
    report("publish failed: " + text);
    return null;
  });
}
</script>
<script>
"use strict";

/* ---------------------------------------------------------------- 报文流 */

var msgs = [];          /* 页面自己留一份数据，DOM 只是它的视图（过滤/清空/暂停都改这里） */
var seenSeq = {};       /* D-015：同一条报文事件与 recent 两条通道都会到，按 seq 去重 */
var msgLimit = 2000;    /* 数据侧上限 */
var rowLimit = 500;     /* DOM 侧上限：再多也不看，砍最旧的行 */
var paused = false;
var filterText = "";

function payloadOf(m) {
  if (typeof m.payloadText === "string") { return m.payloadText; }
  if (m.payloadHex) { return "0x" + m.payloadHex; }
  if (typeof m.hex === "string" && m.hex) { return "0x" + m.hex; }
  return "";
}

function rowMatches(m) {
  if (!filterText) { return true; }
  var hay = (m.topic || "") + " " + (m.note || "") + " " + (m.typeName || "") + " " + payloadOf(m);
  return hay.toLowerCase().indexOf(filterText) >= 0;
}

function makeRow(m) {
  var row = document.createElement("div");
  row.className = "msg " + (m.dir === "tx" ? "tx" : "rx");

  var t = document.createElement("span");
  t.className = "t";
  t.textContent = fmtTime(m.ts);

  var ty = document.createElement("span");
  ty.className = "ty";
  ty.textContent = (m.dir === "tx" ? "→ " : "← ") + (m.typeName || "?");

  var body = document.createElement("span");
  body.className = "body";
  var bits = [];
  if (m.typeName === "PUBLISH") {
    bits.push("qos" + (m.qos === undefined ? 0 : m.qos));
    if (m.retain) { bits.push("retain"); }
    if (m.dup) { bits.push("dup"); }
  }
  if (m.packetId !== undefined && m.packetId !== null && m.packetId !== 0) {
    bits.push("pid" + m.packetId);
  }
  if (m.payloadBytes !== undefined) { bits.push(m.payloadBytes + "B"); }
  if (m.bytes !== undefined && m.bytes !== m.payloadBytes) { bits.push("帧" + m.bytes + "B"); }
  if (m.truncated) { bits.push("已截断"); }

  var topic = document.createElement("b");
  topic.textContent = m.topic ? m.topic : (m.typeName === "PUBLISH" ? "(空主题)" : "");
  body.appendChild(topic);

  var meta = document.createElement("i");
  meta.textContent = bits.length ? " " + bits.join(" ") : "";
  body.appendChild(meta);

  var text = payloadOf(m);
  if (text) {
    var pl = document.createElement("i");
    pl.textContent = " " + (text.length > 400 ? text.slice(0, 400) + "…" : text);
    body.appendChild(pl);
  }
  if (m.note) {
    var note = document.createElement("i");
    note.textContent = " · " + m.note;
    body.appendChild(note);
  }

  row.appendChild(t);
  row.appendChild(ty);
  row.appendChild(body);
  return row;
}

function trimRows() {
  var box = $("msgs");
  while (box.children.length > rowLimit) { box.removeChild(box.lastChild); }
}

function prependRow(row) {
  var box = $("msgs");
  box.insertBefore(row, box.firstChild);
  trimRows();
}

/* 过滤条件变了就整块重画：数据在 msgs 里，DOM 只是视图，重画不会丢东西 */
function rebuild() {
  var box = $("msgs");
  box.textContent = "";
  var shown = 0;
  for (var i = msgs.length - 1; i >= 0 && shown < rowLimit; i--) {
    if (rowMatches(msgs[i])) { box.appendChild(makeRow(msgs[i])); shown += 1; }
  }
  $("msgCount").textContent = msgs.length + " 条";
}

function ingest(m) {
  if (!m) { return; }
  if (m.seq !== undefined && m.seq !== null) {
    var key = String(m.seq);
    if (seenSeq[key]) { return; }
    seenSeq[key] = true;
  }
  msgs.push(m);
  while (msgs.length > msgLimit) { msgs.shift(); }
  if (!paused && rowMatches(m)) { prependRow(makeRow(m)); }
  $("msgCount").textContent = msgs.length + " 条";
}

/* 状态变迁也插一行进报文流：调试时「什么时候掉的」与「报文到哪一步」要看在同一条时间线上 */
function noteState(s) {
  renderState(s);
  if (paused) { return; }
  var row = document.createElement("div");
  row.className = "msg err";
  var t = document.createElement("span");
  t.className = "t";
  t.textContent = nowClock();
  var ty = document.createElement("span");
  ty.className = "ty";
  ty.textContent = "STATE";
  var body = document.createElement("span");
  body.className = "body";
  body.textContent = (STATE_TEXT[s.state] || s.state) +
    (s.error ? "：" + s.error : "") + "（收 " + (s.rx || 0) + " 发 " + (s.tx || 0) + "）";
  row.appendChild(t);
  row.appendChild(ty);
  row.appendChild(body);
  prependRow(row);
}

function nowClock() {
  var d = new Date();
  function two(n) { return n < 10 ? "0" + n : "" + n; }
  return two(d.getHours()) + ":" + two(d.getMinutes()) + ":" + two(d.getSeconds()) + ".000";
}

/* ---------------------------------------------------------------- 探针（无人值守） */

/*
 * 设了 CJ_MQTT_PROBE_HOST 时由 main.cj 注入 window.__MQTT_PROBE__：
 * 自动 连接 → 订阅 → 发布 → 等回推（含保活心跳）→ 取 recent → 断 → 重连 → 退。
 * 每一关键步都 report 一行（进应用 stderr），自动化脚本据此对账；对端证据在 mock broker 的日志里。
 */
function runProbe(p) {
  var port = parseInt(p.port, 10);
  if (isNaN(port)) { port = 1883; }
  var budgetMs = parseInt(p.ms, 10);
  if (isNaN(budgetMs)) { budgetMs = 6000; }
  var shouldQuit = String(p.quit) !== "0";
  report("probe start host=" + p.host + " port=" + port + " ms=" + budgetMs);

  $("host").value = p.host;
  $("port").value = String(port);
  $("clientId").value = "cj-tauri-probe";
  $("keepalive").value = "1";     /* 1 秒保活：预算内必然发一次 PINGREQ，把保活也证了 */
  $("clean").checked = true;
  $("username").value = "";
  $("password").value = "";
  $("filter").value = "demo/#";
  $("subQos").value = "1";
  $("topic").value = "demo/tx";
  $("payload").value = "hello-mock";
  $("payloadHex").value = "";
  $("pubQos").value = "1";        /* QoS 1：收侧 PUBACK / 发侧 PUBACK 都走一遍 */

  var steps = [];
  steps.push(function () { return doConnect(); });
  steps.push(function () { return doSubscribe(); });
  steps.push(function () { return doPublish(); });
  /* QoS 2 再发一条：把「PUBLISH → PUBREC → PUBREL → PUBCOMP」这条发送侧状态机也拉进同一轮验证 */
  steps.push(function () {
    $("payload").value = "hello-qos2";
    $("pubQos").value = "2";
    report("probe publish qos2 topic=" + $("topic").value);
    return doPublish();
  });
  steps.push(function () {
    return new Promise(function (res) { setTimeout(res, budgetMs); });
  });
  steps.push(function () {
    return invoke("mqtt:recent", { limit: 500 }).then(function (r) {
      var seen = (r.messages || []).map(function (m) {
        return m.dir + ":" + m.typeName + ":" + (m.topic || "-");
      });
      report("probe recent count=" + r.count + " msgs=" + seen.join("|"));
      return r;
    });
  });
  steps.push(function () {
    return invoke("mqtt:status").then(function (s) {
      report("probe status state=" + s.state + " rx=" + s.rx + " tx=" + s.tx +
        " dropped=" + s.dropped + " buffered=" + s.buffered +
        " subs=" + Object.keys(s.subscriptions || {}).length);
      return s;
    });
  });
  steps.push(function () { return doDisconnect(); });
  steps.push(function () {
    report("probe reconnect");
    return doConnect().then(function () {
      return invoke("mqtt:status").then(function (s) {
        report("probe reconnect state=" + s.state + " rx=" + s.rx + " tx=" + s.tx);
        return s;
      });
    });
  });
  steps.push(function () {
    report("probe done");
    if (shouldQuit) { return invoke("quit"); }
    return Promise.resolve(null);
  });

  var chain = Promise.resolve(null);
  steps.forEach(function (step) {
    chain = chain.then(step).catch(function (e) {
      /* 失败也往下走，但每一步都留痕——「哪一步没成」必须能从日志里读出来 */
      report("probe step failed: " + errText(e));
    });
  });
  return chain;
}

/* ---------------------------------------------------------------- 启动 */

function init() {
  waitForBridge(function () {
    /* 回调收的是 payload 本身（bridge_js.h：arr[i](msg.payload)） */
    bridge.listen("mqtt:message", function (m) { ingest(m); });
    bridge.listen("mqtt:state", function (s) { noteState(s); });

    $("btnConnect").onclick = doConnect;
    $("btnDisconnect").onclick = doDisconnect;
    $("btnSub").onclick = doSubscribe;
    $("btnUnsub").onclick = doUnsubscribe;
    $("btnPub").onclick = doPublish;
    $("btnStatus").onclick = refreshStatus;
    $("btnRecent").onclick = pullRecent;
    $("btnClear").onclick = function () {
      msgs = [];
      $("msgs").textContent = "";
      $("msgCount").textContent = "0 条";
      setErr("");
      setHint("已清空（注意：清的是页面这一份；后端缓冲要用「拉取缓冲」取走）");
    };
    $("btnPause").onclick = function () {
      paused = !paused;
      $("btnPause").textContent = paused ? "继续滚动" : "暂停滚动";
      if (!paused) { rebuild(); }
    };
    $("msgFilter").oninput = function () {
      filterText = $("msgFilter").value.trim().toLowerCase();
      rebuild();
    };

    report("page ready");
    refreshStatus();
    if (window.__MQTT_PROBE__) { runProbe(window.__MQTT_PROBE__); }
  });
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
