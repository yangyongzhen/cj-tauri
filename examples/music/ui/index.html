<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>仓颉爱音乐 · cj-tauri</title>
  <!--
    cj-tauri 音乐播放器示例的页面（examples/music）

    契约（AGENTS §3）：前端只经 window.__CJ_TAURI__ 的 invoke / listen / emit 说话——
    这个文件里没有一处 fetch / XMLHttpRequest，后台接口全部由仓颉侧命令代劳
    （理由是页面来源 opaque + 端到端取证要落在 stderr，详见 src/commands.cj 开头的注释）。

    播放本身是唯一例外：<audio>/<video> 这类**媒体元素**本来就该由页面直接加载 src
    （接口文档也是这么说的：把 `…/song/media/outer/url?id=…` 交给组件即可），
    走 IPC 把几 MB 音频搬进来反倒是歪路。
  -->
  <style>
    :root {
      --bg: #080b13;
      --bg-2: #0e1422;
      --panel: rgba(255, 255, 255, 0.045);
      --panel-hi: rgba(255, 255, 255, 0.085);
      --line: rgba(255, 255, 255, 0.075);
      --text: #e9eefb;
      --dim: #8f9cba;
      --dimmer: #5f6b86;
      --accent: #4f8cff;
      --accent-2: #a45cff;
      --pink: #ff4d80;
      --ok: #35d39a;
      --warn: #ffb648;
      --radius: 14px;
      --shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      /*
       * 强调色的 RGB 三元组：页面里到处要按不同透明度铺底/发光（rgba(var(--accent-rgb), 0.2) 这种），
       * 光留 --accent 的十六进制没法算透明度，所以两种形态都留着——**换主题时四个值一起改**。
       */
      --accent-rgb: 79, 140, 255;
      --accent-2-rgb: 164, 92, 255;
    }

    /* ---------------------------------------------------------------- 主题

       只换「强调色」这一对（+ 它们的 RGB 三元组，共四个值）：底色 / 面板 / 文字这套深色底不跟着动——
       页面里还有二十多处写死的深色面（#080b13、#0c111d、rgba(12, 18, 32, …)），真要出浅色主题
       得先把它们也变量化，那是另一件事（记在 examples/music/README 的待办里）。
       挂 <html> 而不是 <body>：这样连 :root 自己那条规则也能读到被覆盖的值。 */
    html.theme-sunset {
      --accent: #ff7a59;
      --accent-2: #ff3d81;
      --accent-rgb: 255, 122, 89;
      --accent-2-rgb: 255, 61, 129;
    }

    html.theme-forest {
      --accent: #2fd8a5;
      --accent-2: #4f9dff;
      --accent-rgb: 47, 216, 165;
      --accent-2-rgb: 79, 157, 255;
    }

    html.theme-ocean {
      --accent: #2bb7f0;
      --accent-2: #7c5cff;
      --accent-rgb: 43, 183, 240;
      --accent-2-rgb: 124, 92, 255;
    }

    /* ---------------------------------------------------------------- 动效降级

       系统开了「减少动态效果」时把动画/过渡压到接近 0（而不是留一段长动画）。三处要单独关：
         · 轮播的自动翻页在 JS 侧本来就不启动（reducedMotion()），那条进度线也不该装作还在走；
         · 唱片停转（.spin 的 rotate 是 22s 持续动画，最容易引起不适）；
         · 歌词容器的平滑滚动（否则点一句歌词还是会滑很远）。 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }

      .banner .dots i.on::after { display: none; }
      .now .art.spin img { animation: none; }
      .lyrics { scroll-behavior: auto; }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* 背景光晕：两团模糊的色斑 + 一层暗角，让纯深色底不至于死板 */
    body::before {
      content: "";
      position: fixed;
      inset: -20% -10% auto -10%;
      height: 70vh;
      background:
        radial-gradient(42% 60% at 18% 12%, rgba(var(--accent-rgb), 0.28), transparent 70%),
        radial-gradient(38% 55% at 82% 4%, rgba(var(--accent-2-rgb), 0.24), transparent 72%);
      filter: blur(10px);
      pointer-events: none;
      z-index: 0;
    }

    ::-webkit-scrollbar {
      width: 9px;
      height: 9px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 9px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.26);
      background-clip: padding-box;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    /* ---------------------------------------------------------------- 骨架布局 */

    .app {
      position: relative;
      z-index: 1;
      height: 100vh;
      /* 大屏护栏：三栏是 212 / 1fr / 320，超宽时中间那栏被拉得很散（2560 全屏下 middle
         有 2000px，卡片、歌词行都失去比例）。超过 1560px 就居中留白，看起来是「窗口化」
         播放器；背景光晕是 body::before（整屏 fixed），留白处不会空成一块死黑。 */
      max-width: 1560px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 212px minmax(0, 1fr) 320px;
      grid-template-rows: 62px minmax(0, 1fr) 96px;
      gap: 0;
    }

    header.topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.012));
      backdrop-filter: blur(14px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 176px;
    }

    .brand .logo {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      font-size: 17px;
      box-shadow: 0 6px 18px rgba(var(--accent-rgb), 0.42);
    }

    .brand .name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .brand .sub {
      font-size: 11px;
      color: var(--dimmer);
      letter-spacing: 0.6px;
    }

    .search {
      flex: 1;
      max-width: 520px;
      display: flex;
      align-items: center;
      gap: 9px;
      height: 38px;
      padding: 0 14px;
      border-radius: 19px;
      background: var(--panel);
      border: 1px solid var(--line);
      transition: border-color 0.2s var(--ease), background 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }

    .search:focus-within {
      border-color: rgba(var(--accent-rgb), 0.65);
      background: var(--panel-hi);
      box-shadow: 0 0 0 4px rgba(var(--accent-rgb), 0.13);
    }

    .search input {
      flex: 1;
      background: none;
      border: 0;
      outline: none;
      color: var(--text);
      font: inherit;
      user-select: text;
    }

    .search input::placeholder {
      color: var(--dimmer);
    }

    .search .hint {
      font-size: 11px;
      color: var(--dimmer);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 1px 6px;
    }

    /* ---------------------------------------------------------------- 左侧导航 */

    .sidebar {
      border-right: 1px solid var(--line);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 0;
    }

    .nav-title {
      font-size: 11px;
      color: var(--dimmer);
      letter-spacing: 1.4px;
      margin: 6px 10px 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 11px;
      height: 40px;
      padding: 0 12px;
      border-radius: 11px;
      color: var(--dim);
      cursor: pointer;
      transition: background 0.16s var(--ease), color 0.16s var(--ease);
      position: relative;
    }

    .nav-item .ico {
      width: 20px;
      text-align: center;
      font-size: 15px;
    }

    .nav-item .label {
      flex: 1;
      font-size: 13.5px;
    }

    .nav-item .count {
      font-size: 11px;
      color: var(--dimmer);
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 1px 7px;
    }

    .nav-item:hover {
      background: var(--panel);
      color: var(--text);
    }

    .nav-item.active {
      color: #fff;
      background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.26), rgba(var(--accent-2-rgb), 0.14));
      box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), 0.32);
    }

    .nav-item.active::before {
      content: "";
      position: absolute;
      left: -12px;
      top: 9px;
      bottom: 9px;
      width: 3px;
      border-radius: 3px;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
    }

    /* ---------------------------------------------------------------- 主区域 */

    main.content {
      min-width: 0;
      overflow-y: auto;
      padding: 20px 24px 26px;
    }

    .view-head {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      margin-bottom: 16px;
    }

    .view-head h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.3px;
      /* 标题不许换行、也不参与收缩：三栏布局下中间那栏本来就不宽，
         让 h1 去挤就会被折成「热门歌 / 曲」两行（实机抓图时抓到过） */
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .view-head .desc {
      font-size: 12.5px;
      color: var(--dim);
      padding-bottom: 3px;
      /* 要收缩的是这一段说明，不是标题；min-width:0 是让 flex 项真的能缩到内容宽度以下 */
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .view-head .right {
      margin-left: auto;
      flex: 0 0 auto;
      display: flex;
      gap: 8px;
      padding-bottom: 2px;
    }

    .btn {
      height: 32px;
      padding: 0 14px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      font: inherit;
      font-size: 12.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: background 0.16s var(--ease), border-color 0.16s var(--ease), transform 0.1s var(--ease);
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--panel-hi);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 8px 20px rgba(var(--accent-rgb), 0.32);
    }

    .btn.primary:hover {
      filter: brightness(1.08);
    }

    .btn.ghost {
      background: transparent;
    }

    .btn[disabled] {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* 热门页顶部的轮播横幅：模糊封面铺底 + 方形封面 + 曲目信息 + 圆点/箭头 */
    .banner {
      position: relative;
      border-radius: 18px;
      border: 1px solid var(--line);
      overflow: hidden;
      margin-bottom: 18px;
      background: #101728;
      /* 按宽度定高（16:6）。不支持 aspect-ratio 的老 WebView 落到 min-height，不会塌成一条线 */
      aspect-ratio: 16 / 6;
      min-height: 208px;
      /* 大屏护栏：宽度过了 ~715px 之后高度不再跟着涨。16:6 是照 1280 窗口定的，
         全屏时中间那列能有 2000px 宽，横幅按比例就涨到 750px 高——132px 的封面缩成
         正中一小块、模糊底占满整屏，正是「全屏后很难看」的来源（实测全屏如此）。
         268px 就是 1280 窗口下的自然高度，等于「≥1280 一律这个高度」。 */
      max-height: 268px;
    }

    .banner .stage {
      position: absolute;
      inset: 0;
    }

    /* 每张 slide 叠在一起，靠 opacity 交叉淡入淡出 */
    .banner .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.45s ease;
      pointer-events: none;
    }

    .banner .slide.on {
      opacity: 1;
      pointer-events: auto;
    }

    /* 氛围层：同一张封面模糊铺满，cover 等比裁切（这不是「拉伸的图」，是被刻意糊掉的底） */
    .banner .bg-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .banner .bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.12);
      filter: blur(26px) saturate(1.4) brightness(0.55);
      display: block;
    }

    .banner .veil {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(9, 13, 24, 0.94) 0%, rgba(9, 13, 24, 0.62) 46%, rgba(9, 13, 24, 0.18) 100%);
    }

    .banner .row {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 20px 26px;
    }

    .banner .art {
      width: 132px;
      height: 132px;
      flex: none;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: #131a2b;
    }

    /* 关键一条：object-fit 必须写在 <img> 上。写在容器上不生效——容器不是被替换元素，
       图会按自然尺寸落进框里变形（第一版 `.hero .art` 就是这么被压扁的）。 */
    .banner .art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .banner .art .ph {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--dimmer);
      font-size: 34px;
    }

    .banner .info {
      min-width: 0;
      flex: 1 1 auto;
    }

    .banner .tag {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 1px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 6px;
      padding: 2px 8px;
      margin-bottom: 10px;
    }

    .banner h2 {
      margin: 0 0 6px;
      font-size: 24px;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .banner .sing {
      color: var(--dim);
      font-size: 13px;
      margin-bottom: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .banner .actions {
      display: flex;
      gap: 10px;
    }

    /* 箭头平时藏着，鼠标移进横幅才浮出来（不抢视觉） */
    .banner .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(12, 18, 32, 0.6);
      color: #fff;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease, background 0.2s ease;
    }

    .banner:hover .nav-btn {
      opacity: 1;
    }

    .banner .nav-btn:hover {
      background: rgba(12, 18, 32, 0.85);
    }

    .banner .nav-btn.prev {
      left: 12px;
    }

    .banner .nav-btn.next {
      right: 12px;
    }

    .banner .dots {
      position: absolute;
      right: 22px;
      bottom: 16px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .banner .dots i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: width 0.2s ease, background 0.2s ease;
    }

    /* 当前那颗不是「一条渐变药丸」，而是一条按周期走完的进度线：轨道 + 内部填充。
       时长走 --banner-gap（wireBanner 里按 BANNER_GAP_MS 写进来），不写字面量——
       写字面量的话改了常量就会「线跑完了页还没翻」。 */
    .banner .dots i.on {
      position: relative;
      width: 34px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.22);
      overflow: hidden;
    }

    .banner .dots i.on::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transform-origin: left center;
      animation: dotfill var(--banner-gap, 5s) linear both;
    }

    /* 悬停时 JS 停掉的是自动翻页的定时器，进度线得一起冻住，否则线走完了页还停着 */
    .banner:hover .dots i.on::after {
      animation-play-state: paused;
    }

    @keyframes dotfill {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    /* 氛围底缓慢推近（Ken Burns）+ 文字错峰上浮。规则都挂在 .on 上，而 setBanner() 只切 class、
       不重画 DOM，所以每次换页这两个动画都会从头播一遍。 */
    @keyframes kbIn {
      from { transform: scale(1); }
      to { transform: scale(1.07); }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    .banner .slide.on .bg {
      animation: kbIn 9s ease-out both;
    }

    .banner .slide.on .art,
    .banner .slide.on .info > * {
      animation: riseIn 0.5s var(--ease) both;
    }

    .banner .slide.on .info > *:nth-child(1) { animation-delay: 0.05s; }
    .banner .slide.on .info > *:nth-child(2) { animation-delay: 0.12s; }
    .banner .slide.on .info > *:nth-child(3) { animation-delay: 0.18s; }
    .banner .slide.on .info > *:nth-child(4) { animation-delay: 0.24s; }

    /* 首页的区块表头（「后台歌单」这一条） */
    .sec-head {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 2px 0 12px;
    }

    .sec-head h3 {
      margin: 0;
      font-size: 16px;
      white-space: nowrap;
    }

    .sec-hint {
      font-size: 12px;
      color: var(--dimmer);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sec-head .btn.tiny {
      margin-left: auto;
      padding: 5px 10px;
      font-size: 12px;
      flex: none;
    }

    /* 横向滚动行：卡片横排、滚动条细条化、箭头平时藏着 */
    .hscroll-wrap {
      position: relative;
      margin-bottom: 24px;
    }

    .hscroll {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 2px 2px 10px;
      scroll-snap-type: x proximity;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
    }

    .hscroll::-webkit-scrollbar {
      height: 8px;
    }

    .hscroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 4px;
    }

    .hscroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .mcard {
      flex: none;
      width: 152px;
      cursor: pointer;
      scroll-snap-align: start;
    }

    .mcard .mcover {
      width: 152px;
      height: 152px;
      border-radius: 14px;
      overflow: hidden;
      background: #131a2b;
      box-shadow: var(--shadow);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    /* fillCover 插进来的 <img> 不带 class、也不带行内尺寸，尺寸规则必须落在容器内（同 .banner .art img） */
    .mcard .mcover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .mcard:hover .mcover {
      transform: translateY(-4px);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.45);
    }

    .mcard .mt {
      margin-top: 9px;
      font-size: 13px;
      line-height: 1.35;
      height: 36px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .mcard .ms {
      margin-top: 3px;
      font-size: 11px;
      color: var(--dimmer);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hscroll-btn {
      position: absolute;
      top: 60px;
      z-index: 2;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(12, 18, 32, 0.72);
      color: #fff;
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .hscroll-wrap:hover .hscroll-btn {
      opacity: 1;
    }

    .hscroll-btn:disabled {
      opacity: 0;
      cursor: default;
    }

    .hscroll-btn.prev {
      left: -8px;
    }

    .hscroll-btn.next {
      right: -8px;
    }

    /* 歌曲行 */
    .song-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .song-row {
      display: grid;
      grid-template-columns: 30px 44px minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 14px;
      padding: 7px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s var(--ease);
      border: 1px solid transparent;
    }

    /* 序号列：榜单/列表的位次，等宽数字对齐 */
    .song-row .rank {
      font-size: 13px;
      color: var(--dimmer);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .song-row.playing .rank {
      color: var(--accent);
      font-weight: 700;
    }

    /* 时长列：后台的歌曲对象只有 sid / song / sing / url / cover 五个字段（src/commands.cj 的
       映射里没有 duration），所以**不填假数字**——只在真的播过、从 audio.duration 学到真值之后
       才写进页面（DUR 表 + rememberDuration），没听过的那几行就是空的。 */
    .song-row .dur {
      font-size: 12px;
      color: var(--dimmer);
      font-variant-numeric: tabular-nums;
      min-width: 34px;
      text-align: right;
    }

    .song-row:hover {
      background: var(--panel);
      border-color: var(--line);
    }

    .song-row.playing {
      background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.18), rgba(var(--accent-2-rgb), 0.07));
      border-color: rgba(var(--accent-rgb), 0.3);
    }

    .song-row .thumb {
      position: relative;
      width: 44px;
      height: 44px;
    }

    .song-row .thumb img {
      width: 44px;
      height: 44px;
      border-radius: 9px;
      object-fit: cover;
      background: #131a2b;
      display: block;
    }

    .song-row .thumb .ph {
      width: 44px;
      height: 44px;
      border-radius: 9px;
      background: linear-gradient(135deg, #1a2236, #232c45);
      display: grid;
      place-items: center;
      color: var(--dimmer);
      font-size: 17px;
    }

    .song-row .meta {
      min-width: 0;
    }

    .song-row .t {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-row.playing .t {
      color: #cfe0ff;
      font-weight: 600;
    }

    .song-row .s {
      font-size: 12px;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .song-row .acts {
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.15s var(--ease);
    }

    .song-row:hover .acts,
    .song-row.playing .acts {
      opacity: 1;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      font-size: 14px;
      display: grid;
      place-items: center;
      transition: background 0.15s var(--ease), color 0.15s var(--ease);
    }

    .icon-btn:hover {
      background: var(--panel-hi);
      color: var(--text);
    }

    .icon-btn.on {
      color: var(--pink);
    }

    /* 正在播放的跳动音柱 */
    .bars {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 2px;
      padding-bottom: 9px;
      border-radius: 9px;
      background: rgba(6, 9, 16, 0.52);
    }

    .bars i {
      width: 3px;
      background: #fff;
      border-radius: 2px;
      animation: eq 0.9s ease-in-out infinite;
    }

    .bars i:nth-child(1) { height: 8px; animation-delay: 0s; }
    .bars i:nth-child(2) { height: 15px; animation-delay: 0.18s; }
    .bars i:nth-child(3) { height: 10px; animation-delay: 0.36s; }

    @keyframes eq {
      0%, 100% { transform: scaleY(0.45); }
      50% { transform: scaleY(1); }
    }

    /* 歌单卡片网格 */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
      gap: 16px;
    }

    .card {
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 12px;
      cursor: pointer;
      transition: transform 0.18s var(--ease), border-color 0.18s var(--ease), background 0.18s var(--ease);
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(var(--accent-rgb), 0.4);
      background: var(--panel-hi);
    }

    .card .cover {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 11px;
      overflow: hidden;
      background: linear-gradient(135deg, #172038, #222c46);
      margin-bottom: 10px;
    }

    .card .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card .cover .ph {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--dimmer);
      font-size: 26px;
    }

    .card .cover .play-fab {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 0;
      color: #fff;
      font-size: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.18s var(--ease), transform 0.18s var(--ease);
    }

    .card:hover .cover .play-fab {
      opacity: 1;
      transform: translateY(0);
    }

    .card .ct {
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card .cs {
      font-size: 11.5px;
      color: var(--dim);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ------------------------------------------------------ 悬停微交互

       封面缩放必须写在**容器内的 img** 上：fillCover 插进来的 <img> 既没有 class 也没有行内尺寸，
       把 zoom 写在容器上不传导（同 §4「img 尺寸规则必须落在容器内」那条坑）。两块封面的容器
       （.mcover / .cover）本来就有 overflow: hidden，放大不会溢出圆角。 */
    .mcard .mcover img,
    .card .cover img {
      transition: transform 0.34s var(--ease);
    }

    .mcard:hover .mcover img,
    .card:hover .cover img {
      transform: scale(1.06);
    }

    .card:hover {
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.42);
    }

    /* 列表行：原来只变底色，加一格位移让「鼠标停在哪一行」更明确（transform 要一并进 transition，
       否则是硬跳）
       ⚠️ 这条 .song-row 会覆盖上面那条 transition 简写——属性是超集，别单独删 */
    .song-row {
      transition: background 0.15s var(--ease), border-color 0.15s var(--ease), transform 0.15s var(--ease);
    }

    .song-row:hover {
      transform: translateX(2px);
    }

    /* 正在播的行别被悬停规则盖掉：.song-row.playing .t 与本条权重相同，靠 :not(.playing) 划清 */
    .song-row:not(.playing):hover .t {
      color: #fff;
    }

    /* 骨架屏 */
    .skel {
      border-radius: 10px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.05));
      background-size: 200% 100%;
      animation: shimmer 1.3s linear infinite;
    }

    @keyframes shimmer {
      from { background-position: 140% 0; }
      to { background-position: -60% 0; }
    }

    /* 空/错态：一颗光晕圆盘当插画（纯 CSS，不引第三方图）+ 标题 / 说明 / 可选的动作按钮。
       播放队列抽屉里那个裸 .empty（只写了一行字）也吃这套样式——没有子元素时自然退化成一行居中提示。 */
    .empty {
      padding: 46px 20px;
      text-align: center;
      color: var(--dimmer);
      font-size: 13px;
      line-height: 2;
    }

    .empty .art {
      width: 84px;
      height: 84px;
      margin: 0 auto 12px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 34px;
      opacity: 0.9;
      background: radial-gradient(circle at 50% 36%, rgba(var(--accent-rgb), 0.24), rgba(8, 11, 19, 0) 70%);
      border: 1px solid var(--line);
    }

    .empty .title {
      display: block;
      color: var(--text);
      font-size: 14.5px;
      font-weight: 600;
    }

    .empty .sub {
      display: block;
      font-size: 12.5px;
      line-height: 1.7;
      color: var(--dimmer);
      margin-top: 2px;
    }

    .empty .acts {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .chip {
      height: 28px;
      padding: 0 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--dim);
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      transition: all 0.15s var(--ease);
    }

    .chip:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .chip.on {
      color: #fff;
      background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.85), rgba(var(--accent-2-rgb), 0.75));
      border-color: transparent;
    }

    /* ---------------------------------------------------------------- 右侧歌词 / 正在播放 */

    .now {
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 18px 18px 10px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.028), transparent 40%);
    }

    .now .art-wrap {
      display: grid;
      place-items: center;
      margin-bottom: 14px;
    }

    .now .art {
      position: relative;
      width: 196px;
      height: 196px;
      border-radius: 50%;
      background: #0c111d;
      box-shadow: var(--shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      display: grid;
      place-items: center;
    }

    .now .art img {
      width: 178px;
      height: 178px;
      border-radius: 50%;
      object-fit: cover;
      background: #131a2b;
      display: block;
    }

    .now .art .ph {
      width: 178px;
      height: 178px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 34px;
      color: var(--dimmer);
      background: linear-gradient(135deg, #172038, #232c45);
    }

    .now .art::after {
      /* 唱片中心的小孔 */
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #080b13;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
    }

    .now .art.spin img {
      animation: spin 22s linear infinite;
    }

    /* 播放时的呼吸光环：中空径向渐变（中心透明，不挡唱片），套在唱片外圈 14px 处。
       只有 .spin（= 正在播放）时才亮起——.spin 由 paintNowPlaying 按 S.playing 切换，
       所以暂停后它自己会淡回去（基态的 transition 负责这一下淡出）。 */
    .now .art::before {
      content: "";
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--accent-rgb), 0) 58%, rgba(var(--accent-rgb), 0.24) 72%, rgba(var(--accent-2-rgb), 0) 88%);
      opacity: 0;
      transition: opacity 0.4s var(--ease);
      pointer-events: none;
    }

    .now .art.spin::before {
      opacity: 1;
      animation: halo 3.6s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes halo {
      0%, 100% { transform: scale(0.97); opacity: 0.5; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    .now .title {
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .now .sing {
      font-size: 12.5px;
      color: var(--dim);
      text-align: center;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lyrics {
      flex: 1;
      min-height: 0;
      margin-top: 14px;
      overflow-y: auto;
      padding: 8px 4px 40% 4px;
      scroll-behavior: smooth;
      mask-image: linear-gradient(180deg, transparent, #000 12%, #000 78%, transparent);
      -webkit-mask-image: linear-gradient(180deg, transparent, #000 12%, #000 78%, transparent);
    }

    .lyric-line {
      padding: 7px 6px;
      font-size: 13.5px;
      color: var(--dimmer);
      line-height: 1.55;
      transition: color 0.25s var(--ease), transform 0.25s var(--ease), opacity 0.25s var(--ease);
      cursor: pointer;
      text-align: center;
    }

    .lyric-line:hover {
      color: var(--dim);
    }

    .lyric-line.active {
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      transform: scale(1.06);
      text-shadow: 0 0 18px rgba(var(--accent-rgb), 0.5);
    }

    .lyrics .none {
      text-align: center;
      color: var(--dimmer);
      font-size: 12.5px;
      padding-top: 30px;
      line-height: 2;
    }

    /* ---------------------------------------------------------------- 底部播放条 */

    .player {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 240px;
      align-items: center;
      gap: 18px;
      padding: 0 22px;
      border-top: 1px solid var(--line);
      background: linear-gradient(0deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.012));
      backdrop-filter: blur(16px);
    }

    .player .now-mini {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .player .now-mini img,
    .player .now-mini .ph {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      background: #131a2b;
      flex: none;
    }

    .player .now-mini .ph {
      display: grid;
      place-items: center;
      color: var(--dimmer);
      font-size: 20px;
    }

    .player .now-mini .t {
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player .now-mini .s {
      font-size: 11.5px;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .player .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .player .ctrl {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .ctrl-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 0;
      background: transparent;
      color: var(--dim);
      font-size: 15px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: color 0.15s var(--ease), background 0.15s var(--ease);
    }

    .ctrl-btn:hover {
      color: var(--text);
      background: var(--panel);
    }

    .ctrl-btn.main {
      width: 46px;
      height: 46px;
      color: #fff;
      font-size: 17px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      /* 双圈发光：近处一圈紧光 + 远处一圈外扩，比单层 box-shadow 更像「亮起来」 */
      box-shadow: 0 8px 20px rgba(var(--accent-rgb), 0.42), 0 0 34px rgba(var(--accent-2-rgb), 0.28);
      transition: box-shadow 0.2s var(--ease), transform 0.12s var(--ease), filter 0.2s var(--ease);
    }

    .ctrl-btn.main:hover {
      filter: brightness(1.12);
      box-shadow: 0 10px 26px rgba(var(--accent-rgb), 0.55), 0 0 46px rgba(var(--accent-2-rgb), 0.4);
    }

    .ctrl-btn.main:active {
      transform: scale(0.94);
    }

    .progress {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      max-width: 620px;
      font-size: 11.5px;
      color: var(--dim);
      font-variant-numeric: tabular-nums;
    }

    .bar {
      position: relative;
      flex: 1;
      height: 16px;
      display: grid;
      align-items: center;
      cursor: pointer;
    }

    .bar .track {
      height: 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
      transition: height 0.16s var(--ease), background 0.16s var(--ease);
    }

    /* 悬停/按住时轨道加粗一档：4px 细线在宽屏上不好瞄，加粗与把手浮现一起给反馈。
       用 :active 而不是某个 dragging 类——拖拽时指针按在条上，:active 一直成立，
       不依赖 JS 再维护一个状态类。 */
    .bar:hover .track,
    .bar:active .track {
      height: 6px;
      background: rgba(255, 255, 255, 0.18);
    }

    .bar .fill {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.12s linear;
      box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.35);
    }

    .bar .knob {
      position: absolute;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5), 0 0 0 4px rgba(var(--accent-rgb), 0.16);
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity 0.15s var(--ease), transform 0.15s var(--ease);
      pointer-events: none;
    }

    .bar:hover .knob,
    .bar:active .knob {
      opacity: 1;
      transform: translateX(-50%) scale(1.12);
    }

    .player .right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .vol {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 118px;
    }

    /* 音量条：与进度条区分开（那条是主题渐变），这里由白向主题色收口 */
    .vol .bar .fill {
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.45), var(--accent));
      box-shadow: none;
    }

    /* ---------------------------------------------------------------- 队列抽屉 */

    .drawer {
      position: fixed;
      right: 16px;
      /* 跟 .app 的居中护栏对齐：超宽屏下抽屉贴着应用右缘，别落在视口最右边（离播放条老远）。
         上一行是给不支持 max() 的内核的兜底，这一行才是实际生效的。 */
      right: max(16px, calc(50vw - 764px));
      bottom: 108px;
      width: 380px;
      max-height: 62vh;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(14, 20, 34, 0.94);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      z-index: 40;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(12px) scale(0.98);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s var(--ease), transform 0.18s var(--ease);
    }

    .drawer.open {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    .drawer .head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 15px;
      border-bottom: 1px solid var(--line);
      font-size: 13.5px;
      font-weight: 600;
    }

    .drawer .head .sub {
      font-size: 11.5px;
      color: var(--dim);
      font-weight: 400;
    }

    .drawer .head .btn {
      margin-left: auto;
      height: 28px;
    }

    .drawer .body {
      overflow-y: auto;
      padding: 8px;
    }

    .q-row {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 6px 9px;
      border-radius: 10px;
      cursor: pointer;
    }

    .q-row:hover {
      background: var(--panel);
    }

    .q-row.playing {
      background: rgba(var(--accent-rgb), 0.16);
    }

    .q-row .idx {
      font-size: 11.5px;
      color: var(--dimmer);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .q-row.playing .idx {
      color: var(--accent);
    }

    .q-row .t {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .q-row .s {
      font-size: 11px;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---------------------------------------------------------------- 分享弹窗 / 提示 */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 13, 0.62);
      backdrop-filter: blur(5px);
      z-index: 60;
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s var(--ease);
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      width: 520px;
      max-width: calc(100vw - 60px);
      border-radius: 18px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #141b2c, #0e1422);
      box-shadow: var(--shadow);
      padding: 22px 24px 20px;
      transform: translateY(10px) scale(0.98);
      transition: transform 0.18s var(--ease);
    }

    .overlay.open .modal {
      transform: none;
    }

    .modal h3 {
      margin: 0 0 4px;
      font-size: 17px;
    }

    .modal .sub {
      font-size: 12px;
      color: var(--dim);
      margin-bottom: 16px;
      line-height: 1.7;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 11.5px;
      color: var(--dim);
      margin-bottom: 5px;
      letter-spacing: 0.3px;
    }

    .field input,
    .field textarea {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.28);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      padding: 9px 11px;
      outline: none;
      user-select: text;
      transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
    }

    .field textarea {
      resize: vertical;
      min-height: 62px;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: rgba(var(--accent-rgb), 0.6);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.12);
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .modal .foot {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
    }

    .modal .foot .note {
      font-size: 11.5px;
      color: var(--dimmer);
      margin-right: auto;
    }

    .toasts {
      position: fixed;
      left: 50%;
      bottom: 116px;
      transform: translateX(-50%);
      z-index: 80;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      pointer-events: none;
    }

    .toast {
      padding: 9px 16px;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: rgba(16, 22, 36, 0.96);
      color: var(--text);
      font-size: 12.5px;
      box-shadow: var(--shadow);
      animation: toast-in 0.22s var(--ease);
      max-width: 520px;
      text-align: center;
    }

    .toast.ok {
      border-color: rgba(53, 211, 154, 0.45);
    }

    .toast.bad {
      border-color: rgba(255, 77, 128, 0.5);
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="drawer" id="drawer">
    <div class="head">
      <span>播放列表</span>

  <div class="overlay" id="share-overlay">
    <div class="modal">
      <h3>分享歌单到后台</h3>
      <div class="sub">
        把「我的收藏」作为一个歌单合集提交到后台（`/api/v1/createsongmenu`）——
        提交后后台的「后台歌单」里就能看到它。带 <b>·</b> 的是必填。
      </div>
      <div class="field">
        <label>歌单标题 ·</label>
        <input id="sh-title" type="text" maxlength="40" placeholder="例如：深夜循环的那些歌">
      </div>

        <div class="field">
          <label>昵称 ·</label>
          <input id="sh-user" type="text" maxlength="20" placeholder="你的昵称">
        </div>

          <label>邮箱 ·</label>
          <input id="sh-email" type="text" maxlength="60" placeholder="you@example.com">
        </div>
      </div>
