<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ohos-capabilities</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #16161d;
         color: #e6e6e6; margin: 0; padding: 18px 16px 40px; }
  h1 { margin: 0 0 2px; font-size: 20px; color: #7ce7ff; }
  .sub { margin: 0 0 14px; font-size: 12px; color: #9aa0b4; }
  h2 { margin: 18px 0 8px; font-size: 14px; color: #8be9fd; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #2a2d3a; }
  th { color: #9aa0b4; font-weight: 500; }
  td.bit { font-family: ui-monospace, Consolas, monospace; }
  .pass { color: #50fa7b; }
  .fail { color: #ff6b81; }
  .warn { color: #ffd166; }
  pre { background: #1b1c24; border: 1px solid #2a2d3a; border-radius: 8px; padding: 10px;
        font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-all;
        margin: 0; max-height: 220px; overflow: auto; }
  .row { display: flex; gap: 8px; align-items: center; margin: 10px 0; font-size: 13px; }
  button { font-size: 13px; padding: 7px 12px; border-radius: 8px; border: 1px solid #33507a;
           background: #21324d; color: #cfe4ff; cursor: pointer; }
  button:hover { opacity: .85; }
  .foot { margin-top: 16px; font-size: 12px; color: #6b7186; line-height: 1.6; }
</style>
</head>
<body>
  <h1>鸿蒙宿主能力位探针</h1>
  <p class="sub">取值来自后端 <code>system:host</code>；每条断言同时写进设备 hilog（tag <b>CjProbe</b>）</p>

  <h2>能力位</h2>
  <table id="caps">
    <thead><tr><th>能力位</th><th>期望</th><th>实测</th><th>判定</th></tr></thead>
    <tbody><tr><td colspan="4" style="color:#9aa0b4">读取中…</td></tr></tbody>
  </table>

  <h2>版本与平台</h2>
  <table id="meta">
    <tbody><tr><td colspan="2" style="color:#9aa0b4">读取中…</td></tr></tbody>
  </table>

  <h2>菜单（应用侧 bindMenu）</h2>
  <div class="row">
    <span>点窗口上方的「菜单」按钮 → 选「打个招呼」，回投应出现在下面：</span>
  </div>
  <div class="row">
    <button id="toggleChecked">切换「侧边栏」勾选态</button>
    <span id="stateLine" style="color:#9aa0b4">（未调用）</span>
  </div>

  <h2>事件回执</h2>
  <pre id="log">（尚无事件）</pre>

  <p class="foot">
    判定口径：能力位「有」必须真机可观测（点得动、回投能到页面），代码里写了但设备上做不到的一律按 false 记；
    本轮 TRAY / DRAG_DROP / HOTKEY / SUBTITLE 如实记 false。
  </p>

  <script>
    // 注入的桥：document-start 注入，但仍可能晚于本脚本，轮询等它出现
    function withBridge(cb) {
      if (window.__CJ_TAURI__) { cb(window.__CJ_TAURI__); return; }
      setTimeout(function () { withBridge(cb); }, 50);
    }

    var lines = [];
    function logLine(text) {
      lines.push(text);
      var box = document.getElementById('log');
      box.textContent = lines.join('\n');
      box.scrollTop = box.scrollHeight;
    }

    withBridge(function (tauri) {
      // 页面断言 → 设备 hilog：鸿蒙上框架 stderr 不进 hilog，只有应用侧 Hilog 抓得到，
      // 所以走 probeLog 命令把每一行原样写进日志（tag CjProbe）。
      function report(text) {
        logLine(text);
        tauri.invoke('probeLog', { text: text }).catch(function (err) {
          logLine('probeLog FAIL: ' + err.message);
        });
      }

      // 本轮预期：只有 menu 该为 true，其余四项必须如实为 false
      var EXPECT = { menu: true, tray: false, dragDrop: false, hotkey: false, subtitle: false };
      var BITS = ['menu', 'tray', 'dragDrop', 'hotkey', 'subtitle'];

      function renderCaps(host) {
        var body = document.querySelector('#caps tbody');
        body.innerHTML = '';
        var okCount = 0;
        BITS.forEach(function (name) {
          var actual = !!host[name];
          var expect = EXPECT[name];
          var ok = actual === expect;
          if (ok) { okCount += 1; }
          var tr = document.createElement('tr');
          tr.innerHTML = '<td class="bit">' + name + '</td>'
            + '<td>' + expect + '</td>'
            + '<td>' + actual + '</td>'
            + '<td class="' + (ok ? 'pass' : 'fail') + '">' + (ok ? 'PASS' : 'FAIL') + '</td>';
          body.appendChild(tr);
          report((ok ? 'PASS ' : 'FAIL ') + 'cap ' + name + ' expect=' + expect + ' actual=' + actual);
        });
        report('caps ' + okCount + '/' + BITS.length + ' bits match expectation');

        var meta = document.querySelector('#meta tbody');
        meta.innerHTML = '';
        meta.innerHTML = '<tr><th>platform</th><td class="bit">' + host.platform + '</td></tr>'
          + '<tr><th>logFile</th><td class="bit">' + (host.logFile || '') + '</td></tr>';
        report('PASS platform ' + host.platform);
      }

      tauri.invoke('system:host').then(function (host) {
        renderCaps(host);
      }).catch(function (err) {
        report('FAIL system:host ' + err.message);
      });

      tauri.invoke('system:version').then(function (v) {
        var shown = (typeof v === 'object' && v !== null) ? JSON.stringify(v) : String(v);
        var meta = document.querySelector('#meta tbody');
        meta.innerHTML += '<tr><th>version</th><td class="bit">' + shown + '</td></tr>';
        report('PASS version ' + shown);
      }).catch(function (err) {
        report('FAIL system:version ' + err.message);
      });

      // 页面 → 宿主菜单状态（menu 插件命令 → setMenuItemState）：启动即自动跑一次，
      // 免得靠屏幕坐标点按钮，也能证明「勾选态由页面驱动」这条链通着。
      function probeSetChecked(checked) {
        if (!tauri.menu) {
          report('FAIL menu shim missing (menu 插件未注入)');
          return;
        }
        tauri.menu.setChecked({ id: 'view.sidebar', checked: checked })
          .then(function () {
            document.getElementById('stateLine').textContent = '侧边栏 = ' + checked;
            report('PASS menu setChecked view.sidebar=' + checked);
          })
          .catch(function (err) {
            document.getElementById('stateLine').textContent = '失败：' + err.message;
            report('FAIL menu setChecked ' + err.message);
          });
      }
      probeSetChecked(true);

      // 剪贴板（宿主 pasteboard）：写一个带时间戳的 token，再读回来逐字比对。
      //
      // **写与读在鸿蒙上的准入不同，这是平台事实、不是框架缺陷**（2026-10-24 真机取证）：
      // 写（`OH_Pasteboard_SetData`）不需要权限，必然成功；
      // 读（`OH_Pasteboard_GetData`）按头文件要求 `ohos.permission.READ_PASTEBOARD`，
      // 而该权限是 USER_GRANT + SYSTEM_BASIC——普通应用把它写进 module.json5 后**连装包都失败**
      // （`bm install` 回 `9568289 ... grant request permissions failed`），需要签名 profile 带 ACL。
      // 读被拒时平台回状态码 201（`ERR_PERMISSION_ERROR`，已用临时诊断实测），框架如实返回 null。
      // 所以这里把「null」判成 SKIP 而不是 FAIL：证据要能读出「写通、读被平台挡」这一事实，
      // 既不把平台门槛冒充成框架成功，也不把平台门槛记成框架回归。
      function probeClipboard() {
        if (!tauri.clipboard) {
          report('FAIL clipboard shim missing (clipboard 插件未注入)');
          return;
        }
        var token = 'cj-tauri-clip-' + Date.now();
        tauri.clipboard.writeText(token)
          .then(function () {
            report('PASS clipboard write ' + token);
            return tauri.clipboard.readText();
          })
          .then(function (text) {
            if (text === token) {
              report('PASS clipboard read round-trip ' + text);
            } else if (text === null || text === undefined) {
              report('SKIP clipboard read denied-by-platform (needs READ_PASTEBOARD; write verified)');
            } else {
              report('FAIL clipboard read round-trip expect=' + token + ' actual=' + text);
            }
          })
          .catch(function (err) {
            report('FAIL clipboard ' + err.message);
          });
      }
      probeClipboard();

      // http 插件（鸿蒙侧走系统网络栈 ohos.net.http）：四条核验点——
      // ① https GET 走 OS 的 TLS（仓颉运行时装不了 OpenSSL 3，stdx 的 https 必死）；
      // ② http GET（非 TLS 路径照旧）；
      // ③ POST 用 extraData 承载体（该字段在仓内无用法先例，本次真机要核的形状）；
      // ④ http:postStream 必须如实拒绝（系统栈一次回整包，没有增量块）。
      function probeHttp() {
        tauri.invoke('http:get', { url: 'https://www.baidu.com/' })
          .then(function (r) {
            report('PASS http https-get status=' + r.status + ' ctype=' + r.contentType
              + ' len=' + r.body.length + ' truncated=' + r.truncated);
          })
          .catch(function (err) { report('FAIL http https-get ' + err.message); });

        tauri.invoke('http:get', { url: 'http://www.baidu.com/' })
          .then(function (r) {
            report('PASS http plain-get status=' + r.status + ' len=' + r.body.length);
          })
          .catch(function (err) { report('FAIL http plain-get ' + err.message); });

        var body = JSON.stringify({ hello: 'cj-tauri', n: 42 });
        tauri.invoke('http:post', { url: 'https://httpbin.org/post', body: body })
          .then(function (r) {
            var echoed = r.body.indexOf('cj-tauri') >= 0;
            report((echoed ? 'PASS' : 'FAIL') + ' http post status=' + r.status
              + ' echoed=' + echoed + ' len=' + r.body.length);
          })
          .catch(function (err) { report('FAIL http post ' + err.message); });

        tauri.invoke('http:postStream', { url: 'https://httpbin.org/post', body: body })
          .then(function () {
            report('FAIL http postStream should have been rejected on HarmonyOS');
          })
          .catch(function (err) {
            report('PASS http postStream rejected: ' + err.message);
          });
      }
      probeHttp();

      // fs 探针：**独立逐步**——每条命令各自报 PASS/FAIL（带步骤名），不串在一条 promise 链里，
      // 避免上轮那种「第一步就被 scope 拒、两条拒绝 PASS 误读成链路成功」的歧义。
      function fsStep(label, cmd, args) {
        return tauri.invoke(cmd, args).then(
          function (r) { report('PASS fsC ' + label + ' ' + JSON.stringify(r)); return r; },
          function (e) { report('FAIL fsC ' + label + ' ' + e.message); return null; }
        );
      }
      function probeFs() {
        var A = '/data/storage/el1/base/haps/entry/files/probe-fs/hello.txt';
        // 诊断轮：两条候选路径各写一次，看哪条能过 scope（错误信息带口径）
        fsStep('write-rel', 'fs:writeText', { path: 'probe-fs/hello.txt', contents: 'cj-rel' });
        fsStep('write-abs', 'fs:writeText', { path: A, contents: 'cj-abs' });
        // 越界（allow 不命中）与 deny 命中（绝对路径形式）独立验
        fsStep('outside(expect-reject)', 'fs:readText', { path: '../etc/passwd' });
        fsStep('deny(expect-reject)', 'fs:writeText', { path: A.replace('hello.txt', 'secret.txt'), contents: 'x' });
      }
      // fs 诊断轮结论（2026-10-25 真机）：
      // cwd = 应用 el2 files 目录（/data/storage/el2/base/haps/entry/files），相对路径折叠到它；
      // scope 用 $CWD 前缀命中；writeText 不自动建父目录（先 mkdir）。
      // 诊断段已撤，正式轮只留主链与两条期望拒绝。
      function fsStepReject(label, cmd, args) {
        // 期望被拒的步骤：被拒记 PASS（判据含原因），没被拒反而记 FAIL
        return tauri.invoke(cmd, args).then(
          function () { report('FAIL fsR ' + label + ' should have been rejected'); },
          function (e) {
            if (e.message.indexOf('outside the authorized scope') >= 0) {
              report('PASS fsR ' + label + ' rejected');
            } else {
              report('FAIL fsR ' + label + ' wrong-reason: ' + e.message);
            }
          }
        );
      }

      // fs 正式轮：诊断轮已定口径（cwd = 应用 el2 files 目录，scope 用 $CWD 前缀命中；
      // writeText 不自动建父目录——先 mkdir 再写）。链式推进，每步独立报 PASS/FAIL，
      // 前一步失败就停在原地，后面的步骤不再跑。
      function fsRun(label, cmd, args, next) {
        return tauri.invoke(cmd, args).then(
          function (r) { report('PASS fsR ' + label + ' ' + JSON.stringify(r)); if (next) { next(); } },
          function (e) { report('FAIL fsR ' + label + ' ' + e.message); }
        );
      }
      function probeFsChain() {
        // mkdir 对已存在目标如实报错（命令面语义）——统一走 exists 幂等探测，保证重跑可复现
        fsMkdirIdem('mkdir', 'probe-fs', fsChainRest);
      }
      function fsMkdirIdem(label, path, next) {
        tauri.invoke('fs:exists', { path: path }).then(
          function (ex) {
            if (ex) {
              report('PASS fsR ' + label + ' (already exists, skipped)');
              next();
            } else {
              fsRun(label, 'fs:mkdir', { path: path, recursive: true }, next);
            }
          },
          function (e) { report('FAIL fsR ' + label + '-exists ' + e.message); }
        );
      }
      function fsChainRest() {
        fsRun('write', 'fs:writeText', { path: 'probe-fs/hello.txt', contents: 'cj-fs-' + Date.now() }, function () {
            fsRun('read', 'fs:readText', { path: 'probe-fs/hello.txt' }, function (r) {
              report('PASS fsR read-back ' + r);
              fsRun('stat', 'fs:stat', { path: 'probe-fs/hello.txt' }, function () {
                fsMkdirIdem('mkdir-sub', 'probe-fs/sub', function () {
                  fsRun('copy', 'fs:copy', { path: 'probe-fs/hello.txt', newPath: 'probe-fs/sub/copy.txt', overwrite: true }, function () {
                    fsRun('rename', 'fs:rename', { path: 'probe-fs/sub/copy.txt', newPath: 'probe-fs/sub/renamed.txt' }, function () {
                      fsRun('list', 'fs:list', { path: 'probe-fs/sub' }, function (ls) {
                        var names = (ls || []).map(function (e) { return e.name; }).join(',');
                        report('PASS fsR list-entries ' + names);
                        fsRun('remove', 'fs:remove', { path: 'probe-fs/sub/renamed.txt' }, function () {
                          // fs:remove 只删文件、拒绝目录是命令面语义（与桌面一致）——记 SKIP 不算失败
                          report('SKIP fsR cleanup-dir (fs:remove is file-only by contract)');
                        });
                      });
                    });
                  });
                });
              });
            });
          });
          // 越界与 deny 独立验（相对路径）：../etc/passwd 不命中 allow；
        // deny 的判读依据是对照——同形态 hello.txt 写成功而 secret 前缀被拒，才证明 deny 生效
        fsStepReject('outside-scope', 'fs:readText', { path: '../etc/passwd' });
        fsStepReject('deny-path', 'fs:writeText', { path: 'probe-fs/secret.txt', contents: 'x' });
      }
      probeFsChain();

      // mqtt 插件：对端是 PC 上的本仓 mock broker，经 `hdc rport tcp:18830 tcp:18830`
      // 反向转发——设备连自己的 127.0.0.1:18830，hdc 把它转发到 PC 的 broker
      // （公网明文 broker 1883 已实测被网络拦：connect timeout）。自收回环对账。
      function probeMqtt() {
        var topic = 'cj-tauri-probe-' + Date.now();
        var got = 0;
        tauri.listen('mqtt:message', function (p) {
          got += 1;
          report('PASS mqtt message topic=' + p.topic + ' payload=' + JSON.stringify(p.text || p.payload || p));
        });
        tauri.mqtt.connect({ host: '127.0.0.1', port: 18830, clientId: 'cj-probe-' + Date.now() })
          .then(function (c) {
            report('PASS mqtt connect ' + JSON.stringify(c));
            return tauri.mqtt.subscribe({ filter: topic, qos: 1 });
          })
          .then(function (s) {
            report('PASS mqtt subscribe ' + JSON.stringify(s));
            return tauri.mqtt.publish({ topic: topic, qos: 1, text: 'cj-mqtt-' + Date.now() });
          })
          .then(function (pub) {
            report('PASS mqtt publish ' + JSON.stringify(pub));
            // 回推是异步的：4 秒后用 recent 对账（事件先到就不依赖这条）
            setTimeout(function () {
              tauri.mqtt.recent({ limit: 10 }).then(function (r) {
                report('PASS mqtt recent buffered=' + r.buffered + ' items=' + JSON.stringify((r.items || []).map(function (x) { return x.topic; })));
                return tauri.mqtt.status();
              }).then(function (st) {
                report('PASS mqtt status ' + JSON.stringify(st));
                return tauri.mqtt.disconnect();
              }).then(function (d) {
                report((got > 0 ? 'PASS' : 'FAIL') + ' mqtt round-trip got=' + got);
                report('PASS mqtt disconnect ' + JSON.stringify(d));
              }).catch(function (e2) { report('FAIL mqtt tail ' + e2.message); });
            }, 4000);
          })
          .catch(function (err) { report('FAIL mqtt ' + err.message); });
      }
      probeMqtt();

      // redis 插件：对端是 PC 上的本仓 mock-redis，经 `hdc rport tcp:6380 tcp:6379`
      // 反向转发——设备连自己的 127.0.0.1:6380。最小闭环：connect → SET → GET 对账 → status → disconnect。
      function probeRedis() {
        var key = 'probe-' + Date.now();
        var token = 'cj-redis-' + Date.now();
        tauri.redis.connect({ host: '127.0.0.1', port: 6380 })
          .then(function (c) {
            report('PASS redis connect ' + JSON.stringify(c));
            return tauri.redis.valueWrite({ key: key, type: 'string', op: 'set', value: token });
          })
          .then(function (w) {
            report('PASS redis set ' + JSON.stringify(w));
            return tauri.redis.value({ key: key });
          })
          .then(function (v) {
            // value 命令的 value 字段是展示对象 {bytes, truncated, text, hex}（redisValueDisplay）
            var text = (v && v.value && v.value.text !== undefined) ? v.value.text : JSON.stringify(v);
            report((text === token ? 'PASS' : 'FAIL') + ' redis get round-trip expect=' + token + ' actual=' + text);
            return tauri.redis.status();
          })
          .then(function (st) {
            report('PASS redis status ' + JSON.stringify(st));
            return tauri.redis.disconnect();
          })
          .then(function (d) {
            report('PASS redis disconnect ' + JSON.stringify(d));
          })
          .catch(function (err) { report('FAIL redis ' + err.message); });
      }
      probeRedis();

      // ws 插件：**鸿蒙侧如实降级**——stdx WebSocket 依赖 OpenSSL（RAND_bytes），设备上装不了，
      // SDK 也没有 ohos.net.websocket 绑定（真机 connect 实测死于 RAND_bytes 后落降级分支）。
      // 本段核验的是「降级契约」：connect 当场拒绝且原因可读；scope 越界同样当场拒。
      function wsStep(label, cmd, args) {
        return tauri.invoke(cmd, args).then(
          function (r) { report('PASS ws ' + label + ' ' + JSON.stringify(r)); return r; },
          function (e) { report('FAIL ws ' + label + ' ' + e.message); return null; }
        );
      }
      function probeWs() {
        tauri.invoke('ws:connect', { url: 'ws://127.0.0.1:8765/' })
          .then(function (c) {
            report('FAIL ws degraded-connect should have been rejected on HarmonyOS');
            return null;
          })
          .catch(function (e) {
            if (e.message.indexOf('not available on HarmonyOS') >= 0) {
              report('PASS ws degraded-connect rejected: ' + e.message);
            } else {
              report('FAIL ws degraded-connect wrong-reason: ' + e.message);
            }
            return null;
          });
        // 越界：scopes.ws 没放行的主机期望当场拒
        tauri.invoke('ws:connect', { url: 'ws://example.com:80/' })
          .then(function () { report('FAIL ws outside-scope should have been rejected'); })
          .catch(function (e2) {
            if (e2.message.indexOf('outside the authorized scope') >= 0) {
              report('PASS ws outside-scope rejected');
            } else {
              report('FAIL ws outside-scope wrong-reason: ' + e2.message);
            }
          });
      }
      probeWs();

      // log 插件：鸿蒙降级契约——log:path 回空串（没开）、log:write 返 false（不伪装成功）
      function probeLogPlugin() {
        tauri.invoke('log:path')
          .then(function (p) {
            report((p === '' ? 'PASS' : 'FAIL') + ' log path empty=' + JSON.stringify(p));
            return tauri.invoke('log:write', { line: 'probe-' + Date.now() });
          })
          .then(function (w) {
            report((w === false ? 'PASS' : 'FAIL') + ' log write-degraded=' + JSON.stringify(w));
          })
          .catch(function (err) { report('FAIL log ' + err.message); });
      }
      probeLogPlugin();

      // sqlite 插件：FFI 直连随包 libsqlite3.so（设备/NDK 都无系统 sqlite，amalgamation 编出）。
      // 最小闭环：info → exec 建表插行 → query 回读对账 → 越界 path 被拒。
      function probeSqlite() {
        var dbPath = 'probe-' + Date.now() + '.db';
        // exec 用读写连接（不存在的库会建出）；info/tables/query 用只读连接——
        // 只读 + 不存在 = 打开失败（框架设计：不顺手造空库），所以必须先 exec 再查
        tauri.invoke('sqlite:exec', { path: dbPath,
            sql: 'CREATE TABLE t(id INTEGER PRIMARY KEY, note TEXT); INSERT INTO t(note) VALUES (' + "'cj-sqlite'" + ')' })
          .then(function (e) {
            report('PASS sqlite exec ' + JSON.stringify(e));
            return tauri.invoke('sqlite:query', { path: dbPath, sql: 'SELECT id, note FROM t ORDER BY id' });
          })
          .then(function (q) {
            // rows 的每格是 {type, value} 对象（sqliteReadCell），取 [1].value 对账
            var ok = q && q.rows && q.rows.length === 1 && q.rows[0][1].value === 'cj-sqlite';
            report((ok ? 'PASS' : 'FAIL') + ' sqlite query round-trip ' + JSON.stringify(q));
            return tauri.invoke('sqlite:info', { path: dbPath });
          })
          .then(function (i) {
            report('PASS sqlite info ' + JSON.stringify(i));
            return tauri.invoke('sqlite:tables', { path: dbPath });
          })
          .then(function (t) {
            report('PASS sqlite tables ' + JSON.stringify(t));
          })
          .catch(function (err) { report('FAIL sqlite ' + err.message); });
        // 越界：scopes.sqlite 之外的路径期望被拒
        tauri.invoke('sqlite:info', { path: '../etc/probe-external.db' })
          .then(function () { report('FAIL sqlite outside-scope should have been rejected'); })
          .catch(function (e2) {
            if (e2.message.indexOf('outside the authorized scope') >= 0) {
              report('PASS sqlite outside-scope rejected');
            } else {
              report('FAIL sqlite outside-scope wrong-reason: ' + e2.message);
            }
          });
      }
      probeSqlite();

      // 原生菜单 → 页面：宿主把 shell 报文回投成 menu:click 事件
      tauri.listen('menu:click', function (payload) {
        report('PASS menu click id=' + payload.id
          + ' enabled=' + payload.enabled + ' checked=' + payload.checked);
      });

      tauri.listen('tick', function (payload) {
        logLine('tick #' + payload.n);
      });

      // 页面 → 原生菜单：勾选态改动（走 menu 插件，验证宿主侧状态回写）
      var checked = true;
      document.getElementById('toggleChecked').onclick = function () {
        if (!tauri.menu) {
          document.getElementById('stateLine').textContent = '未注入 menu 插件 shim';
          report('FAIL menu shim missing');
          return;
        }
        checked = !checked;
        tauri.menu.setChecked({ id: 'view.sidebar', checked: checked })
          .then(function () {
            document.getElementById('stateLine').textContent = '侧边栏 = ' + checked;
            report('PASS menu setChecked view.sidebar=' + checked);
          })
          .catch(function (err) {
            document.getElementById('stateLine').textContent = '失败：' + err.message;
            report('FAIL menu setChecked ' + err.message);
          });
      };
    });
  </script>
</body>
</html>
