[package]
  cjc-version = "1.0.5"
  name = "sqlite_browser"
  description = "cj-tauri 示例：SQLite 浏览器（FFI 直连系统 sqlite3，表浏览 + SQL 调试台，零 Node）"
  version = "0.1.0"
  target-dir = ""
  output-type = "executable"
  compile-option = ""
  override-compile-option = ""
  link-option = ""
  package-configuration = {}

[dependencies]
  cjTauri = { path = "../.." }

# -lsqlite3 是本示例自己加的：框架的 sqlite 插件用 `foreign func` 直连**系统** sqlite3
# （不走 C 桥，理由见 docs/设计决策记录.md D-018 第 2 条），链接期由消费方提供这个库。
[target.x86_64-unknown-linux-gnu]
  link-option = "-L../../native -lcjtbridge -lwebkit2gtk-4.1 -lgtk-3 -lgdk-3 -lglib-2.0 -lgio-2.0 -lsoup-3.0 -ljavascriptcoregtk-4.1 -lgobject-2.0 -lsqlite3"

[target.x86_64-unknown-linux-gnu.bin-dependencies]
    path-option = ["${CANGJIE_STDX}"]

# Windows 侧**未落地**（D-018 第 8 条）：这条 link-option 能让桥与子系统对上，但 sqlite3 得自带 DLL，
# 本轮没有验证过，别把它当成「Windows 也能跑」的证据。
[target.x86_64-w64-mingw32]
  link-option = "-L../../native -lcjtbridge --subsystem=windows"

[target.x86_64-w64-mingw32.bin-dependencies]
    path-option = ["${CANGJIE_STDX}"]
