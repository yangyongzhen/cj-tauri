<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小学英语打字练习 · cj-tauri</title>
<!--
  小学英语打字练习（cj-tauri 示例页面）

  玩法一句话：屏幕中央一个英文单词，照着敲字母；**这个词一打完，它的中文意思就从上方浮下来
  停几秒**，于是「打字练习」顺带成了「背单词」。连续打词时中文不是互相盖掉，而是排队
  **依次展示**（见下面的 popQueue）。

  实现取舍：
    · 零第三方库。全部用一个文件的 HTML + CSS + JS 做成——这个示例的反馈都发生在 DOM 层
      （浮窗、进度、结算），不需要 3D，也就不需要 three.js 与 addInitScript 注入通道；
    · 素材与成绩都在仓颉侧（`src/words.cj` / `src/commands.cj`），页面只经 invoke 取用，
      两处不会漂移；页面自己只保留「这一轮打到哪」这类一次性的运行状态；
    · 按键一律走真实的 keydown（自检也用 dispatchEvent 打真实按键），不另开一条测试专用输入路径。
-->
<style>
/* ============================================================================
 * 一、设计变量与基础布局
 *
 * 配色偏「练习本 + 荧光笔」：米白纸底、深墨字、草绿为对、珊瑚红为错。
 * 字号刻意做大——这个示例的使用者是小学低年级，视距比成人远。
 * ========================================================================== */
:root {
  --paper: #fbf7ef;
  --paper-2: #fffdf8;
  --ink: #2b2925;
  --ink-soft: #6b655c;
  --ink-dim: #a8a19a;
  --ok: #2f9e6b;
  --ok-soft: #e6f6ed;
  --bad: #e0554c;
  --bad-soft: #fdecea;
  --accent: #f0a93b;
  --accent-2: #7f6ad8;
  --line: #e6e0d5;
  --shadow: 0 10px 30px rgba(64, 54, 38, 0.10);
  --shadow-lg: 0 18px 48px rgba(64, 54, 38, 0.16);
  --radius: 18px;
  --z: 1;               /* 整页缩放系数：探测后由 JS 赋值（1 = 不缩放） */
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* 整页等比缩放：视口单位不跟着 zoom 走，所以按 1/--z 反向补偿（AGENTS §4 的坑）。
   默认 --z: 1，探测不通过就保持 1——宁可「不缩放」，也不要布局塌一截。 */
body {
  zoom: var(--z);
  height: calc(100vh / var(--z, 1));
  width: calc(100vw / var(--z, 1));
}

/* 纸面纹理：极轻的横向细纹，让大块米白不至于死板 */
#stage {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  background:
    repeating-linear-gradient(180deg, rgba(0,0,0,0.014) 0 1px, transparent 1px 26px),
    radial-gradient(1100px 620px at 50% -12%, #fffdf6 0%, var(--paper) 62%);
}

/* ============================================================================
 * 二、顶栏 HUD
 * ========================================================================== */
#hud {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 22px 10px;
  border-bottom: 1px solid var(--line);
  min-width: 0;
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-width: 0;
  flex: 0 0 auto;
}
.brand__title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.4px;
  white-space: nowrap;
}
.brand__lesson {
  font-size: 13px;
  color: var(--ink-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 34vw;
}
.brand__lesson b { color: var(--ink); }

/* 统计胶囊：数值等宽，避免每打一个字母整行左右抖动 */
.stats {
  display: flex;
  gap: 8px;
  margin-left: auto;
  flex: 0 0 auto;
}
.stat {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 5px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--paper-2);
  font-size: 12px;
  color: var(--ink-soft);
  white-space: nowrap;
}
.stat b {
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.stat.is-hot b { color: var(--accent-2); }
.stat.is-bad b { color: var(--bad); }

.btn {
  font: inherit;
  font-size: 13px;
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--paper-2);
  color: var(--ink);
  cursor: pointer;
  white-space: nowrap;
  transition: transform .12s ease, background .12s ease, border-color .12s ease;
}
.btn:hover { background: #fff; border-color: #d9d1c2; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn--primary {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}
.btn--primary:hover { background: #403c35; border-color: #403c35; }

/* 进度条：按「已打对字母 / 本课总字母」走，比按词数更细、更有推进感 */
#bar {
  flex: 0 0 auto;
  height: 4px;
  background: #efe9de;
}
#bar > i {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--ok) 0%, #6cc79b 100%);
  transition: width .22s ease;
}

/* ============================================================================
 * 三、中文释义浮窗层（这个示例的主角）
 *
 * 位置固定在页面上方居中，不参与打字区布局——它只是「浮」在上面，
 * 出现与消失都不推动下面的单词跳位（打词时画面一跳，眼睛就得重新找锚点）。
 * pointer-events: none 是必须的：浮窗盖在单词上方，能点就会挡住键盘焦点。
 * ========================================================================== */
#popLayer {
  position: absolute;
  top: 74px;
  left: 0;
  right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
  z-index: 40;
}

/* 一张释义卡：单词 + 音标 + 词性 + **大号中文**
   中文是整个玩法的落点，字号比英文大一档——小朋友看的是它。 */
.pop {
  display: flex;
  align-items: center;
  gap: 14px;
  max-width: min(720px, 86vw);
  padding: 12px 26px 13px;
  border-radius: 16px;
  background: #fff;
  border: 1px solid #efe7d8;
  box-shadow: var(--shadow-lg);
  transform-origin: 50% 0%;
  animation: popIn .34s cubic-bezier(.18, .9, .3, 1.15) both;
}
.pop.is-out { animation: popOut .30s ease both; }

.pop__en {
  font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: .4px;
  color: var(--ink);
}
.pop__ipa {
  font-size: 13px;
  color: var(--ink-dim);
  white-space: nowrap;
}
.pop__pos {
  font-size: 12px;
  color: var(--accent-2);
  border: 1px solid #e6e1f7;
  background: #f6f3ff;
  border-radius: 6px;
  padding: 1px 6px;
  white-space: nowrap;
}
/* 分隔点：让「英文 → 中文」的对应关系一眼可见 */
.pop__sep {
  width: 1px;
  height: 30px;
  background: var(--line);
}
.pop__zh {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 2px;
  color: var(--ok);
  white-space: nowrap;
}
/* 队列提示：还有几条释义在排队（手快时小朋友知道自己没漏掉） */
.pop__more {
  align-self: center;
  font-size: 12px;
  color: var(--ink-soft);
  background: rgba(255, 255, 255, .82);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 10px;
}

@keyframes popIn {
  from { opacity: 0; transform: translateY(-22px) scale(.94); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes popOut {
  from { opacity: 1; transform: translateY(0) scale(1); }
  to   { opacity: 0; transform: translateY(-14px) scale(.97); }
}

/* ============================================================================
 * 四、打字区
 *
 * 三段纵向排布：音标（细）→ 单词（大）→ 下一个键的提示（小）。
 * 单词用**逐字母 span**，这样「打对的绿、当前这颗带光标、没打到的浅」能分开画出来，
 * 小朋友一眼知道自己在词里的哪一格。
 * ========================================================================== */
#play {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 24px 4px;
  text-align: center;
}

.ipa {
  font-size: 17px;
  letter-spacing: 1px;
  color: var(--ink-dim);
  min-height: 24px;
}

/* 单词：字号用 clamp 跟着视口走，长词（elephant / homework）也不会溢出 */
.word {
  font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  font-size: clamp(44px, 9.2vw, 104px);
  line-height: 1.14;
  letter-spacing: clamp(2px, .5vw, 7px);
  font-weight: 600;
  display: flex;
  align-items: baseline;
  justify-content: center;
  flex-wrap: nowrap;
  transition: transform .1s ease;
}
.word.shake { animation: shake .22s ease; }

/* 三种字母状态：打对 / 当前待打 / 还没轮到 */
.word__ch { color: var(--ink-dim); transition: color .1s ease, transform .1s ease; }
.word__ch.ok { color: var(--ok); }
.word__ch.cur {
  color: var(--ink);
  position: relative;
}
/* 当前字母下面挂一根荧光笔式的下划条：比闪烁的光标安静，但指向明确 */
.word__ch.cur::after {
  content: "";
  position: absolute;
  left: 4%;
  right: 4%;
  bottom: -.06em;
  height: .075em;
  border-radius: 999px;
  background: var(--accent);
  animation: cursorPulse 1.05s ease-in-out infinite;
}
.word__ch.cur.wrong { color: var(--bad); }
.word__ch.cur.wrong::after { background: var(--bad); }

@keyframes cursorPulse {
  0%, 100% { opacity: .35; }
  50%      { opacity: 1; }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%      { transform: translateX(-9px); }
  45%      { transform: translateX(8px); }
  70%      { transform: translateX(-5px); }
}

/* 下一个键：把待敲的字母单独提出来放大，给「手该放哪」一个明确落点 */
.hintline {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 13px;
  color: var(--ink-soft);
  min-height: 40px;
}
.hintline kbd {
  font-family: inherit;
  font-size: 19px;
  font-weight: 700;
  min-width: 34px;
  padding: 3px 9px;
  border-radius: 8px;
  border: 1px solid #ded6c6;
  border-bottom-width: 3px;
  background: var(--paper-2);
  color: var(--ink);
}

/* 本课词进度点：打过的是实心绿，当前这颗描边，其余空心 */
.dots {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  margin-top: 10px;
  max-width: min(760px, 88vw);
}
.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1.5px solid #d8cfbe;
  background: transparent;
}
.dot.ok { background: var(--ok); border-color: var(--ok); }
.dot.cur { border-color: var(--accent); background: #fdf0d8; transform: scale(1.25); }

/* ============================================================================
 * 五、页脚：本课已经打过的词（带中文）+ 快捷键说明
 *
 * 浮窗是会走的（停留几秒），所以下面留一条**不走的清单**：
 * 打完的词在这里按顺序排开，回头还能扫一眼「这一课我都学到了什么」。
 * ========================================================================== */
#foot {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 22px 14px;
  border-top: 1px solid var(--line);
  min-width: 0;
}
#learned {
  display: flex;
  gap: 7px;
  overflow: hidden;
  flex: 1 1 auto;
  min-width: 0;
  flex-wrap: nowrap;
}
.chip {
  flex: 0 0 auto;
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--ok-soft);
  border: 1px solid #cfeadd;
  font-size: 12px;
  color: #257a53;
  animation: chipIn .28s ease both;
}
.chip b { font-weight: 700; }
.chip i { font-style: normal; color: var(--ink-soft); font-size: 11px; }
@keyframes chipIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.keys {
  flex: 0 0 auto;
  font-size: 11.5px;
  color: var(--ink-dim);
  white-space: nowrap;
}

/* ============================================================================
 * 六、浮层：选课面板 / 结算 / 提示条
 * ========================================================================== */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px;
  background: rgba(251, 247, 239, .93);
  backdrop-filter: blur(3px);
  animation: fadeIn .18s ease both;
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
.hidden { display: none !important; }

.panel {
  width: min(1020px, 94vw);
  max-height: 100%;
  overflow: auto;
  background: var(--paper-2);
  border: 1px solid var(--line);
  border-radius: 22px;
  box-shadow: var(--shadow-lg);
  padding: 26px 28px 28px;
}
.panel h2 {
  margin: 0 0 4px;
  font-size: 21px;
  letter-spacing: .5px;
}
.panel p.sub {
  margin: 0 0 18px;
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.7;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
  gap: 14px;
}
.card {
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: #fff;
  padding: 15px 16px 14px;
  cursor: pointer;
  font: inherit;
  color: inherit;
  transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow);
  border-color: #d5cbb8;
}
.card__title {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 3px;
}
.card__sub {
  font-size: 12px;
  color: var(--ink-dim);
  letter-spacing: .3px;
  margin-bottom: 10px;
}
.card__meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--ink-soft);
  flex-wrap: wrap;
}
.stars { color: var(--accent); letter-spacing: 2px; font-size: 14px; }
.stars i { font-style: normal; color: #e3dccd; }
.card__best {
  font-size: 11.5px;
  color: var(--ok);
  margin-top: 7px;
}
.card__best.none { color: var(--ink-dim); }

/* 结算面板：星级最大，数字次之——成绩单的第一眼应该是「我今天几星」 */
.settle {
  text-align: center;
  max-width: 560px;
}
.settle .big-stars {
  font-size: 54px;
  letter-spacing: 10px;
  color: var(--accent);
  margin: 6px 0 2px;
}
.settle .big-stars i { font-style: normal; color: #e6dfd0; }
.settle .headline {
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 16px;
}
.settle .grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 4px 0 18px;
}
.settle .cell {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 11px 8px 12px;
  background: #fff;
}
.settle .cell b {
  display: block;
  font-size: 23px;
  font-variant-numeric: tabular-nums;
}
.settle .cell span {
  font-size: 11.5px;
  color: var(--ink-soft);
}
.settle .row {
  display: flex;
  gap: 10px;
  justify-content: center;
}
.settle .words-review {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  justify-content: center;
  margin-bottom: 18px;
  max-height: 118px;
  overflow: auto;
}

/* 顶部提示条：桥还没起来 / 出错时用，正常游玩时是隐藏的 */
#banner {
  position: absolute;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  z-index: 80;
  max-width: 88vw;
  padding: 10px 18px;
  border-radius: 12px;
  background: #33302b;
  color: #fdf9f1;
  font-size: 13px;
  box-shadow: var(--shadow);
}
#banner.warn { background: var(--bad); }
</style>
</head>
<body>
<div id="stage">
  <div id="hud">
    <div class="brand">
      <span class="brand__title">小学英语打字练习</span>
      <span class="brand__lesson" id="lessonLabel">正在载入词库…</span>
    </div>
    <div class="stats">
      <div class="stat" id="statWords"><b>0</b><span>词</span></div>
      <div class="stat is-hot" id="statCombo"><b>0</b><span>连击</span></div>
      <div class="stat" id="statAcc"><b>100%</b><span>正确</span></div>
      <div class="stat" id="statSpeed"><b>0</b><span>词/分</span></div>
    </div>
    <button class="btn" id="btnPick" type="button">换一课 (Esc)</button>
    <button class="btn" id="btnQuit" type="button">退出</button>
  </div>
  <div id="bar"><i id="barFill"></i></div>

  <!-- 中文释义浮窗层：由 popQueue 往这里插入卡片，一次只展示一张 -->
  <div id="popLayer"></div>

  <main id="play">
    <div class="ipa" id="ipa"></div>
    <div class="word" id="word"></div>
    <div class="hintline" id="hintline"></div>
    <div class="dots" id="dots"></div>
  </main>

  <footer id="foot">
    <div id="learned"></div>
    <div class="keys">回车：重打本课　Esc：换课</div>
  </footer>
</div>

<div id="picker" class="overlay hidden">
  <div class="panel">
    <h2>挑一课开始</h2>
    <p class="sub">照着屏幕上的单词敲字母，<b>打完一个词，它的中文意思就会从上边浮下来停几秒</b>——
      连着打就一条一条排队展示。打错的字母不扣分，只算进正确率。</p>
    <div class="cards" id="cards"></div>
  </div>
</div>

<div id="settle" class="overlay hidden">
  <div class="panel settle">
    <div class="headline" id="settleHeadline">这一课打完啦</div>
    <div class="big-stars" id="settleStars"></div>
    <div class="grid">
      <div class="cell"><b id="settleWords">0</b><span>个词</span></div>
      <div class="cell"><b id="settleAcc">100%</b><span>正确率</span></div>
      <div class="cell"><b id="settleSpeed">0</b><span>词/分</span></div>
    </div>
    <div class="words-review" id="settleReview"></div>
    <div class="row">
      <button class="btn btn--primary" id="btnAgain" type="button">再打一遍 (Enter)</button>
      <button class="btn" id="btnNext" type="button">换一课 (Esc)</button>
    </div>
  </div>
</div>

<div id="banner">正在连接仓颉侧…</div>

<script>
/* ============================================================================
 * 一、小工具
 * ========================================================================== */
function $(id) { return document.getElementById(id); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function clamp(n, lo, hi) { return n < lo ? lo : (n > hi ? hi : n); }

/** 提示条：正常游玩时隐藏（它只用来报「桥没起来」「初始化失败」这类真问题） */
var bannerTimer = 0;
function banner(text, warn) {
  var el = $('banner');
  el.textContent = text;
  el.classList.remove('hidden');
  el.classList.toggle('warn', !!warn);
  if (bannerTimer) { clearTimeout(bannerTimer); }
  var keep = (text === '正在连接仓颉侧…');
  if (!keep) {
    bannerTimer = setTimeout(function () { el.classList.add('hidden'); }, 6000);
  }
}
function hideBanner() { $('banner').classList.add('hidden'); }

/* ============================================================================
 * 二、仓颉侧桥
 *
 * 模块作用域里**不能**直接读 window.__CJ_TAURI__：Linux 宿主在 document-start 注入脚本，
 * 但页面自己的模块/普通脚本先于它跑完也是可能的（模板里统一用 waitForBridge 就是这个原因）。
 * 这里轮询等它出现，超时才报错——不让「桥还没到」被误读成「命令没实现」。
 * ========================================================================== */
var bridge = null;
function waitForBridge(cb) {
  var tries = 0;
  (function poll() {
    if (window.__CJ_TAURI__ && window.__CJ_TAURI__.invoke) {
      bridge = window.__CJ_TAURI__;
      cb();
      return;
    }
    tries += 1;
    if (tries > 240) {          // 约 12 秒
      banner('等不到 cj-tauri 桥（window.__CJ_TAURI__）：页面与宿主没接上', true);
      return;
    }
    setTimeout(poll, 50);
  })();
}
function invoke(cmd, args) {
  if (!bridge) { return Promise.reject(new Error('桥还没就绪')); }
  return bridge.invoke(cmd, args || {});
}

/* ============================================================================
 * 三、运行时状态
 *
 * 只放「这一轮打到哪」这类一次性状态：题库、音标、中文释义、成绩全部来自仓颉侧
 * （`word:list` / `score:save`），页面不再存第二份，避免两处漂移。
 * ========================================================================== */
var state = {
  cfg: {},
  lessons: [],
  records: {},
  lesson: null,
  index: 0,
  typed: '',
  correct: 0,
  errors: 0,
  combo: 0,
  bestCombo: 0,
  startedAt: 0,
  finished: false,
  mute: false,
  popMs: 2600,          // 一条中文释义的停留时长（宿主可经 CJ_TYPING_POP_MS 调）
  popQueue: [],         // 待展示的释义（连续打词时排队）
  popShowing: false,
  popEl: null,          // 当前挂在浮窗层上的那张卡（自检要断言「一次只一张」）
  popShown: 0,          // 累计展示过几条（自检断言条数）
  popOrder: [],         // 实际展示顺序（自检断言「依次展示」）
  popTimer: 0,
  lastPopLivedMs: 0,    // 最近一张卡从出现到消失的存活时长（自检断言「停留了几秒」）
  lastResult: null,
  lastSave: null,
  learned: []           // 本课打完的词，页脚与结算都从这里取
};

/* ============================================================================
 * 四、音效（WebAudio，零音频资源）
 *
 * 一句题外话写在这里，免得后来者以为是噪音：音高随连击上行，是这一版最便宜的
 * 「手感」来源——不需要任何素材，打顺了自然变好听。自检时 state.mute 打开，
 * 不建 AudioContext（无头环境里它可能是被禁的）。
 * ========================================================================== */
var audioCtx = null;
function tone(freq, ms, type, gain) {
  if (state.mute) { return; }
  try {
    if (!audioCtx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) { return; }
      audioCtx = new Ctx();
    }
    var t = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain || 0.05, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + ms / 1000 + 0.02);
  } catch (e) { /* 没声卡 / 被策略拦：静音是第一优先，不因此报错 */ }
}
function soundKey(combo) { tone(520 + clamp(combo, 0, 12) * 38, 60, 'sine', 0.035); }
function soundErr() { tone(150, 130, 'triangle', 0.05); }
function soundWord() { tone(740, 90, 'sine', 0.06); setTimeout(function () { tone(980, 120, 'sine', 0.05); }, 80); }
function soundDone() {
  var notes = [660, 790, 990, 1180], i = 0;
  var t = setInterval(function () {
    tone(notes[i], 150, 'sine', 0.05);
    i += 1;
    if (i >= notes.length) { clearInterval(t); }
  }, 110);
}

/* ============================================================================
 * 五、选课面板
 * ========================================================================== */
function starsHtml(n) {
  var s = '';
  for (var i = 0; i < 3; i++) { s += i < n ? '★' : '<i>★</i>'; }
  return '<span class="stars">' + s + '</span>';
}

function renderPicker() {
  var box = $('cards');
  box.innerHTML = '';
  for (var i = 0; i < state.lessons.length; i++) {
    var ls = state.lessons[i];
    var rec = state.records[ls.id] || null;
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'card';
    btn.dataset.lesson = ls.id;
    var best = '';
    if (rec) {
      best = '<div class="card__best">我的纪录：' + rec.bestStars + '★ · ' +
        rec.bestWpm + ' 词/分 · 正确 ' + rec.bestAccuracy + '%（第 ' + rec.attempts + ' 次挑战）</div>';
    } else {
      best = '<div class="card__best none">还没打过这一课</div>';
    }
    btn.innerHTML =
      '<div class="card__title">' + ls.title + '</div>' +
      '<div class="card__sub">' + ls.subtitle + '</div>' +
      '<div class="card__meta">' + starsHtml(ls.stars) +
        '<span>' + ls.count + ' 个词</span><span>' + ls.letters + ' 个字母</span></div>' +
      best;
    btn.addEventListener('click', function (ev) {
      var id = ev.currentTarget.dataset.lesson;
      for (var k = 0; k < state.lessons.length; k++) {
        if (state.lessons[k].id === id) { startLesson(state.lessons[k]); return; }
      }
    });
    box.appendChild(btn);
  }
}

function showPicker() {
  $('settle').classList.add('hidden');
  $('picker').classList.remove('hidden');
  clearPopQueue();
}
function hidePicker() { $('picker').classList.add('hidden'); }

/* ============================================================================
 * 六、开一课 / 重打
 * ========================================================================== */
function startLesson(lesson) {
  state.lesson = lesson;
  state.index = 0;
  state.typed = '';
  state.correct = 0;
  state.errors = 0;
  state.combo = 0;
  state.bestCombo = 0;
  state.finished = false;
  state.startedAt = 0;
  state.learned = [];
  state.popShown = 0;
  state.popOrder = [];
  state.lastPopLivedMs = 0;
  state.lastResult = null;
  state.lastSave = null;
  clearPopQueue();
  $('learned').innerHTML = '';
  $('settle').classList.add('hidden');
  hidePicker();
  $('lessonLabel').innerHTML = '<b>' + lesson.title + '</b>　' + lesson.subtitle;
  renderWord();
  updateHud();
  updateBar();
}

function restartCurrent() {
  if (state.lesson) { startLesson(state.lesson); }
  else { showPicker(); }
}

function currentWord() {
  if (!state.lesson) { return null; }
  return state.lesson.words[state.index] || null;
}

/* ============================================================================
 * 七、打字区渲染
 * ========================================================================== */
function renderWord() {
  var w = currentWord();
  if (!w) { return; }
  $('ipa').textContent = w.ipa;
  var box = $('word');
  box.innerHTML = '';
  for (var i = 0; i < w.en.length; i++) {
    var sp = document.createElement('span');
    sp.className = 'word__ch';
    var ch = w.en.charAt(i);
    if (i < state.typed.length) { sp.className += ' ok'; }
    else if (i === state.typed.length) { sp.className += ' cur'; }
    sp.textContent = ch;
    box.appendChild(sp);
  }
  var next = w.en.charAt(state.typed.length);
  $('hintline').innerHTML = next
    ? '下一个键 <kbd>' + next.toUpperCase() + '</kbd><span>（第 ' +
      (state.typed.length + 1) + ' / ' + w.en.length + ' 个字母）</span>'
    : '';
  renderDots();
}

function renderDots() {
  var box = $('dots');
  box.innerHTML = '';
  if (!state.lesson) { return; }
  for (var i = 0; i < state.lesson.words.length; i++) {
    var d = document.createElement('span');
    d.className = 'dot';
    if (i < state.index) { d.className += ' ok'; }
    else if (i === state.index) { d.className += ' cur'; }
    box.appendChild(d);
  }
}

function updateBar() {
  if (!state.lesson) { return; }
  var total = state.lesson.letters || 1;
  var done = 0;
  for (var i = 0; i < state.index; i++) { done += state.lesson.words[i].letters; }
  done += state.typed.length;
  var pct = clamp(done / total, 0, 1) * 100;
  $('barFill').style.width = pct.toFixed(1) + '%';
}

function updateHud() {
  $('statWords').firstChild.textContent = String(state.index);
  $('statCombo').firstChild.textContent = String(state.combo);
  var total = state.correct + state.errors;
  var acc = total > 0 ? (state.correct / total * 100) : 100;
  $('statAcc').firstChild.textContent = acc.toFixed(0) + '%';
  $('statAcc').classList.toggle('is-bad', acc < 85);
  $('statSpeed').firstChild.textContent = String(wpmNow().toFixed(0));
  $('statCombo').classList.toggle('is-hot', state.combo >= 5);
}

/** 当前速度（词/分）：没开始计时（还没敲第一个键）时是 0，避免 0 秒除出个天文数字 */
function wpmNow() {
  if (!state.startedAt) { return 0; }
  var sec = (Date.now() - state.startedAt) / 1000;
  if (sec <= 0.2) { return 0; }
  return state.index / sec * 60;
}

/* ============================================================================
 * 八、中文释义浮窗队列 —— 这个示例的核心
 *
 * 需求原话是「每打完整一个英语单词后，在上方弹出它的中文，停留几秒；如果连续打出单词，
 * 则中文意思依次展示出来」。落到实现上有三条硬约束，缺一条观感就变差：
 *
 *   ① **排队、不覆盖**：词打完就 enqueue，正在展示的那条不受影响（直接改写会让前一条的
 *      中文只闪一下，等于丢了——这正是「连续打词就看不到释义」的根因）；
 *   ② **依次展示**：上一条淡出之后才轮到下一条（drainPop 的尾回调），任何时刻浮窗层里
 *      只有一张卡，所以不会出现两三条中文挤在一起、谁也对不上哪个词的情况；
 *   ③ **停留时长自适应**：排队条数越多，单条停留越短（dwellFor）。固定 2.6 秒时，
 *      手快的小朋友打三个词就要等八秒才轮到当前词，反馈就彻底掉队了。
 *
 * 另外，浮窗是会走的，所以页脚另有一条**不走的清单**（#learned）：打完的词按顺序留在那里，
 * 回头还能扫一眼这一课学到了什么。
 * ========================================================================== */

/** 清空队列与浮窗层（换课 / 重打时调，避免上一课的中文串到下一课） */
function clearPopQueue() {
  state.popQueue = [];
  state.popShowing = false;
  state.popEl = null;
  state.popTimer = 0;
  $('popLayer').innerHTML = '';
}

/** 队列提示：还有几条在排队（手快时小朋友知道自己没漏掉任何一条） */
function renderPopMore() {
  var layer = $('popLayer');
  var old = layer.querySelector('.pop__more');
  if (old) { old.remove(); }
  var n = state.popQueue.length;
  if (n <= 0 || !state.popShowing) { return; }
  var chip = document.createElement('div');
  chip.className = 'pop__more';
  chip.textContent = '还有 ' + n + ' 条释义在排队';
  layer.appendChild(chip);
}

function buildPopCard(w) {
  var el = document.createElement('div');
  el.className = 'pop';
  el.dataset.en = w.en;
  el.innerHTML =
    '<span class="pop__en">' + w.en + '</span>' +
    '<span class="pop__ipa">' + w.ipa + '</span>' +
    '<span class="pop__pos">' + w.pos + '</span>' +
    '<span class="pop__sep"></span>' +
    '<span class="pop__zh">' + w.zh + '</span>';
  return el;
}

/** 单条停留时长：排队越多停留越短；下限 900ms（再短就看不清中文了） */
function dwellFor(pending) {
  if (pending >= 2) { return Math.max(900, Math.round(state.popMs * 0.45)); }
  if (pending === 1) { return Math.max(1400, Math.round(state.popMs * 0.7)); }
  return state.popMs;
}

/** 词打完就往队列里放一条；没在展示才启动排空循环 */
function enqueuePop(w) {
  state.popQueue.push(w);
  if (!state.popShowing) { drainPop(); }
  else { renderPopMore(); }     // 正在展示时入队：立刻把「还有 N 条」刷出来
}

/** 排空循环：取出队首 → 建卡 → 停留 dwell → 淡出 → 再来一轮 */
function drainPop() {
  var w = state.popQueue.shift();
  if (!w) {
    state.popShowing = false;
    state.popEl = null;
    renderPopMore();
    return;
  }
  state.popShowing = true;
  state.popShown += 1;
  state.popOrder.push(w.en);

  var el = buildPopCard(w);
  var dwell = dwellFor(state.popQueue.length);
  el.dataset.dwell = String(dwell);
  el.dataset.bornAt = String(Date.now());
  // 插在最前：新的一条出现在浮窗层顶部，排队提示条始终贴在最下面
  $('popLayer').insertBefore(el, $('popLayer').firstChild);
  state.popEl = el;
  renderPopMore();

  state.popTimer = setTimeout(function () {
    el.classList.add('is-out');
    setTimeout(function () {
      var bornAt = Number(el.dataset.bornAt) || Date.now();
      el.dataset.diedAt = String(Date.now());
      state.lastPopLivedMs = Date.now() - bornAt;
      if (el.parentNode) { el.remove(); }
      if (state.popEl === el) { state.popEl = null; }
      state.popShowing = false;
      drainPop();                       // 依次展示：上一条走了才轮到下一条
    }, 300);
  }, dwell);
}

/* ============================================================================
 * 九、打字判定
 *
 * 一律按 `word.en.charAt(typed.length)` 比对，不区分大小写地吃 a-z。
 * 打错**不回退**已打对的前缀：小学生最怕「一下子全没了」，错了只红一下、扣正确率。
 * ========================================================================== */
function typeLetter(ch) {
  var w = currentWord();
  if (!w || state.finished) { return; }
  if (!state.startedAt) { state.startedAt = Date.now(); }
  var expected = w.en.charAt(state.typed.length);
  if (ch === expected) {
    state.typed += ch;
    state.correct += 1;
    state.combo += 1;
    if (state.combo > state.bestCombo) { state.bestCombo = state.combo; }
    soundKey(state.combo);
    if (state.typed.length >= w.en.length) { completeWord(w); }
    else { renderWord(); }
  } else {
    state.errors += 1;
    state.combo = 0;
    soundErr();
    flashWrong();
  }
  updateHud();
  updateBar();
}

function flashWrong() {
  var box = $('word');
  var cur = box.querySelector('.word__ch.cur');
  if (cur) {
    cur.classList.add('wrong');
    setTimeout(function () { cur.classList.remove('wrong'); }, 200);
  }
  box.classList.remove('shake');
  void box.offsetWidth;             // 强制回流，连着打错时抖动也能重新播放
  box.classList.add('shake');
}

/** 一个词打完：记进「已学」→ 排一条中文释义 → 立刻进下一个词（不等浮窗） */
function completeWord(w) {
  soundWord();
  state.learned.push(w);
  addLearnedChip(w);
  enqueuePop(w);
  state.index += 1;
  state.typed = '';
  if (state.index >= state.lesson.words.length) { finishLesson(); }
  else { renderWord(); }
}

/** 页脚的「已经打过的词」：不走的清单，浮窗走了它还在 */
function addLearnedChip(w) {
  var box = $('learned');
  var chip = document.createElement('span');
  chip.className = 'chip';
  chip.innerHTML = '<b>' + w.en + '</b><i>' + w.zh + '</i>';
  box.appendChild(chip);
  box.scrollLeft = box.scrollWidth;
}

/* ============================================================================
 * 十、本课结算
 *
 * 成绩**由仓颉侧判定星级并落盘**（`score:save`），页面只负责把这一轮的数字报上去、
 * 再把回来的星级画出来——星级门槛只该有一份实现，否则页面与宿主迟早各算一套。
 * ========================================================================== */
function finishLesson() {
  state.finished = true;
  soundDone();
  var words = state.lesson.words.length;
  var seconds = state.startedAt ? (Date.now() - state.startedAt) / 1000 : 0;
  var total = state.correct + state.errors;
  var acc = total > 0 ? (state.correct / total * 100) : 0;
  var wpm = seconds > 0.2 ? (words * 60 / seconds) : 0;

  state.lastResult = {
    seconds: seconds, words: words, correct: state.correct,
    errors: state.errors, accuracy: acc, wpm: wpm, bestCombo: state.bestCombo
  };

  $('settleWords').textContent = String(words);
  $('settleAcc').textContent = acc.toFixed(0) + '%';
  $('settleSpeed').textContent = wpm.toFixed(0);
  var review = $('settleReview');
  review.innerHTML = '';
  for (var i = 0; i < state.learned.length; i++) {
    var w = state.learned[i];
    var chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = '<b>' + w.en + '</b><i>' + w.zh + '</i>';
    review.appendChild(chip);
  }
  // 先按最低档画上，避免「0 星」闪一下；宿主回投后立刻改成真星级
  $('settleStars').innerHTML = starsHtml(1);
  $('settleHeadline').textContent = '这一课打完啦，正在记录成绩…';
  $('settle').classList.remove('hidden');

  var payload = {
    id: state.lesson.id,
    title: state.lesson.title,
    seconds: seconds,
    correct: state.correct,
    errors: state.errors,
    words: words
  };
  invoke('score:save', payload).then(function (res) {
    state.lastSave = res || {};
    var stars = Number(res && res.stars) || 1;
    $('settleStars').innerHTML = starsHtml(stars);
    $('settleHeadline').textContent = (res && res.updated)
      ? '新纪录！这一课打完了'
      : '这一课打完了';
    // 破纪录时把「上次最好」也一并说出来，比一个孤零零的星级更有意义
    if (res && res.bestStars) {
      var extra = document.createElement('div');
      extra.className = 'card__best';
      extra.style.marginTop = '2px';
      extra.textContent = '最好成绩：' + res.bestStars + '★ · ' + res.bestWpm +
        ' 词/分 · 正确 ' + res.bestAccuracy + '%';
      $('settleStars').parentNode.insertBefore(extra, $('settleStars').nextSibling);
    }
  }).catch(function (e) {
    $('settleHeadline').textContent = '这一课打完了（成绩没能写进仓颉侧）';
    banner('score:save 失败：' + (e && e.message ? e.message : e), true);
  });
}

/* ============================================================================
 * 十一、键盘
 * ========================================================================== */
document.addEventListener('keydown', function (ev) {
  if (ev.metaKey || ev.ctrlKey || ev.altKey) { return; }
  var key = ev.key;
  if (key === 'Escape') {
    ev.preventDefault();
    showPicker();
    return;
  }
  if (key === 'Enter') {
    ev.preventDefault();
    if (!$('settle').classList.contains('hidden')) { restartCurrent(); }
    return;
  }
  if (typeof key !== 'string' || key.length !== 1) { return; }
  var lower = key.toLowerCase();
  if (lower < 'a' || lower > 'z') { return; }
  ev.preventDefault();
  if (!$('picker').classList.contains('hidden')) { return; }
  if (!$('settle').classList.contains('hidden')) { return; }
  typeLetter(lower);
});

$('btnPick').addEventListener('click', showPicker);
$('btnNext').addEventListener('click', showPicker);
$('btnAgain').addEventListener('click', restartCurrent);
$('btnQuit').addEventListener('click', function () {
  invoke('typing:quit', {}).catch(function () {});
});

/* ============================================================================
 * 十二、无人值守自检（run.bat selfcheck / 环境变量 CJ_TYPING_SELFCHECK=1）
 *
 * 判据全部回投到仓颉侧 stderr（`report` 命令），与仓内其它示例同一套取证通道：
 * 每条 `PASS <名字>` / `FAIL <名字> :: <为什么>`，最后一行 `DONE passed=N failed=M`。
 *
 * 这个自检的重点是**浮窗的三条硬约束**（排队不覆盖、依次展示、停留时长），因为它们
 * 恰恰是人眼看不出问题的那类缺陷：连续打词时前一条被盖掉，画面上一闪而过，
 * 除了「感觉少了点什么」没有任何报错——只能靠断言。
 * ========================================================================== */
var sc = { pass: 0, fail: 0 };

function scLine(text) {
  invoke('report', { line: text }).catch(function () { /* 回投失败也要继续跑完 */ });
}
function scOk(name) { sc.pass += 1; scLine('PASS ' + name); }
function scBad(name, why) { sc.fail += 1; scLine('FAIL ' + name + ' :: ' + (why || '')); }
function scCheck(name, cond, why) { if (cond) { scOk(name); } else { scBad(name, why); } }

/** 打一个真实按键：走完整的 keydown 链路（不绕过事件、不直接调 typeLetter） */
function pressKey(ch) {
  document.dispatchEvent(new KeyboardEvent('keydown', { key: ch, bubbles: true, cancelable: true }));
}
function typeWordSync(en) {
  for (var i = 0; i < en.length; i++) { pressKey(en.charAt(i)); }
}

/** 等一个条件成立（最多 timeoutMs），返回是否等到——别用固定 sleep 猜时序 */
function waitUntil(fn, timeoutMs) {
  return new Promise(function (resolve) {
    var waited = 0;
    (function poll() {
      if (fn()) { resolve(true); return; }
      waited += 50;
      if (waited >= timeoutMs) { resolve(false); return; }
      setTimeout(poll, 50);
    })();
  });
}

function pickSmallestLesson() {
  var best = state.lessons[0];
  for (var i = 1; i < state.lessons.length; i++) {
    if (state.lessons[i].count < best.count) { best = state.lessons[i]; }
  }
  return best;
}

async function runSelfCheck() {
  try {
    state.mute = true;                       // 无头环境不建 AudioContext
    var cfg = state.cfg || {};

    scCheck('自检模式已开启', !!cfg.selfCheck, 'cfg.selfCheck=' + cfg.selfCheck);
    scCheck('宿主下发了弹窗停留时长', state.popMs >= 600 && state.popMs <= 12000,
      'popMs=' + state.popMs);
    scCheck('词库课数不少于 8 课', state.lessons.length >= 8, 'lessons=' + state.lessons.length);

    // ---- 词条完整性：页面侧独立再校一遍（宿主已校过，这里防的是「下发时就坏了」）
    var total = 0;
    var missing = '';
    var badChar = '';
    var dup = '';
    var seen = {};
    for (var i = 0; i < state.lessons.length; i++) {
      var ls = state.lessons[i];
      for (var j = 0; j < ls.words.length; j++) {
        var w = ls.words[j];
        total += 1;
        if (!w.en || !w.ipa || !w.zh) { missing += (missing ? ',' : '') + ls.id + '/' + (w.en || '?'); }
        if (!/^[a-z]+$/.test(w.en)) { badChar += (badChar ? ',' : '') + w.en; }
        if (seen[w.en]) { dup += (dup ? ',' : '') + w.en; }
        seen[w.en] = true;
      }
    }
    scCheck('词库共 ' + total + ' 个词', total >= 90, 'total=' + total);
    scCheck('每个词都有音标与中文释义', missing === '', missing);
    scCheck('单词只含小写字母（页面只吃 a-z 键）', badChar === '', badChar);
    scCheck('词库没有重复词', dup === '', dup);

    // ---- 选课面板
    scCheck('选课面板渲染出全部课卡',
      $('cards').querySelectorAll('.card').length === state.lessons.length,
      'cards=' + $('cards').querySelectorAll('.card').length);

    // ---- 进一课（挑词数最少的，自检跑得快）
    var lesson = pickSmallestLesson();
    startLesson(lesson);
    await sleep(80);
    var w0 = lesson.words[0];
    scCheck('单词区是逐字母 span（长度 = 词长）',
      $('word').querySelectorAll('.word__ch').length === w0.en.length,
      'spans=' + $('word').querySelectorAll('.word__ch').length + ' len=' + w0.en.length);
    scCheck('音标显示出来', $('ipa').textContent === w0.ipa, $('ipa').textContent);
    scCheck('提示行指出下一个键',
      $('hintline').textContent.indexOf(w0.en.charAt(0).toUpperCase()) >= 0,
      $('hintline').textContent);

    // ---- 打错一个字母：扣正确率、连击归零、但前缀不回退
    pressKey(w0.en.charAt(0) === 'z' ? 'y' : 'z');
    await sleep(30);
    scCheck('打错字母只记错、不前进',
      state.errors === 1 && state.index === 0 && state.typed === '',
      'errors=' + state.errors + ' index=' + state.index + ' typed=' + state.typed);

    // ---- 打完整第一个词：**中文释义必须浮出来**
    typeWordSync(w0.en);
    await sleep(80);
    scCheck('打完整一个词后浮窗出现', !!state.popEl, 'popEl=null');
    scCheck('浮窗英文是刚打的词',
      !!state.popEl && state.popEl.dataset.en === w0.en,
      state.popEl ? state.popEl.dataset.en : 'none');
    scCheck('浮窗中文就是该词的释义',
      !!state.popEl && state.popEl.querySelector('.pop__zh').textContent === w0.zh,
      state.popEl ? state.popEl.querySelector('.pop__zh').textContent : 'none');
    var popRect = state.popEl ? state.popEl.getBoundingClientRect() : null;
    var wordRect = $('word').getBoundingClientRect();
    scCheck('浮窗落在单词上方',
      !!popRect && popRect.bottom <= wordRect.top,
      popRect ? ('pop.bottom=' + Math.round(popRect.bottom) + ' word.top=' + Math.round(wordRect.top)) : 'none');
    scCheck('页脚「已学」清单记下了这个词',
      $('learned').textContent.indexOf(w0.en) >= 0,
      $('learned').textContent);
    scCheck('打完一个词就立刻进下一个词（不等浮窗）',
      state.index === 1 && state.typed === '',
      'index=' + state.index + ' typed=' + state.typed);

    // ---- 连续打词：排队、不覆盖、一次只一张、依次展示
    var w1 = lesson.words[1];
    var w2 = lesson.words[2];
    typeWordSync(w1.en);
    typeWordSync(w2.en);
    await sleep(60);
    scCheck('连打三个词后队列里还有没展示的释义',
      state.popQueue.length >= 1,
      'queue=' + state.popQueue.length + ' shown=' + state.popShown);
    scCheck('浮窗层同一时刻只有一张卡',
      $('popLayer').querySelectorAll('.pop').length === 1,
      'cards=' + $('popLayer').querySelectorAll('.pop').length);
    scCheck('排队提示条出现', !!$('popLayer').querySelector('.pop__more'),
      $('popLayer').textContent);
    scCheck('正在展示的仍是第一条（没有被后来的词覆盖）',
      !!state.popEl && state.popEl.dataset.en === w0.en,
      state.popEl ? state.popEl.dataset.en : 'none');

    // ---- 把这一课剩下的词全打完
    for (var k = 3; k < lesson.words.length; k++) { typeWordSync(lesson.words[k].en); }
    await sleep(80);
    scCheck('打完整课触发结算面板', !$('settle').classList.contains('hidden'));
    scCheck('结算词数等于本课词数',
      $('settleWords').textContent === String(lesson.count),
      $('settleWords').textContent + ' vs ' + lesson.count);
    scCheck('进度条走到 100%',
      Math.round(parseFloat($('barFill').style.width || '0')) === 100,
      $('barFill').style.width);

    // ---- 等浮窗队列全部走完：条数与顺序都必须是「打完的顺序」
    var waitMs = Math.max(4000, lesson.words.length * (state.popMs + 400) + 1500);
    var drained = await waitUntil(function () {
      return state.popShown >= lesson.words.length && !state.popShowing && !state.popEl;
    }, waitMs);
    scCheck('每条释义最终都被展示（条数 = 本课词数）',
      drained && state.popShown === lesson.words.length,
      'shown=' + state.popShown + ' expect=' + lesson.words.length);
    var orderOk = true;
    var orderWhy = '';
    for (var m = 0; m < lesson.words.length; m++) {
      if (state.popOrder[m] !== lesson.words[m].en) {
        orderOk = false;
        orderWhy = '第 ' + (m + 1) + ' 条是 ' + state.popOrder[m] + '，应为 ' + lesson.words[m].en;
        break;
      }
    }
    scCheck('连续打词时中文按打词顺序依次展示', orderOk, orderWhy);
    scCheck('每条释义都停留了可见的时长（≥600ms）',
      state.lastPopLivedMs >= 600, 'lived=' + state.lastPopLivedMs + 'ms');
    scCheck('全部展示完后浮窗层清空',
      $('popLayer').querySelectorAll('.pop').length === 0,
      'cards=' + $('popLayer').querySelectorAll('.pop').length);

    // ---- 成绩回投
    var saved = await waitUntil(function () { return !!state.lastSave; }, 4000);
    scCheck('score:save 有回投', saved, 'lastSave=null');
    var ls1 = state.lastSave || {};
    scCheck('宿主判定的星级在 1~3 之间',
      typeof ls1.stars === 'number' && ls1.stars >= 1 && ls1.stars <= 3, 'stars=' + ls1.stars);
    scCheck('成绩真的写进了磁盘', ls1.persisted === true, 'persisted=' + ls1.persisted);
    scCheck('结算面板画出了宿主回投的星级',
      $('settleStars').textContent.replace(/[^★]/g, '').length >= 1,
      $('settleStars').textContent);

    var list = null;
    try { list = await invoke('score:list', {}); } catch (e) { list = null; }
    scCheck('score:list 里有这一课的成绩记录',
      !!list && !!list[lesson.id] && Number(list[lesson.id].attempts) >= 1,
      JSON.stringify(list && list[lesson.id] ? list[lesson.id].attempts : null));

    // ---- 权限边界：登记了但没实现的命令、清单里没写的命令
    var notRegistered = '';
    try { await invoke('word:nope', {}); } catch (e) { notRegistered = String(e && e.message || e); }
    scCheck('清单登记了但没实现的命令被拒（not registered）',
      notRegistered.indexOf('not registered') >= 0, notRegistered);

    var notAllowed = '';
    try { await invoke('typing:nope', {}); } catch (e) { notAllowed = String(e && e.message || e); }
    scCheck('清单里没写的命令被拒（not allowed）',
      notAllowed.indexOf('not allowed') >= 0, notAllowed);

    var ver = null;
    try { ver = await invoke('system:version', {}); } catch (e) { ver = null; }
    scCheck('system:version 返回框架版本',
      !!ver && typeof ver.version === 'string' && ver.version.length > 0,
      JSON.stringify(ver));

    // ---- 重打一课：状态清干净，浮窗与已学清单都不残留
    restartCurrent();
    await sleep(120);
    scCheck('「再打一遍」把状态清干净',
      state.index === 0 && state.typed === '' && state.popShown === 0 &&
        $('learned').children.length === 0 &&
        $('popLayer').querySelectorAll('.pop').length === 0,
      'index=' + state.index + ' shown=' + state.popShown +
        ' learned=' + $('learned').children.length);
  } catch (e) {
    scBad('自检过程抛异常', String(e && e.stack || e));
  }

  scLine('DONE passed=' + sc.pass + ' failed=' + sc.fail);
  // 跑完自己收尾：无人值守不该留一扇窗等人关。
  // 只经 `typing:quit` 走应用级退出——页面自己 window.close() 会绕开宿主销毁 WebKit 窗口，
  // 在 Linux 上正好落进「退出期析构里 abort」（AGENTS §4 那条）。
  setTimeout(function () {
    invoke('typing:quit', {}).catch(function () {});
  }, 500);
}

/* ============================================================================
 * 十三、启动
 * ========================================================================== */
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function boot() {
  waitForBridge(function () {
    invoke('typing:config', {}).then(function (cfg) {
      state.cfg = cfg || {};
      state.popMs = clamp(Number(state.cfg.popMs) || 2600, 600, 12000);
      if (state.cfg.selfCheck) { state.mute = true; }
      return Promise.all([invoke('word:list', {}), invoke('score:list', {})]);
    }).then(function (res) {
      state.lessons = res[0] || [];
      state.records = res[1] || {};
      if (!state.lessons.length) {
        banner('词库是空的：仓颉侧 word:list 没返回任何课', true);
        return;
      }
      hideBanner();
      renderPicker();

      var preset = null;
      if (state.cfg.startLesson) {
        for (var i = 0; i < state.lessons.length; i++) {
          if (state.lessons[i].id === state.cfg.startLesson) { preset = state.lessons[i]; break; }
        }
        if (!preset) {
          banner('CJ_TYPING_LESSON=' + state.cfg.startLesson + ' 找不到对应的课，改从面板挑', true);
        }
      }
      if (preset) { startLesson(preset); } else { showPicker(); }
      if (state.cfg.selfCheck) { runSelfCheck(); }
    }).catch(function (e) {
      banner('初始化失败：' + (e && e.message ? e.message : e), true);
    });
  });
}

boot();
</script>
