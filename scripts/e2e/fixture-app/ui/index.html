<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>cj-tauri e2e fixture</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; padding: 32px; }
  h1 { color: #7ce7ff; font-size: 20px; }
  pre { background: #16213e; border-radius: 8px; padding: 16px; font-size: 13px; white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>cj-tauri E2E 探针</h1>
  <pre id="out">等待桥…</pre>
<script>
// 等桥出现再动手：模块/页面脚本早于 document-start 注入的桥时不成立，桥就绪时间不保证。
// 这是 AGENTS §4 的既有约定（模板里的 waitForBridge），探针页必须照办，否则拿到 undefined。
function waitForBridge(cb, tries) {
  tries = tries || 0;
  if (window.__CJ_TAURI__) { cb(); return; }
  if (tries > 200) { document.getElementById('out').textContent = 'bridge timeout'; return; }
  setTimeout(function () { waitForBridge(cb, tries + 1); }, 25);
}

function render(lines) {
  document.getElementById('out').textContent = lines.join(String.fromCharCode(10));
}

waitForBridge(function () {
  var t = window.__CJ_TAURI__;
  var lines = [];
  var done = 0;
  var TOTAL = 9;
  // 一轮往返 = 9 条命令（version / ping / 未授权 devtools / host 能力位 /
  // clipboard 写读回环 / notification 桩如实拒绝 / serial 枚举 /
  // log:path 回读 / log:write 前端诊断落盘）；全部回齐后整体回投。
  function finish() {
    done++;
    if (done < TOTAL) { render(lines); return; }
    render(lines);
    t.invoke('probe:echo', { line: lines.join(' | ') });
  }

  t.invoke('system:version').then(function (v) {
    lines.push('version=' + v.version + ' platform=' + v.platform + ' protocol=' + v.protocol);
    finish();
  }).catch(function (e) { lines.push('version FAIL: ' + e.message); finish(); });

  t.invoke('system:ping').then(function (v) {
    lines.push('ping=' + v);
    finish();
  }).catch(function (e) { lines.push('ping FAIL: ' + e.message); finish(); });

  // 未授权命令：清单里没有 system:devtools，应被拒——拒绝路径也要在实机上验一遍，
  // 否则「拦得住」只是纸面结论（AGENTS §4：没抓到 reject ≠ 成功，但抓到 reject 才是凭证）。
  t.invoke('system:devtools').then(function () {
    lines.push('DENY-FAIL devtools 被放行');
    finish();
  }).catch(function (e) {
    lines.push('DENY-OK devtools: ' + e.message);
    finish();
  });

  // 宿主能力位：每个平台如实上报自己的能力（Windows 期望 menu=1 tray=1 hotkey=1 dragDrop=1）。
  t.invoke('system:host').then(function (v) {
    lines.push('host=' + v.platform + ' menu=' + v.menu + ' tray=' + v.tray +
               ' dragDrop=' + v.dragDrop + ' hotkey=' + v.hotkey);
    finish();
  }).catch(function (e) { lines.push('host FAIL: ' + e.message); finish(); });

  // 剪贴板（Windows 真实现）：写一条带标记的文本再读回，值一致才算通。
  var token = 'e2e-clip-' + String((new Date()).getTime());
  t.invoke('clipboard:write', { text: token }).then(function () {
    return t.invoke('clipboard:read');
  }).then(function (v) {
    lines.push('clipboard roundtrip=' + (v === token ? 'OK' : 'MISMATCH'));
    finish();
  }).catch(function (e) { lines.push('clipboard FAIL: ' + e.message); finish(); });

  // 通知：真实现（Windows PowerShell toast / Linux freedesktop）应发送成功；
  // 若平台是桩则如实拒绝——两平台的合法形状都回投，判据在 E2E 断言里按平台写。
  t.invoke('notification:notify', { title: 'cj-tauri e2e', body: 'probe' }).then(function () {
    lines.push('notification SENT-OK');
    finish();
  }).catch(function (e) {
    lines.push('notification REJECTED: ' + e.message);
    finish();
  });

  // 串口（Windows 真实现）：枚举 COM 口，有结果（哪怕 0 个）即链路通。
  t.invoke('serial:list').then(function (v) {
    var n = v && v.ports ? v.ports.length : -1;
    lines.push('serial:list ports=' + n);
    finish();
  }).catch(function (e) { lines.push('serial FAIL: ' + e.message); finish(); });

  // 日志落盘（RFC-003 第 5 期）：本工程不显式开日志，路径由 CJ_TAURI_LOG 兜底给。
  // 回读到的路径随标记行一起写回日志：这样 log:path 的返回值也成了**落盘的凭证**，
  // 不依赖页面最后那条聚合行（聚合行要等九条探针全落定，其中一条在无通知守护的
  // Xvfb 下可能挂住——那是探针工程自己的事，不该拖住日志这条链路的取证）。
  // 之后用小预算（CJ_TAURI_LOG_MAX_KB=1）压轮转：连写 25 行 ~100 字节的填充，够翻两轮档案。
  var pad = 'pppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppp';
  function fillerBurst(n, acc) {
    if (n <= 0) { return Promise.resolve(acc); }
    return t.invoke('log:write', { line: '[frontend] e2e filler ' + n + ' ' + pad }).then(function (ok) {
      return fillerBurst(n - 1, acc + (ok ? 1 : 0));
    });
  }
  t.invoke('log:path').then(function (p) {
    lines.push('log:path=' + (p ? p : '(off)'));
    return t.invoke('log:write', { line: '[frontend] e2e probe marker=gamma path=' + (p ? p : '(off)') });
  }).then(function (ok) {
    var marker = ok ? 'OK' : 'OFF';
    return fillerBurst(25, 0).then(function (written) {
      lines.push('log:write=' + marker + ' filler=' + written);
      finish();
    });
  }).catch(function (e) { lines.push('log FAIL: ' + e.message); finish(); });
});
</script>
</body>
</html>
